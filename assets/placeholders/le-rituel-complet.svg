<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F1"/>
      <stop offset="55%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F0E5D0"/>
    </linearGradient>
    <radialGradient id="haloGold" cx="0.5" cy="0.42" r="0.4">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.42"/>
      <stop offset="40%" stop-color="#C9A96E" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#C9A96E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloRose" cx="0.2" cy="0.18" r="0.5">
      <stop offset="0%" stop-color="#F4E4E0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F4E4E0" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.75  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#haloRose)"/>
  <rect width="1000" height="1250" fill="url(#haloGold)"/>
  <rect width="1000" height="1250" filter="url(#noise)" opacity="0.4"/>

  <g transform="translate(500, 525)">
    <circle r="260" fill="none" stroke="#C9A96E" stroke-width="0.7" opacity="0.4"/>
    <circle r="200" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.3"/>
    <g opacity="0.55">
      <circle cx="-130" cy="-130" r="38" fill="none" stroke="#E13F3F" stroke-width="1.2"/>
      <circle cx="-130" cy="-130" r="3" fill="#E13F3F"/>
      <text x="-130" y="-72" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
            font-size="11" letter-spacing="2" fill="#3D342C" font-weight="400">SIGNATURE</text>
      <circle cx="130" cy="-130" r="38" fill="none" stroke="#5B7FB0" stroke-width="1.2"/>
      <circle cx="130" cy="-130" r="3" fill="#5B7FB0"/>
      <text x="130" y="-72" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
            font-size="11" letter-spacing="2" fill="#3D342C" font-weight="400">PRO</text>
      <ellipse cx="-130" cy="120" rx="50" ry="22" fill="none" stroke="#E8B86A" stroke-width="1.2"/>
      <circle cx="-130" cy="120" r="3" fill="#E8B86A"/>
      <text x="-130" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
            font-size="11" letter-spacing="2" fill="#3D342C" font-weight="400">REGARD</text>
      <path d="M 80 120 Q 80 95 105 90 Q 130 85 155 90 Q 180 95 180 120" fill="none" stroke="#C9695A" stroke-width="1.2"/>
      <circle cx="130" cy="105" r="3" fill="#C9695A"/>
      <text x="130" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
            font-size="11" letter-spacing="2" fill="#3D342C" font-weight="400">DÉCOLLETÉ</text>
    </g>
    <text y="6" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
          font-size="42" font-style="italic" fill="#6B2336" opacity="0.65" font-weight="400">le rituel</text>
  </g>

  <text x="500" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="14" letter-spacing="8" fill="#C9A96E" font-weight="500">
    AURÉLIA · PARIS
  </text>
  <line x1="478" y1="160" x2="522" y2="160" stroke="#C9A96E" stroke-width="0.8" opacity="0.5"/>

  <text x="500" y="935" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="64" fill="#1A1410" font-weight="400">Le Rituel Complet</text>
  <text x="500" y="985" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="30" fill="#6B2336" font-weight="300" font-style="italic">Bundle 4 dispositifs</text>

  <line x1="450" y1="1055" x2="550" y2="1055" stroke="#C9A96E" stroke-width="0.5" opacity="0.5"/>
  <text x="500" y="1095" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="13" letter-spacing="4" fill="#3D342C" font-weight="500">
    SIGNATURE · PRO · REGARD · DÉCOLLETÉ
  </text>
  <text x="500" y="1125" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="11" letter-spacing="3" fill="#6B5F54" font-weight="300">
    ÉCONOMISEZ 92 € · LIVRAISON EXPRESS OFFERTE
  </text>

  <text x="62" y="1195" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="38" fill="#C9A96E" font-weight="500" opacity="0.45" font-style="italic">A.</text>
</svg>
