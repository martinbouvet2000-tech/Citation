<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F1"/>
      <stop offset="55%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F0E5D0"/>
    </linearGradient>
    <radialGradient id="haloRed" cx="0.38" cy="0.42" r="0.22">
      <stop offset="0%" stop-color="#E13F3F" stop-opacity="0.40"/>
      <stop offset="80%" stop-color="#E13F3F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloBlue" cx="0.62" cy="0.36" r="0.22">
      <stop offset="0%" stop-color="#5B7FB0" stop-opacity="0.38"/>
      <stop offset="80%" stop-color="#5B7FB0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloAmber" cx="0.42" cy="0.5" r="0.2">
      <stop offset="0%" stop-color="#E8B86A" stop-opacity="0.42"/>
      <stop offset="80%" stop-color="#E8B86A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGreen" cx="0.58" cy="0.48" r="0.18">
      <stop offset="0%" stop-color="#7AAB7A" stop-opacity="0.34"/>
      <stop offset="80%" stop-color="#7AAB7A" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.75  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#haloRed)"/>
  <rect width="1000" height="1250" fill="url(#haloBlue)"/>
  <rect width="1000" height="1250" fill="url(#haloAmber)"/>
  <rect width="1000" height="1250" fill="url(#haloGreen)"/>
  <rect width="1000" height="1250" filter="url(#noise)" opacity="0.4"/>

  <g transform="translate(500, 525)">
    <circle r="230" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
    <circle r="185" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.3"/>
    <circle r="140" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.25"/>
    <circle r="95" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.2"/>
    <circle r="50" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.18"/>
    <g opacity="0.55">
      <circle cx="-220" cy="0" r="3" fill="#E13F3F"/>
      <circle cx="-156" cy="156" r="3" fill="#5B7FB0"/>
      <circle cx="0" cy="220" r="3" fill="#E8B86A"/>
      <circle cx="156" cy="156" r="3" fill="#7AAB7A"/>
      <circle cx="220" cy="0" r="3" fill="#E13F3F"/>
      <circle cx="156" cy="-156" r="3" fill="#5B7FB0"/>
      <circle cx="0" cy="-220" r="3" fill="#E8B86A"/>
      <circle cx="-156" cy="-156" r="3" fill="#7AAB7A"/>
    </g>
