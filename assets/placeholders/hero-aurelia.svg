<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F1"/>
      <stop offset="50%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F0E5D0"/>
    </linearGradient>
    <radialGradient id="haloGold" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#E8B86A" stop-opacity="0.42"/>
      <stop offset="40%" stop-color="#C9A96E" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#C9A96E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloRose" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#F4E4E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F4E4E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloBordeaux" cx="0.8" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#6B2336" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6B2336" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.75  0 0 0 0.06 0"/>
    </filter>
    <radialGradient id="sunRays" cx="0.5" cy="0.42" r="0.45">
