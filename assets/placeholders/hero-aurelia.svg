      <stop offset="30%" stop-color="#F0E5D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E5D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#haloRose)"/>
  <rect width="1000" height="1250" fill="url(#haloGold)"/>
  <rect width="1000" height="1250" fill="url(#haloBordeaux)"/>
  <rect width="1000" height="1250" filter="url(#noise)" opacity="0.5"/>

  <g transform="translate(500, 520)">
