      <line x1="198" y1="-198" x2="184" y2="-184" stroke="#C9A96E" stroke-width="0.8"/>
      <line x1="280" y1="0" x2="260" y2="0" stroke="#C9A96E" stroke-width="1"/>
      <line x1="198" y1="198" x2="184" y2="184" stroke="#C9A96E" stroke-width="0.8"/>
      <line x1="0" y1="280" x2="0" y2="260" stroke="#C9A96E" stroke-width="1"/>
      <line x1="-198" y1="198" x2="-184" y2="184" stroke="#C9A96E" stroke-width="0.8"/>
      <line x1="-280" y1="0" x2="-260" y2="0" stroke="#C9A96E" stroke-width="1"/>
      <line x1="-198" y1="-198" x2="-184" y2="-184" stroke="#C9A96E" stroke-width="0.8"/>
    </g>
    <circle r="240" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
    <circle r="190" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.32"/>
    <circle r="140" fill="none" stroke="#C9A96E" stroke-width="0.4" opacity="0.25"/>
