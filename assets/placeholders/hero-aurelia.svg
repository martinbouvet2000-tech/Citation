  </g>

  <text x="500" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="14" letter-spacing="10" fill="#C9A96E" font-weight="500">
    MAISON AURÉLIA · PARIS
  </text>
  <line x1="465" y1="160" x2="535" y2="160" stroke="#C9A96E" stroke-width="0.8" opacity="0.5"/>

  <text x="500" y="920" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="68" fill="#1A1410" font-weight="400">La lumière,</text>
  <text x="500" y="985" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
