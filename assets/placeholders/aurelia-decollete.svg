<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F1"/>
      <stop offset="55%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F0E5D0"/>
    </linearGradient>
    <radialGradient id="haloLed" cx="0.5" cy="0.45" r="0.34">
      <stop offset="0%" stop-color="#C9695A" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#C9695A" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#C9695A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C9695A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloRose" cx="0.2" cy="0.18" r="0.5">
      <stop offset="0%" stop-color="#F4E4E0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F4E4E0" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.75  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#haloRose)"/>
  <rect width="1000" height="1250" fill="url(#haloLed)"/>
  <rect width="1000" height="1250" filter="url(#noise)" opacity="0.4"/>

  <g transform="translate(500, 560)">
    <path d="M -240 0 Q -240 -100 -180 -120 Q 0 -160 180 -120 Q 240 -100 240 0 Q 240 100 200 130 L 180 150 L -180 150 L -200 130 Q -240 100 -240 0 Z"
          fill="none" stroke="#C9695A" stroke-width="0.6" opacity="0.4"/>
    <path d="M -200 0 Q -200 -85 -150 -100 Q 0 -130 150 -100 Q 200 -85 200 0 Q 200 80 170 105 L -170 105 Q -200 80 -200 0 Z"
          fill="none" stroke="#C9695A" stroke-width="0.5" opacity="0.32"/>
    <path d="M -160 0 Q -160 -70 -120 -80 Q 0 -105 120 -80 Q 160 -70 160 0 Q 160 65 140 85 L -140 85 Q -160 65 -160 0 Z"
          fill="none" stroke="#C9695A" stroke-width="0.45" opacity="0.25"/>
    <g fill="#C9695A" opacity="0.5">
      <circle cx="-200" cy="-40" r="2.5"/>
      <circle cx="-130" cy="-100" r="2.5"/>
      <circle cx="0" cy="-130" r="2.5"/>
      <circle cx="130" cy="-100" r="2.5"/>
      <circle cx="200" cy="-40" r="2.5"/>
      <circle cx="-160" cy="60" r="2"/>
      <circle cx="0" cy="80" r="2"/>
      <circle cx="160" cy="60" r="2"/>
    </g>
  </g>

  <text x="500" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="14" letter-spacing="8" fill="#C9A96E" font-weight="500">
    AURÉLIA · PARIS
  </text>
  <line x1="478" y1="160" x2="522" y2="160" stroke="#C9A96E" stroke-width="0.8" opacity="0.5"/>

  <text x="500" y="935" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="74" fill="#1A1410" font-weight="400">Décolleté</text>
  <text x="500" y="990" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="32" fill="#6B2336" font-weight="300" font-style="italic">Cou &amp; décolleté</text>

  <line x1="450" y1="1055" x2="550" y2="1055" stroke="#C9A96E" stroke-width="0.5" opacity="0.5"/>
  <text x="500" y="1095" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="13" letter-spacing="4" fill="#3D342C" font-weight="500">
    ROUGE 633nm + AMBRÉE 590nm · 10 MIN
  </text>
  <text x="500" y="1125" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="11" letter-spacing="3" fill="#6B5F54" font-weight="300">
    FERMETÉ &amp; ÉCLAT EN 6 SEMAINES
  </text>

  <text x="62" y="1195" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="38" fill="#C9A96E" font-weight="500" opacity="0.45" font-style="italic">A.</text>
