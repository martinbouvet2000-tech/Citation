const MOTIV_SKELETONS = {
  "Pourquoi avez-vous choisi la medecine et pas une autre filiere de sante ?": "🎯 INTRODUCTION\nQuestion classique qui attend une reponse personnelle et authentique. Le jury veut comprendre ce qui distingue la medecine des autres filieres de sante (pharma, kine, infirmier) dans votre projet.\n\n💡 DEVELOPPEMENT\n• Axe 1 : La specificite de la medecine — vision globale du patient, demarche diagnostique, relation de confiance unique, responsabilite du parcours de soin\n• Axe 2 : Ce qui vous differencie — experience personnelle, rencontre marquante, moment declencheur concret qui a oriente vers la medecine plutot qu'une autre filiere\n• Conseil : Montrer que vous connaissez les autres filieres et que votre choix est eclaire, pas par defaut\n\n✅ CONCLUSION\nLa medecine repond a votre besoin d'accompagner les patients dans leur globalite. Ouverture : la pluridisciplinarite vous interesse et la medecine est le socle ideal pour collaborer avec les autres professionnels de sante.",
  "Quel type de medecin souhaitez-vous devenir et pourquoi ?": "🎯 INTRODUCTION\nLe jury evalue votre projection professionnelle et la coherence de votre projet. Il ne s'agit pas de donner une specialite definitive mais de montrer une reflexion mure.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Votre vision du medecin que vous voulez etre — generaliste vs specialiste, contact humain vs technique, hopital vs liberal, recherche vs clinique\n• Axe 2 : Les valeurs qui guident ce choix — proximite avec les patients, impact sur la sante publique, defi intellectuel, engagement territorial\n• Conseil : Rester ouvert — dire que les stages et l'externat affineront votre choix montre de la maturite, pas de l'indecision\n\n✅ CONCLUSION\nVotre projet est en construction mais ancre dans des valeurs solides. Ouverture : les etudes de medecine sont justement faites pour decouvrir et affiner son orientation.",
  "Qu'est-ce qui vous a marque ou inspire dans le domaine de la sante ?": "🎯 INTRODUCTION\nQuestion ouverte qui teste votre curiosite et votre sensibilite au monde medical. Le jury attend un recit personnel et une reflexion, pas une reponse scolaire.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Une experience vecue — hospitalisation personnelle ou d'un proche, rencontre avec un soignant, benevolat, evenement marquant\n• Axe 2 : Une decouverte intellectuelle — lecture, documentaire, actualite sanitaire (Covid, therapies geniques, IA en sante) qui a nourri votre reflexion\n• Conseil : Raconter une histoire concrete avec un avant et un apres — le jury retient les recits authentiques\n\n✅ CONCLUSION\nCette experience a cristallise votre vocation et renforce votre determination. Ouverture : cet evenement continue de nourrir votre engagement au quotidien dans vos etudes.",
  "Avez-vous eu des experiences (stages, benevolat) en lien avec la sante ?": "🎯 INTRODUCTION\nLe jury veut evaluer votre confrontation au reel — avez-vous depasse l'image idealisee de la medecine ? L'honnete compte plus que la quantite d'experiences.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Decrire concretement l'experience — lieu, duree, role, ce que vous avez observe et fait au quotidien\n• Axe 2 : Ce que cela vous a appris — realite du metier, contact avec la souffrance, travail d'equipe, limites du soin, qualites necessaires\n• Conseil : Si pas d'experience directe, valoriser des experiences transversales (accompagnement d'un proche, premiers secours, engagement associatif)\n\n✅ CONCLUSION\nCes experiences ont confirme votre choix en vous montrant la realite du terrain. Ouverture : vous souhaitez continuer a vous engager pendant vos etudes pour rester connecte au soin.",
  "Comment gerez-vous le stress et la pression des etudes ?": "🎯 INTRODUCTION\nQuestion strategique : le jury teste votre lucidite sur les difficultes a venir et votre capacite d'adaptation. Il veut des strategies concretes, pas du denial.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Vos strategies personnelles — sport, routine, organisation du temps, sommeil, vie sociale preservee, activites creatives\n• Axe 2 : Votre conscience des risques — burn-out etudiant, isolement, savoir demander de l'aide (tutorat, psy, entourage)\n• Conseil : Etre honnete sur les moments difficiles deja vecus et comment vous les avez surmontes — la resilience impressionne plus que l'invincibilite\n\n✅ CONCLUSION\nVous avez identifie vos leviers d'equilibre et savez que la sante du soignant conditionne la qualite du soin. Ouverture : cet apprentissage vous servira tout au long de votre carriere medicale.",
  "Quelles qualites pensez-vous essentielles pour un bon medecin ?": "🎯 INTRODUCTION\nLe jury veut voir si vous depassez la liste generique (empathie, rigueur) pour proposer une vision personnelle et nuancee du bon medecin.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Qualites relationnelles — ecoute active, humilite, capacite a annoncer une mauvaise nouvelle, respect de l'autonomie du patient\n• Axe 2 : Qualites intellectuelles et professionnelles — esprit critique, formation continue, savoir dire \"je ne sais pas\", travail en equipe pluridisciplinaire\n• Conseil : Illustrer chaque qualite par un exemple concret vecu ou observe — ca passe de l'abstrait au reel\n\n✅ CONCLUSION\nLe bon medecin allie competence technique et humanite — l'un sans l'autre est insuffisant. Ouverture : ces qualites se developpent tout au long de la formation et de la carriere.",
  "Comment envisagez-vous de concilier vie professionnelle et vie personnelle en tant que medecin ?": "🎯 INTRODUCTION\nQuestion qui teste votre realisme sur le metier. Le jury veut voir que vous ne fantasmez pas un equilibre parfait mais que vous y reflechissez serieusement.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Conscience des contraintes — gardes, charge emotionnelle, temps partiel difficile dans certaines specialites, risque de burn-out\n• Axe 2 : Strategies envisagees — choix d'exercice (liberal/salarie), exercice groupe, limites claires, activites ressourcantes, entourage solide\n• Conseil : Montrer que cet equilibre est un enjeu de sante publique (medecin epuise = risque pour les patients) et pas juste un confort personnel\n\n✅ CONCLUSION\nConcilier vie pro et perso n'est pas un luxe mais une condition de durabilite dans la profession. Ouverture : les nouvelles generations de medecins redefinissent cet equilibre et c'est positif pour le systeme de sante.",
  "Quel regard portez-vous sur la relation medecin-patient ?": "🎯 INTRODUCTION\nQuestion centrale en medecine. Le jury attend une reflexion sur l'evolution de cette relation, du paternalisme au partenariat, avec votre positionnement personnel.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Evolution historique — du modele paternaliste (le medecin decide) au modele de decision partagee (loi Kouchner 2002, consentement eclaire, patient expert)\n• Axe 2 : Les defis contemporains — patients informes par internet, confiance fragilisee, inegalites dans l'acces a l'information, dimension culturelle\n• Conseil : Montrer que vous valorisez l'ecoute et le partenariat sans renier l'expertise medicale — l'equilibre est la cle\n\n✅ CONCLUSION\nLa relation medecin-patient est un acte de soin en soi, pas un simple cadre pour la prescription. Ouverture : la formation a la communication est aussi importante que la formation scientifique.",
  "Connaissez-vous les defis actuels du systeme de sante francais ?": "🎯 INTRODUCTION\nQuestion de culture generale medicale. Le jury veut voir que vous connaissez le systeme dans lequel vous allez exercer et ses tensions actuelles.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Defis structurels — deserts medicaux, vieillissement de la population, financement (dette de la Secu, T2A), crise hospitaliere, penuries de soignants\n• Axe 2 : Defis emergents — sante mentale post-Covid, maladies chroniques, virage ambulatoire, numerique en sante, prevention vs curatif\n• Conseil : Citer 2-3 chiffres cles (6 millions en desert medical, 30% postes vacants hopital) et proposer une piste de solution pour montrer une reflexion constructive\n\n✅ CONCLUSION\nConscient de ces defis, vous les voyez comme des leviers de transformation plutot que des obstacles. Ouverture : etre medecin demain c'est aussi participer a faire evoluer le systeme.",
  "Comment votre parcours personnel vous a-t-il prepare aux etudes de medecine ?": "🎯 INTRODUCTION\nQuestion qui vise a comprendre votre trajectoire et vos ressources personnelles. Le jury cherche la coherence entre votre passe et votre projet, pas un CV parfait.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Competences et valeurs acquises — rigueur scolaire, perseverance face aux difficultes, experiences formatrices (sport de competition, musique, engagement associatif)\n• Axe 2 : Epreuves et apprentissages — moments difficiles surmontes, capacite d'adaptation, maturite acquise, ouverture aux autres\n• Conseil : Tisser un fil rouge entre votre parcours et la medecine — montrer que chaque experience vous a rapproche de cette vocation\n\n✅ CONCLUSION\nVotre parcours vous a forge des qualites directement transferables aux exigences de la medecine. Ouverture : chaque experience future continuera a nourrir le medecin que vous deviendrez.",
  "Si vous ne reussissiez pas en medecine, quel serait votre plan B ?": "🎯 INTRODUCTION\nQuestion piege classique. Le jury teste votre maturite (avoir un plan B est sain) sans vouloir que vous montriez du desengagement. Equilibre a trouver.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Plan B reflechi — une filiere de sante coherente (pharma, kine, recherche biomedicale) ou une voie connexe qui garde du sens par rapport a vos valeurs\n• Axe 2 : Reaffirmer votre engagement — le plan B existe par lucidite, pas par manque de motivation, vous mettez tout en oeuvre pour reussir en medecine\n• Conseil : Ne jamais dire \"je n'ai pas de plan B\" (immaturity) ni \"ca m'est egal\" (desengagement) — montrer que vous avez reflechi sans hesiter sur votre choix premier\n\n✅ CONCLUSION\nAvoir un plan B montre de la maturite, pas un manque d'ambition. Ouverture : cette lucidite est une qualite que vous retrouverez dans la pratique medicale (toujours anticiper).",
  "Quelle decouverte medicale recente vous a particulierement interesse ?": "🎯 INTRODUCTION\nLe jury teste votre curiosite scientifique et votre veille medicale. Choisir une decouverte recente et en parler avec precision et enthousiasme.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Decrire la decouverte — therapies geniques (CRISPR), immunotherapie anti-cancer, vaccins ARNm, IA diagnostique, organoïdes — etre precis sur le mecanisme\n• Axe 2 : Pourquoi cela vous passionne — impact sur les patients, revolution dans la prise en charge, questions ethiques soulevees, potentiel futur\n• Conseil : Choisir une decouverte que vous maitrisez vraiment plutot que la plus spectaculaire — le jury peut poser des questions de suivi\n\n✅ CONCLUSION\nCette decouverte illustre le dynamisme de la recherche medicale et renforce votre envie d'y contribuer. Ouverture : la medecine de demain sera transformee par ces innovations et vous voulez en faire partie.",
  "Que pensez-vous du systeme de selection actuel (PASS/LAS) ?": "🎯 INTRODUCTION\nQuestion sensible — vous etes en plein dedans. Le jury attend une analyse equilibree, ni plainte ni eloge excessif, avec du recul sur le systeme.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Points positifs — diversification des profils (LAS ouvre a d'autres parcours), deuxieme chance possible, fin du redoublement PACES qui etait anxiogene\n• Axe 2 : Limites observees — pression toujours intense, inegalites selon les universites, manque de lisibilite du systeme, selection qui reste tres academique\n• Conseil : Proposer une piste d'amelioration (entretiens de motivation, stages d'observation, evaluation des soft skills) montre une reflexion mature\n\n✅ CONCLUSION\nLe PASS/LAS est une amelioration par rapport a la PACES mais reste perfectible. Ouverture : selectionner de bons medecins suppose d'evaluer aussi des qualites humaines au-dela du classement.",
  "Avez-vous deja ete confronte a la maladie (personnellement ou dans votre entourage) ?": "🎯 INTRODUCTION\nQuestion intime qui demande de l'authenticite. Le jury ne cherche pas a vous faire souffrir mais a comprendre comment cette experience a nourri votre vocation.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Raconter l'experience avec sobriete — les faits, votre ressenti, ce que vous avez observe du systeme de soin et des soignants\n• Axe 2 : Ce que cela a change dans votre regard — comprehension de la vulnerabilite, importance de l'accompagnement, limites de la medecine, gratitude envers les soignants\n• Conseil : Si pas d'experience directe, dire honnêtement et valoriser d'autres formes de confrontation (benevolat, temoignages, documentaires) — ne jamais inventer\n\n✅ CONCLUSION\nCette confrontation a la maladie a ancre votre choix dans le reel, pas dans l'idealisation. Ouverture : cette sensibilite sera une force pour accompagner vos futurs patients.",
  "Que signifie pour vous 'prendre soin' de quelqu'un ?": "🎯 INTRODUCTION\nQuestion philosophique qui teste votre vision du soin au-dela de l'acte technique. Le jury veut une reflexion personnelle, pas une definition de dictionnaire.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Le soin au sens large — ecouter, etre present, respecter la dignite, accompagner sans juger, considerer la personne dans sa globalite (bio-psycho-social)\n• Axe 2 : La dimension ethique — respecter l'autonomie, ne pas infantiliser, accepter les choix du patient meme quand on est en desaccord, caring vs curing\n• Conseil : Illustrer avec un exemple personnel ou vous avez pris soin de quelqu'un (proche, ami, benevolat) — ca rend la reponse vivante\n\n✅ CONCLUSION\nPrendre soin c'est aller au-dela du traitement pour accompagner l'humain dans sa vulnerabilite. Ouverture : cette vision du soin est ce qui fait la difference entre un technicien de la sante et un medecin.",
  "Citez un medecin celebre qui vous inspire et expliquez pourquoi.": "🎯 INTRODUCTION\nLe jury teste votre culture medicale et votre capacite a articuler des valeurs a travers un modele. Choisir quelqu'un que vous connaissez vraiment, pas un nom generique.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Presenter le medecin et son oeuvre — Simone Veil (sante publique et droits), Bernard Kouchner (humanitaire, MSF), Albert Schweitzer, Denis Mukwege, ou un medecin local qui vous a inspire\n• Axe 2 : Pourquoi cette inspiration — les valeurs incarnees (engagement, courage, humanite, innovation), le lien avec votre propre projet medical\n• Conseil : Eviter les figures trop convenues sans reflexion personnelle — mieux vaut un medecin moins celebre dont vous parlez avec passion\n\n✅ CONCLUSION\nCe medecin incarne les valeurs que vous souhaitez porter dans votre propre pratique. Ouverture : s'inspirer d'un modele tout en construisant sa propre identite medicale.",
  "La medecine est-elle un art ou une science ? Debattez.": "🎯 INTRODUCTION\nQuestion classique de reflexion. Le jury attend un vrai debat structure, pas une reponse tranchee. Montrer votre capacite a argumenter des deux cotes.\n\n💡 DEVELOPPEMENT\n• Axe 1 : La medecine comme science — evidence-based medicine, essais cliniques, biologie moleculaire, progres techniques, reproductibilite des protocoles\n• Axe 2 : La medecine comme art — intuition clinique, relation humaine unique, adaptation a chaque patient, annonce diagnostique, accompagnement de fin de vie\n• Conseil : Depasser le debat binaire en montrant que les deux dimensions sont complementaires — la science guide, l'art humanise\n\n✅ CONCLUSION\nLa medecine est une science appliquee avec art — la rigueur scientifique au service de l'humain. Ouverture : les meilleurs medecins sont ceux qui maitrisent les deux dimensions.",
  "Comment reagiriez-vous si un patient vous reprochait une erreur ?": "🎯 INTRODUCTION\nQuestion ethique et comportementale. Le jury teste votre maturite, votre humilite et votre connaissance des enjeux de l'erreur medicale. Pas de reponse defensive.\n\n💡 DEVELOPPEMENT\n• Axe 1 : Reaction immediate — ecouter sans se justifier, reconnaetre la souffrance du patient, ne pas minimiser, informer (loi Kouchner 2002 = devoir d'information en cas d'erreur)\n• Axe 2 : Demarche constructive — analyser l'erreur (CREX, RMM), transparence, culture de la declaration des evenements indesirables, progresser plutot que culpabiliser\n• Conseil : Montrer que l'erreur medicale est inherente a la pratique et que la gestion de l'erreur definit le professionnel — jamais la dissimuler\n\n✅ CONCLUSION\nFaire face a l'erreur avec honnete et humilite est une marque de professionnalisme, pas de faiblesse. Ouverture : la culture de securite du patient repose sur la transparence et l'apprentissage collectif."
};

const baseAllQuestions = [...DATA.questions.rpc, ...DATA.questions.ared, ...DATA.questions.motivation];
const baseTotalQ = baseAllQuestions.length;

function App() {
  // Core state
  const [view, setView] = useState('accueil');
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');

  // Persisted: done questions, notes & responses
  const [done, setDone] = useState(() => { try { const v = JSON.parse(localStorage.getItem('oral-pass-done')); return Array.isArray(v) ? v : []; } catch(e) { return []; } });
  const [notes, setNotes] = useState(() => { try { return JSON.parse(localStorage.getItem('oral-pass-notes')) || {}; } catch(e) { return {}; } });
  const [responses, setResponses] = useState(() => { try { return JSON.parse(localStorage.getItem('oral-pass-responses')) || {}; } catch(e) { return {}; } });
  const [openResp, setOpenResp] = useState(null);

  // Persisted: daily journal entries
  const [dailyLog, setDailyLog] = useState(() => { try { const v = JSON.parse(localStorage.getItem('oral-pass-daily')); return Array.isArray(v) ? v : []; } catch(e) { return []; } });

  // Persisted: streak
  const [streak, setStreak] = useState(() => { try { return JSON.parse(localStorage.getItem('oral-pass-streak')) || { current: 0, best: 0, lastDate: '' }; } catch(e) { return { current: 0, best: 0, lastDate: '' }; } });

  // Practice mode
  const [practiceMode, setPracticeMode] = useState(false);
  const [practiceQ, setPracticeQ] = useState(null);
  const [practiceType, setPracticeType] = useState('rpc');
  const [timer, setTimer] = useState(0);
  const [timerRunning, setTimerRunning] = useState(false);
  const [evalChecks, setEvalChecks] = useState({});
  const [showEval, setShowEval] = useState(false);

  // Custom questions (user-created)
  const [customQuestions, setCustomQuestions] = useState(() => { try { return JSON.parse(localStorage.getItem('oral-pass-custom-questions')) || { rpc: [], ared: [] }; } catch(e) { return { rpc: [], ared: [] }; } });
  const [showAddForm, setShowAddForm] = useState(null); // null or 'rpc'/'ared'
  const [newQ, setNewQ] = useState({ q: '', theme: '', difficulte: 2, tags: '' });

  // Journal form state
  const [journalRatings, setJournalRatings] = useState({ structure: 0, contenu: 0, communication: 0, timing: 0, jury: 0 });
  const [journalConfidence, setJournalConfidence] = useState(3);
  const [journalNotes, setJournalNotes] = useState('');
  const [journalQCount, setJournalQCount] = useState(1);
  const [suiviTab, setSuiviTab] = useState('journal');

  // Persist to localStorage
  useEffect(() => { localStorage.setItem('oral-pass-done', JSON.stringify(done)); }, [done]);
  useEffect(() => { localStorage.setItem('oral-pass-notes', JSON.stringify(notes)); }, [notes]);
  useEffect(() => { localStorage.setItem('oral-pass-responses', JSON.stringify(responses)); }, [responses]);
  useEffect(() => { localStorage.setItem('oral-pass-daily', JSON.stringify(dailyLog)); }, [dailyLog]);
  useEffect(() => { localStorage.setItem('oral-pass-streak', JSON.stringify(streak)); }, [streak]);
  useEffect(() => { localStorage.setItem('oral-pass-custom-questions', JSON.stringify(customQuestions)); }, [customQuestions]);

  // Timer
  useEffect(() => {
    if (!timerRunning) return;
    const id = setInterval(() => setTimer(t => t + 1), 1000);
    return () => clearInterval(id);
  }, [timerRunning]);

  // Update streak on mount
  useEffect(() => {
    const t = today();
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().split('T')[0];
    setStreak(s => {
      if (s.lastDate === t) return s;
      if (s.lastDate === yesterday) return s; // streak still valid, just not incremented yet
      if (s.lastDate && s.lastDate !== t && s.lastDate !== yesterday) return { ...s, current: 0 }; // streak broken
      return s;
    });
  }, []);

  // Merge DATA questions with custom questions
  const getQuestions = useCallback((type) => {
    const base = DATA.questions[type] || [];
    const custom = (customQuestions[type] || []).map(q => ({ ...q, _custom: true }));
    return [...base, ...custom];
  }, [customQuestions]);

  const allQuestions = useMemo(() => [...getQuestions('rpc'), ...getQuestions('ared'), ...getQuestions('motivation')], [getQuestions]);
  const totalQ = allQuestions.length;

  // Add custom question
  const addCustomQuestion = useCallback((type) => {
    if (!newQ.q.trim()) return;
    const question = {
      q: newQ.q.trim(),
      theme: newQ.theme.trim() || 'Personnalise',
      difficulte: parseInt(newQ.difficulte) || 2,
      tags: newQ.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      _id: Date.now()
    };
    setCustomQuestions(cq => ({ ...cq, [type]: [...(cq[type] || []), question] }));
    setNewQ({ q: '', theme: '', difficulte: 2, tags: '' });
    setShowAddForm(null);
  }, [newQ]);

  // Delete custom question
  const deleteCustomQuestion = useCallback((type, id) => {
    setCustomQuestions(cq => ({ ...cq, [type]: (cq[type] || []).filter(q => q._id !== id) }));
  }, []);

  const toggleDone = useCallback((q) => {
    setDone(d => d.includes(q) ? d.filter(x => x !== q) : [...d, q]);
  }, []);

  const startPractice = useCallback((type) => {
    const pool = getQuestions(type);
    const q = pool[Math.floor(Math.random() * pool.length)];
    setPracticeType(type);
    setPracticeQ(q);
    setPracticeMode(true);
    setTimer(0);
    setTimerRunning(true);
    setEvalChecks({});
    setShowEval(false);
  }, [getQuestions]);

  const stopPractice = useCallback(() => {
    setTimerRunning(false);
    setShowEval(true);
  }, []);

  const nextPractice = useCallback(() => {
    startPractice(practiceType);
  }, [practiceType, startPractice]);

  const exitPractice = useCallback(() => {
    setPracticeMode(false);
    setTimerRunning(false);
    setShowEval(false);
  }, []);

  // Save journal entry
  const saveJournalEntry = useCallback(() => {
    const t = today();
    const entry = {
      date: t,
      questionsCount: journalQCount,
      ratings: { ...journalRatings },
      confidence: journalConfidence,
      notes: journalNotes,
      timestamp: Date.now()
    };
    setDailyLog(log => [...log, entry]);
    // Update streak
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().split('T')[0];
    setStreak(s => {
      if (s.lastDate === t) return { ...s, lastDate: t }; // already logged today
      const newCurrent = (s.lastDate === yesterday || s.lastDate === t) ? s.current + 1 : 1;
      return { current: newCurrent, best: Math.max(s.best, newCurrent), lastDate: t };
    });
    // Reset form
    setJournalRatings({ structure: 0, contenu: 0, communication: 0, timing: 0, jury: 0 });
    setJournalConfidence(3);
    setJournalNotes('');
    setJournalQCount(1);
  }, [journalRatings, journalConfidence, journalNotes, journalQCount]);

  // Computed stats
  const doneCount = done.length;
  const progressPct = totalQ > 0 ? Math.round(doneCount / totalQ * 100) : 0;
  const todayEntries = dailyLog.filter(e => e.date === today());
  const todayQDone = todayEntries.reduce((s, e) => s + e.questionsCount, 0);
  const dailyGoal = 5;

  // Format timer
  const fmtTimer = (s) => { const m = Math.floor(s/60); const sec = s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); };

  // Get unique themes
  const getThemes = (type) => [...new Set(getQuestions(type).map(q => q.theme))];

  // ===== RENDER FUNCTIONS =====

  const renderNav = () => {
    const tabs = [
      { id: 'accueil', label: 'Accueil' },
      { id: 'rpc', label: 'Epreuve 1 — RPC' },
      { id: 'ared', label: 'Epreuve 2 — ARED' },
      { id: 'motivation', label: 'Motivation' },
      { id: 'methodo', label: 'Methodologie' },
      { id: 'fiches', label: 'Fiches thematiques' },
      { id: 'exemples', label: 'Exemples corriges' },
      { id: 'actualites', label: 'Actualites 2026' },
      { id: 'chiffres', label: 'Chiffres cles', highlight: true },
      { id: 'jourj', label: 'Jour J' },
      { id: 'suivi', label: 'Suivi & Progression', highlight: true },
      { id: 'pratique', label: 'Entrainement' },
    ];
    return h('nav', { className: 'nav' },
      tabs.map(t => h('button', {
        key: t.id,
        className: 'nav__btn' + (view === t.id ? ' nav__btn--active' : '') + (t.highlight ? ' nav__btn--highlight' : ''),
        onClick: () => { setView(t.id); setSearch(''); setFilter('all'); }
      }, t.label))
    );
  };

  const renderStreakBanner = () => {
    if (streak.current === 0 && streak.best === 0) return null;
    return h('div', { className: 'streak-banner fade-in' },
      h('span', { className: 'streak-fire' }, streak.current > 0 ? '🔥' : '❄️'),
      h('span', { className: 'streak-count' }, streak.current + ' jour' + (streak.current > 1 ? 's' : '')),
      h('span', { className: 'streak-label' }, streak.current > 0 ? 'de suite !' : 'Streak perdu...'),
      streak.best > 0 ? h('span', { className: 'streak-best' }, 'Record : ' + streak.best + 'j') : null
    );
  };

  const renderDailyGoal = () => {
    const pct = Math.min(100, Math.round(todayQDone / dailyGoal * 100));
    const r = 24, c = 2 * Math.PI * r;
    const offset = c - (pct / 100) * c;
    return h('div', { className: 'daily-goal fade-in' },
      h('svg', { className: 'daily-goal__ring', viewBox: '0 0 60 60', width: 60, height: 60 },
        h('circle', { cx: 30, cy: 30, r: r, fill: 'none', stroke: 'rgba(255,255,255,0.1)', strokeWidth: 4 }),
        h('circle', { cx: 30, cy: 30, r: r, fill: 'none', stroke: pct >= 100 ? '#4ade80' : '#7c6df0', strokeWidth: 4, strokeDasharray: c, strokeDashoffset: offset, strokeLinecap: 'round', transform: 'rotate(-90 30 30)', style: { transition: 'stroke-dashoffset 0.5s ease' } }),
        h('text', { x: 30, y: 33, textAnchor: 'middle', fill: 'white', fontSize: '13', fontWeight: '700' }, pct + '%')
      ),
      h('div', { className: 'daily-goal__info' },
        h('div', { className: 'daily-goal__title' }, pct >= 100 ? 'Objectif du jour atteint !' : 'Objectif du jour'),
        h('div', { className: 'daily-goal__sub' }, todayQDone + '/' + dailyGoal + ' questions travaillees aujourd\'hui')
      )
    );
  };

  const renderStats = () => {
    const rpcAll = getQuestions('rpc'), aredAll = getQuestions('ared'), motAll = getQuestions('motivation');
    const rpcDone = rpcAll.filter(q => done.includes(q.q)).length;
    const aredDone = aredAll.filter(q => done.includes(q.q)).length;
    const motDone = motAll.filter(q => done.includes(q.q)).length;
    return h('div', { className: 'stats-bar fade-in' },
      h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--accent-light)' } }, doneCount + '/' + totalQ), h('div', { className: 'stat-card__label' }, 'Questions faites')),
      h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--success)' } }, progressPct + '%'), h('div', { className: 'stat-card__label' }, 'Progression')),
      h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--info)' } }, rpcDone + '/' + rpcAll.length), h('div', { className: 'stat-card__label' }, 'RPC')),
      h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--warning)' } }, aredDone + '/' + aredAll.length), h('div', { className: 'stat-card__label' }, 'ARED')),
      h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: '#f472b6' } }, motDone + '/' + motAll.length), h('div', { className: 'stat-card__label' }, 'Motivation')),
      h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--warning)' } }, dailyLog.length), h('div', { className: 'stat-card__label' }, 'Sessions journal'))
    );
  };

  const renderAccueil = () => {
    return h('div', { className: 'slide-up' },
      renderDailyGoal(),
      renderStats(),
      h('div', { className: 'progress' }, h('div', { className: 'progress__fill', style: { width: progressPct + '%' } })),
      h('div', { className: 'card card--accent' },
        h('h2', { style: { marginBottom: '0.8rem' } }, 'Preparation complete a l\'oral PASS Sorbonne 2026'),
        h('p', { style: { color: 'var(--text-secondary)', marginBottom: '1rem' } }, 'Cette application regroupe TOUT ce dont tu as besoin :'),
        h('ul', { style: { listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
          [totalQ + ' questions classees par epreuve et thematique',
           'Methodologie detaillee pour chaque type d\'epreuve',
           '8 fiches thematiques avec arguments pour/contre prets a l\'emploi',
           '7 exemples de reponses structurees et commentees',
           '13 actualites 2025-2026 a connaitre',
           'Guide jour J : de la veille a la sortie de l\'epreuve',
           'Journal quotidien + graphiques de progression',
           'Entrainement chronometre avec auto-evaluation'].map((t,i) =>
            h('li', { key: i, style: { fontSize: '0.9rem', color: 'var(--text-secondary)' } },
              h('strong', { style: { color: 'var(--text)' } }, t.split(' ')[0] + ' ' + (t.split(' ')[1] || '')),
              ' ' + t.split(' ').slice(2).join(' ')
            )
          )
        )
      ),
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--danger)' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.5rem', marginBottom: '0.8rem' } },
          h('div', { style: { fontSize: '0.82rem' } }, '📅 Garnison : ', h('strong', { style: { color: 'var(--danger)' } }, '28 Mai 2026')),
          h('div', { style: { fontSize: '0.82rem' } }, '📅 Prep oraux : ', h('strong', { style: { color: 'var(--warning)' } }, '2-3 Juin 2026')),
          h('div', { style: { fontSize: '0.82rem' } }, '🎯 Places oral : ', h('strong', { style: { color: 'var(--success)' } }, '160'))
        )
      ),
      h('div', { className: 'card' },
        h('h3', { style: { marginBottom: '0.8rem' } }, 'Format de l\'oral — ' + DATA.format.university),
        h('div', { style: { display: 'grid', gap: '0.5rem', fontSize: '0.85rem', color: 'var(--text-secondary)' } },
          h('div', null, 'Nombre d\'epreuves : ', h('strong', { style: { color: 'var(--text)' } }, DATA.format.epreuves)),

  // Generate skeleton response based on question metadata
  const generateSkeleton = useCallback((q, type) => {
    const tagMap = {
      'autonomie': 'Respect de l\'autonomie du patient (droit de decider pour soi-meme)',
      'ethique': 'Enjeux ethiques : equilibre entre bienfaisance et non-malfaisance',
      'empathie': 'Ecoute active et empathie : comprendre avant de juger',
      'croyances': 'Respect des convictions personnelles vs imperatif medical',
      'vie': 'Protection de la vie : principe fondamental de la medecine',
      'verite': 'Droit a l\'information vs protection du patient (verite progressive)',
      'bienveillance': 'Principe de bienfaisance : agir dans l\'interet du patient',
      'secret-medical': 'Secret medical (art. L1110-4 CSP) : pilier de la confiance',
      'securite': 'Securite publique vs droits individuels',
      'dilemme': 'Conflit entre deux valeurs ou obligations',
      'vaccination': 'Sante publique (immunite collective) vs liberte individuelle',
      'liberte': 'Liberte individuelle et ses limites dans la societe',
      'sante-publique': 'Enjeu de sante publique : interet collectif',
      'fin-de-vie': 'Fin de vie : dignite, accompagnement, loi Claeys-Leonetti',
      'legislation': 'Cadre legislatif francais et ses evolutions',
      'dignite': 'Respect de la dignite humaine en toutes circonstances',
      'bioethique': 'Bioethique : encadrement des avancees scientifiques',
      'societe': 'Impact societal et responsabilite collective',
      'droits': 'Droits fondamentaux et equilibre des libertes',
      'clause-conscience': 'Clause de conscience vs continuite des soins',
      'acces-soins': 'Acces universel aux soins (art. L1110-1 CSP)',
      'integrite': 'Integrite professionnelle et responsabilite',
      'recherche': 'Ethique de la recherche et progres scientifique',
      'justice-sociale': 'Equite et lutte contre les inegalites de sante',
      'inegalites': 'Determinants sociaux de la sante',
      'psychiatrie': 'Soins psychiatriques : consentement et contrainte',
      'protection': 'Protection des personnes vulnerables',
      'deontologie': 'Code de deontologie medicale',
      'numerique': 'Impact du numerique sur la sante et les relations',
      'sante-mentale': 'Sante mentale : destigmatisation et acces aux soins',
      'IA': 'Intelligence artificielle : promesses et limites dans le soin',
      'technologie': 'Innovation technologique et humanite du soin',
      'action': 'Passage a l\'action : que faire concretement ?',
      'urgence': 'Situation d\'urgence : reagir avec sang-froid',
      'responsabilite': 'Sens de la responsabilite individuelle et collective',
      'communication': 'Communication bienveillante et assertive',
      'solidarite': 'Solidarite et lien social',
      'courage': 'Courage moral : agir malgre l\'inconfort',
      'amitie': 'Amitie vs responsabilite : ou placer la limite ?',
      'confrontation': 'Savoir confronter avec respect',
      'inclusion': 'Inclusion et respect de la difference',
      'discrimination': 'Lutte contre les discriminations',
      'pression': 'Resister aux pressions sociales ou hierarchiques',
      'confiance': 'Construire et maintenir la confiance',
      'mineur': 'Droits du mineur et autorite parentale',
      'environnement': 'Sante environnementale et prevention',
      'prevention': 'Prevention : mieux vaut prevenir que guerir',
      'precarite': 'Precarite et acces aux soins',
      'addiction': 'Addiction : approche medicale non-jugeante',
      'vieillissement': 'Vieillissement de la population et adaptation du systeme',
      'handicap': 'Handicap : inclusion et accessibilite',
    };

    const axes = q.tags
      .map(t => tagMap[t] || null)
      .filter(Boolean)
      .slice(0, 3);

    const isARED = type === 'ared';
    const isMotiv = type === 'motivation';

    if (isMotiv) {
      if (MOTIV_SKELETONS[q.q]) return MOTIV_SKELETONS[q.q];
      return '🎯 INTRODUCTION\n' +
        'Reformuler la question avec tes propres mots. Montrer que tu as compris l\'enjeu.\n\n' +
        '💡 DEVELOPPEMENT\n' +
        (axes.length > 0 ? axes.map((a, i) => '• Axe ' + (i+1) + ' : ' + a).join('\n') : '• Axe 1 : [a completer]\n• Axe 2 : [a completer]') + '\n' +
        '• Illustrer avec ton parcours personnel, tes experiences, tes motivations\n' +
        '• Montrer ta connaissance du metier et du cursus\n\n' +
        '✅ CONCLUSION\n' +
        'Reaffirmer ta motivation avec sincerite. Ouverture vers ta vision du metier.';
    }

    if (isARED) {
      if (ARED_SKELETONS[q.q]) return ARED_SKELETONS[q.q];
      return '📋 RESTITUTION DU DOCUMENT (1-1.5 min)\n' +
        'Decrire le document de memoire : type (image/graphique/tableau/texte), donnees cles, chiffres importants.\n\n' +
        '🔍 PROBLEMATIQUES (2 min)\n' +
        (axes.length > 0 ? axes.map((a, i) => '• Problematique ' + (i+1) + ' : ' + a).join('\n') : '• Problematique 1 : [a completer]\n• Problematique 2 : [a completer]') + '\n\n' +
        '⚖️ ESPRIT CRITIQUE (1 min)\n' +
        '• Limites du document : biais possibles, ce qui n\'est pas montre\n' +
        '• Nuancer : distinguer correlation et causalite\n' +
        '• Sources et fiabilite des donnees\n\n' +
        '✅ CONCLUSION (0.5 min)\n' +
        'Synthese personnelle + ouverture vers une question plus large.';
    }

    // RPC — lookup unique skeletons first, fallback to generic
    if (RPC_SKELETONS[q.q]) return RPC_SKELETONS[q.q];
    return '📋 INTRODUCTION (1 min)\n' +
      'Reformuler la situation. Identifier les acteurs et le contexte. Formuler la problematique.\n\n' +
      '🔍 ANALYSE (2 min)\n' +
      (axes.length > 0 ? axes.map((a, i) => '• Axe ' + (i+1) + ' : ' + a).join('\n') : '• Axe 1 : [a completer]\n• Axe 2 : [a completer]') + '\n\n' +
      '⚖️ DISCUSSION (1.5 min)\n' +
      '• Arguments pour / contre\n' +
      '• Nuances et complexite de la situation\n' +
      '• Exemples concrets ou references\n\n' +
      '✅ CONCLUSION (0.5 min)\n' +
      'Position personnelle argumentee + ouverture.';
  }, []);

  const renderQuestionList = (type) => {
    const questions = getQuestions(type);
    const themes = getThemes(type);
    const canAddCustom = type === 'rpc' || type === 'ared';
    const filtered = questions.filter(q => {

      return true;

    // Questions modifiees en haut
    filtered.sort((a, b) => {
      const aEdited = responses[a.q] ? 1 : 0;
      const bEdited = responses[b.q] ? 1 : 0;
      return bEdited - aEdited;
    });
    const fDone = filtered.filter(q => done.includes(q.q)).length;
    const fPct = filtered.length > 0 ? Math.round(fDone / filtered.length * 100) : 0;

    // Add question form
    const renderAddForm = () => {

      const existingThemes = [...new Set(DATA.questions[type].map(q => q.theme))];
      return h('div', { className: 'add-form fade-in' },
        h('div', { className: 'add-form__title' }, '➕ Ajouter une question ' + (type === 'rpc' ? 'RPC' : 'ARED')),
        h('div', { className: 'add-form__field' },
          h('label', { className: 'add-form__label' }, 'Question *'),
          h('textarea', {
            className: 'add-form__input add-form__input--textarea',

            value: newQ.q,

          })

              value: newQ.theme,
              onChange: e => setNewQ(nq => ({ ...nq, theme: e.target.value }))
            },
              h('option', { value: '' }, 'Choisir un theme...'),
              existingThemes.map(t => h('option', { key: t, value: t }, t)),
              h('option', { value: 'Personnalise' }, 'Personnalise')
            )
          ),
          h('div', { className: 'add-form__field', style: { width: '120px' } },
            h('label', { className: 'add-form__label' }, 'Difficulte'),
            h('select', {
              className: 'add-form__select',
              value: newQ.difficulte,
              onChange: e => setNewQ(nq => ({ ...nq, difficulte: parseInt(e.target.value) }))
            },
              h('option', { value: 1 }, 'Facile'),
              h('option', { value: 2 }, 'Moyen'),
              h('option', { value: 3 }, 'Difficile')
            )
          )
        ),
        h('div', { className: 'add-form__field' },
          h('label', { className: 'add-form__label' }, 'Tags (separes par des virgules)'),
          h('input', {
            className: 'add-form__input',
            placeholder: 'Ex: ethique, autonomie, legislation',
            value: newQ.tags,
            onChange: e => setNewQ(nq => ({ ...nq, tags: e.target.value }))
          })
        ),
        h('div', { className: 'add-form__actions' },
          h('button', {
            className: 'resp-actions__btn',
            style: { background: 'var(--accent)', color: 'white', border: 'none', padding: '0.5rem 1.2rem', borderRadius: '8px', fontWeight: 600, cursor: 'pointer' },
            onClick: () => addCustomQuestion(type)
          }, 'Ajouter'),
          h('button', {
            className: 'resp-actions__btn',
            style: { padding: '0.5rem 1.2rem', cursor: 'pointer' },
            onClick: () => { setShowAddForm(null); setNewQ({ q: '', theme: '', difficulte: 2, tags: '' }); }
          }, 'Annuler')
        )
      );
    };

    return h('div', { className: 'slide-up' },
      h('div', { className: 'search-bar' },
        h('input', { className: 'search-input', placeholder: 'Rechercher une question ou un tag...', value: search, onChange: e => setSearch(e.target.value) }),
        h('button', { className: 'filter-btn' + (filter === 'all' ? ' filter-btn--active' : ''), onClick: () => setFilter('all') }, 'Tous'),
        themes.map(t => h('button', { key: t, className: 'filter-btn' + (filter === t ? ' filter-btn--active' : ''), onClick: () => setFilter(t) }, t))
      ),
      h('div', { className: 'progress', style: { marginBottom: '0.5rem' } }, h('div', { className: 'progress__fill', style: { width: fPct + '%' } })),
      h('div', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '1rem' } }, fDone + '/' + filtered.length + ' faites (' + fPct + '%)'),
      // Add custom question button
      canAddCustom ? h('button', {
        className: 'add-question-btn',
        onClick: () => setShowAddForm(showAddForm === type ? null : type)
      }, '+ Ajouter une question personnalisee') : null,
      renderAddForm(),
      filtered.map((q, i) => {
        const isOpen = openResp === q.q;
        const skeleton = generateSkeleton(q, type);
        const userResp = responses[q.q];
        const isEdited = userResp && userResp !== skeleton;
        const currentText = userResp || skeleton;
        const isCustom = q._custom;

        return h('div', { key: isCustom ? 'c-' + q._id : i, className: 'question' + (done.includes(q.q) ? ' question--done' : '') + (isCustom ? ' question--custom' : '') },
          // Clickable header for done toggle
          h('div', { style: { cursor: 'pointer', display: 'flex', alignItems: 'flex-start', gap: '0.5rem' }, onClick: () => toggleDone(q.q) },
            h('div', { style: { flex: 1 } },
              h('div', { className: 'question__text' },
                q.q,
                isCustom ? h('span', { className: 'question__badge-custom' }, 'Perso') : null
              ),
              h('div', { className: 'question__meta' },
                h('span', { className: 'question__diff question__diff--' + q.difficulte }, ['Facile','Moyen','Difficile'][q.difficulte-1]),
                q.tags.map((t,j) => h('span', { key: j, className: 'question__tag' }, t))
              )
            ),
            isCustom ? h('button', {
              className: 'question__delete',
              title: 'Supprimer cette question',
              onClick: e => { e.stopPropagation(); deleteCustomQuestion(type, q._id); }
            }, '✕') : null
          ),
          // Accordion toggle
          h('button', {
            className: 'resp-toggle' + (isOpen ? ' resp-toggle--open' : '') + (isEdited ? ' resp-toggle--edited' : ''),
            onClick: e => { e.stopPropagation(); setOpenResp(isOpen ? null : q.q); }

            h('textarea', {

              }, 'Reinitialiser') : null
            )
          )
        );
      })
    );
  };

  // ===== EVOLUTION VIEW =====
  const renderEvolution = () => {
    const last30 = [];
    const d = new Date(); d.setDate(d.getDate() - 29);
    for (let i = 0; i < 30; i++) {
      const ds = d.toISOString().split('T')[0];
      const entries = dailyLog.filter(e => e.date === ds);
      const avgRating = entries.length > 0
        ? entries.reduce((s, e) => { const vals = Object.values(e.ratings).filter(v => v > 0); return s + (vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : 0); }, 0) / entries.length
        : 0;
      const qCount = entries.reduce((s, e) => s + e.questionsCount, 0);
      last30.push({ date: ds, label: ds.slice(8), avgRating, qCount, entries: entries.length });
      d.setDate(d.getDate() + 1);
    }

    // SVG Line Chart - Average ratings over 30 days
    const maxR = 5;
    const chartW = 560, chartH = 180, padL = 30, padR = 10, padT = 10, padB = 25;
    const plotW = chartW - padL - padR, plotH = chartH - padT - padB;
    const points = last30.map((d, i) => ({
      x: padL + (i / 29) * plotW,
      y: padT + plotH - (d.avgRating / maxR) * plotH,
      val: d.avgRating
    })).filter(p => p.val > 0);

    const linePath = points.length > 1 ? points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') : '';

    // Radar chart data - average per category
    const cats = ['structure', 'contenu', 'communication', 'timing', 'jury'];
    const catLabels = ['Structure', 'Contenu', 'Comm.', 'Timing', 'Jury'];
    const catAvgs = cats.map(c => {
      const vals = dailyLog.filter(e => e.ratings[c] > 0).map(e => e.ratings[c]);
      return vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    });
    const radarR = 70, radarCx = 90, radarCy = 90;
    const radarPoints = catAvgs.map((v, i) => {
      const angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
      return { x: radarCx + Math.cos(angle) * (v / 5) * radarR, y: radarCy + Math.sin(angle) * (v / 5) * radarR };
    });
    const radarPath = radarPoints.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') + 'Z';

    // Calendar heatmap - last 60 days
    const heatDays = [];
    const hd = new Date(); hd.setDate(hd.getDate() - 59);
    for (let i = 0; i < 60; i++) {
      const ds = hd.toISOString().split('T')[0];
      const count = dailyLog.filter(e => e.date === ds).length;
      heatDays.push({ date: ds, level: count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : count >= 3 ? 3 : 4 });
      hd.setDate(hd.getDate() + 1);
    }

    // Confidence trend
    const confTrend = dailyLog.slice(-10).map(e => e.confidence);

    // Weak areas
    const weakAreas = cats.map((c, i) => ({ cat: catLabels[i], avg: catAvgs[i] })).filter(a => a.avg > 0).sort((a, b) => a.avg - b.avg);

    return h('div', { className: 'slide-up' },
      h('h2', { className: 'section-title' }, '📈 Evolution & Progression'),

      dailyLog.length === 0
        ? h('div', { className: 'empty-state' }, h('div', { className: 'empty-state__icon' }, '📊'), h('div', { className: 'empty-state__text' }, 'Commence a remplir le journal quotidien pour voir ta progression ici !'))
        : h(Fragment, null,

          // Top stats
          h('div', { className: 'stats-bar' },
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--warning)' } }, streak.current), h('div', { className: 'stat-card__label' }, 'Streak actuel')),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--accent-light)' } }, streak.best), h('div', { className: 'stat-card__label' }, 'Record streak')),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--success)' } }, dailyLog.length), h('div', { className: 'stat-card__label' }, 'Sessions totales')),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--info)' } }, dailyLog.reduce((s,e) => s + e.questionsCount, 0)), h('div', { className: 'stat-card__label' }, 'Questions totales'))
          ),

          h('div', { className: 'evo-grid' },

            // Line chart
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '📉 Note moyenne / 30 derniers jours'),
              h('div', { className: 'chart-container' },
                h('svg', { viewBox: '0 0 ' + chartW + ' ' + chartH, preserveAspectRatio: 'xMidYMid meet' },
                  // Grid lines
                  [1,2,3,4,5].map(v => h('line', { key: v, x1: padL, y1: padT + plotH - (v/5)*plotH, x2: padL + plotW, y2: padT + plotH - (v/5)*plotH, stroke: 'rgba(255,255,255,0.06)', strokeWidth: 1 })),
                  [1,2,3,4,5].map(v => h('text', { key: 't'+v, x: padL - 5, y: padT + plotH - (v/5)*plotH + 4, fill: 'rgba(255,255,255,0.3)', fontSize: 10, textAnchor: 'end' }, v)),
                  // X labels
                  last30.filter((_, i) => i % 5 === 0).map((d, i) => h('text', { key: 'x'+i, x: padL + ((i*5)/29)*plotW, y: chartH - 5, fill: 'rgba(255,255,255,0.3)', fontSize: 9, textAnchor: 'middle' }, d.label)),
                  // Line
                  linePath ? h('path', { d: linePath, fill: 'none', stroke: '#7c6df0', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' }) : null,
                  // Dots
                  points.map((p, i) => h('circle', { key: i, cx: p.x, cy: p.y, r: 3.5, fill: '#7c6df0', stroke: '#0a0a0f', strokeWidth: 1.5 }))
                )
              )
            ),

            // Radar chart
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '🕸️ Profil de competences'),
              h('div', { className: 'chart-container' },
                h('svg', { viewBox: '0 0 180 180', preserveAspectRatio: 'xMidYMid meet' },
                  // Grid pentagons
                  [0.2, 0.4, 0.6, 0.8, 1].map((s, si) => {
                    const pts = Array.from({length: 5}, (_, i) => {
                      const a = (Math.PI * 2 * i / 5) - Math.PI / 2;
                      return (radarCx + Math.cos(a) * s * radarR).toFixed(1) + ',' + (radarCy + Math.sin(a) * s * radarR).toFixed(1);
                    }).join(' ');
                    return h('polygon', { key: si, points: pts, fill: 'none', stroke: 'rgba(255,255,255,0.08)', strokeWidth: 1 });
                  }),
                  // Labels
                  catLabels.map((label, i) => {
                    const a = (Math.PI * 2 * i / 5) - Math.PI / 2;
                    const lx = radarCx + Math.cos(a) * (radarR + 15);
                    const ly = radarCy + Math.sin(a) * (radarR + 15);
                    return h('text', { key: i, x: lx, y: ly + 3, fill: 'rgba(255,255,255,0.5)', fontSize: 9, textAnchor: 'middle' }, label);
                  }),
                  // Data polygon
                  catAvgs.some(v => v > 0) ? h('polygon', { points: radarPoints.map(p => p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '), fill: 'rgba(124,109,240,0.2)', stroke: '#7c6df0', strokeWidth: 2 }) : null,
                  // Data dots
                  radarPoints.map((p, i) => catAvgs[i] > 0 ? h('circle', { key: i, cx: p.x, cy: p.y, r: 3, fill: '#7c6df0' }) : null)
                )
              )
            ),

            // Calendar heatmap
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '📅 Activite (60 derniers jours)'),
              h('div', { className: 'heatmap' },
                heatDays.map((d, i) => h('div', { key: i, className: 'heatmap__day heatmap__day--' + d.level, title: formatDate(d.date) + ' : ' + d.level + ' session(s)' }))
              )
            ),

            // Weak areas
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '🎯 Axes d\'amelioration'),
              weakAreas.length === 0
                ? h('div', { style: { fontSize: '0.82rem', color: 'var(--text-muted)' } }, 'Pas encore assez de donnees.')
                : weakAreas.map((a, i) =>
                    h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: '0.8rem', marginBottom: '0.6rem' } },
                      h('span', { style: { fontSize: '0.82rem', minWidth: '90px', color: i === 0 ? 'var(--danger)' : 'var(--text-secondary)' } }, a.cat),
                      h('div', { style: { flex: 1, height: '6px', background: 'var(--bg-elevated)', borderRadius: '3px', overflow: 'hidden' } },
                        h('div', { style: { height: '100%', width: (a.avg / 5 * 100) + '%', background: i === 0 ? 'var(--danger)' : i === 1 ? 'var(--warning)' : 'var(--gradient-3)', borderRadius: '3px', transition: 'width 0.5s' } })
                      ),
                      h('span', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', minWidth: '35px', textAlign: 'right' } }, a.avg.toFixed(1) + '/5')
                    )
                  )
            ),

            // Confidence trend
            confTrend.length > 0 ? h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '💪 Confiance (10 dernieres sessions)'),
              h('div', { style: { display: 'flex', gap: '4px', alignItems: 'flex-end', height: '80px' } },
                confTrend.map((c, i) =>
                  h('div', { key: i, style: { flex: 1, height: (c / 5 * 100) + '%', background: c >= 4 ? 'var(--success)' : c >= 3 ? 'var(--info)' : c >= 2 ? 'var(--warning)' : 'var(--danger)', borderRadius: '3px 3px 0 0', minHeight: '4px', transition: 'height 0.3s' } })
                )
              ),
              h('div', { style: { display: 'flex', gap: '4px', marginTop: '4px' } },
                confTrend.map((c, i) => h('div', { key: i, style: { flex: 1, textAlign: 'center', fontSize: '0.65rem', color: 'var(--text-muted)' } }, c))
              )
            ) : null
          )
        )
    );
  };

  // ===== SUIVI (Journal + Evolution merged) =====
  const renderSuivi = () => {
    return h('div', { className: 'slide-up' },
      h('div', { style: { display: 'flex', gap: '0.5rem', marginBottom: '1.5rem' } },
        h('button', { className: 'btn ' + (suiviTab === 'journal' ? 'btn--primary' : 'btn--ghost'), onClick: () => setSuiviTab('journal') }, '📓 Journal'),

          mkStat('Preparation oraux', '2-3 Juin', 'var(--warning)'),
          mkStat('Epreuves orales', 'Apres ecrit', 'var(--accent)')
        )
      ),
      // Places 2025-2026
      h('div', { className: 'card', style: { marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '🎯 Places MMOPK 2025-2026'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))', gap: '0.8rem', marginBottom: '1rem' } },
          mkStat('Total', p.total_mmopk, 'var(--success)'),
          mkStat('Via ecrit', p.attribuees_ecrit, 'var(--info)'),
          mkStat('Via oral', p.attribuees_oral, 'var(--warning)')
        ),
        h('h3', { style: { fontSize: '0.9rem', color: 'var(--text-secondary)', marginBottom: '0.5rem', marginTop: '1rem' } }, 'Capacites par filiere'),
        mkRow('Medecine', p.capacites.medecine),
        mkRow('Pharmacie', p.capacites.pharmacie),
        mkRow('Odontologie', p.capacites.odontologie),
        mkRow('Maieutique', p.capacites.maieutique),
        mkRow('Kinesitherapie EKP', p.capacites.kine_ekp),
        mkRow('Kinesitherapie APHP', p.capacites.kine_aphp),
        mkRow('Ergotherapie', p.capacites.ergotherapie)
      ),
      // Scoring
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--accent)', marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '📐 Formule de classement'),
        h('div', { style: { background: 'var(--accent-bg)', padding: '1.2rem', borderRadius: 'var(--radius-sm)', marginBottom: '0.8rem', textAlign: 'center' } },
          h('div', { style: { fontSize: '1.1rem', fontWeight: 700, color: 'var(--accent-light)' } }, 'Classement final = 2/3 Note ecrit + 1/3 Note oral'),
          h('div', { style: { fontSize: '0.82rem', color: 'var(--text-secondary)', marginTop: '0.4rem' } }, 'Oral minimum 50% pour etre admis en MMOPK')
        ),
        h('p', { style: { fontSize: '0.85rem', color: 'var(--text-secondary)' } }, 'Note ecrit = bloc sante S1 + S2 (60 ECTS). Le classement apres l\'ecrit determine la convocation aux oraux.')
      ),
      // Historique 2024-2025
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--success)', marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '📊 Historique 2024-2025 — L\'oral redistribue TOUT'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '0.8rem', marginBottom: '1rem' } },
          mkStat('Convoques', h2025.convoques, 'var(--text)'),
          mkStat('Presents oraux', h2025.presents_oraux, 'var(--info)'),
          mkStat('Refus garnison', h2025.refus, 'var(--danger)'),
          mkStat('Absents', h2025.absents, 'var(--text-muted)')
        ),
        h('h3', { style: { fontSize: '0.9rem', color: 'var(--success)', marginBottom: '0.5rem', marginTop: '1rem' } }, '✅ Recus par filiere (2024-25)'),
        mkRow('Medecine', h2025.recus.medecine),
        mkRow('Pharmacie', h2025.recus.pharmacie),
        mkRow('Odontologie', h2025.recus.odontologie),
        mkRow('Maieutique', h2025.recus.maieutique),
        mkRow('Kine APHP', h2025.recus.kine_aphp),
        mkRow('Kine EKP', h2025.recus.kine_ekp)
      ),
      // Reclassement — le plus motivant
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--warning)', background: 'linear-gradient(135deg, rgba(251,191,36,0.05), rgba(74,222,128,0.05))' } },
        h('h2', { className: 'section-title' }, '🔥 Reclassement par l\'oral — Pourquoi tout est encore possible'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '0.8rem', marginBottom: '1rem' } },
          mkStat('Reclasses', r.nb_reclasses + ' etudiants', 'var(--success)'),
          mkStat('Declasses', r.nb_declasses + ' etudiants', 'var(--danger)')
        ),
        h('div', { className: 'card', style: { background: 'var(--success-bg)', border: '1px solid rgba(74,222,128,0.3)', marginBottom: '0.8rem' } },
          h('div', { style: { fontSize: '0.82rem', fontWeight: 600, color: 'var(--success)', marginBottom: '0.3rem' } }, '🚀 Plus grand gain : ' + r.meilleur_gain),
          h('div', { style: { fontSize: '0.78rem', color: 'var(--text-secondary)' } }, 'Un etudiant classe 311e a l\'ecrit est passe 124e grace a l\'oral !'),
          h('div', { style: { fontSize: '0.78rem', color: 'var(--text-secondary)', marginTop: '0.3rem' } }, 'Plus grand bond parmi les reclasses : ' + r.plus_grand_gain_reclasse)
        ),
        h('div', { className: 'card', style: { background: 'var(--danger-bg)', border: '1px solid rgba(248,113,113,0.3)' } },
          h('div', { style: { fontSize: '0.82rem', fontWeight: 600, color: 'var(--danger)', marginBottom: '0.3rem' } }, '⚠️ Plus grande perte : ' + r.pire_perte),
          h('div', { style: { fontSize: '0.78rem', color: 'var(--text-secondary)' } }, 'Meme bien classe a l\'ecrit, un mauvais oral peut tout renverser.')
        ),
        h('div', { style: { marginTop: '1rem', padding: '1rem', background: 'var(--bg-elevated)', borderRadius: 'var(--radius-sm)', textAlign: 'center' } },
          h('div', { style: { fontSize: '0.9rem', fontWeight: 700, color: 'var(--warning)' } }, '💡 Message cle : L\'oral est une SECONDE CHANCE'),
          h('div', { style: { fontSize: '0.82rem', color: 'var(--text-secondary)', marginTop: '0.3rem' } }, 'Peu importe ton classement ecrit, une bonne preparation a l\'oral peut te faire gagner plus de 180 places. Chaque minute de preparation compte !')
        )
      ),
      // Consignes garnison
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--info)', marginTop: '1.5rem' } },
        h('h2', { className: 'section-title' }, '🏛️ Consignes Amphi de Garnison'),
        h('ul', { style: { listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
          f.consignes_garnison.map((c, i) => h('li', { key: i, style: { fontSize: '0.85rem', display: 'flex', alignItems: 'flex-start', gap: '0.5rem' } },
            h('span', { style: { color: 'var(--info)', flexShrink: 0, marginTop: '0.1rem' } }, '•'),
            c
          ))
        )
      )
    );
  };

  // ===== MAIN RENDER =====
  const renderContent = () => {
    if (practiceMode) return renderPractice();
    switch(view) {
      case 'accueil': return renderAccueil();
      case 'rpc': return renderQuestionList('rpc');
      case 'ared': return renderQuestionList('ared');
      case 'motivation': return renderQuestionList('motivation');
      case 'methodo': return renderMethodo();
      case 'fiches': return renderFiches();
      case 'exemples': return renderExemples();
      case 'actualites': return renderActualites();
      case 'chiffres': return renderChiffres();
      case 'jourj': return renderJourJ();
      case 'suivi': return renderSuivi();
      case 'pratique': return renderPractice();
      default: return renderAccueil();
    }
  };

  return h('div', null,
    h('header', { className: 'header' },
      h('div', { className: 'header__badge' }, 'PASS SORBONNE UNIVERSITE 2026'),
      h('h1', { className: 'header__title' }, 'Preparation Oral Medecine'),
      h('p', { className: 'header__subtitle' }, totalQ + ' questions · Fiches thematiques · 7 exemples corriges · 13 actualites · Suivi & progression · Entrainement + auto-eval')
    ),
    renderStreakBanner(),
    renderNav(),
    renderContent()
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
