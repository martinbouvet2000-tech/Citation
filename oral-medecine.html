<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oral PASS Sorbonne 2026 - Preparation Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg-card: #14141e;
  --bg-card-hover: #1c1c2a;
  --bg-elevated: #1e1e2e;
  --border: #252538;
  --border-light: #35354a;
  --text: #e8e8f0;
  --text-secondary: #a0a0b8;
  --text-muted: #6a6a80;
  --accent: #7c6df0;
  --accent-light: #9d8ff7;
  --accent-dim: #4a3fb0;
  --accent-bg: rgba(124, 109, 240, 0.08);
  --success: #4ade80;
  --success-bg: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --warning-bg: rgba(251, 191, 36, 0.08);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.08);
  --info: #60a5fa;
  --info-bg: rgba(96, 165, 250, 0.08);
  --gradient-1: linear-gradient(135deg, #7c6df0, #60a5fa);
  --gradient-2: linear-gradient(135deg, #f87171, #fbbf24);
  --gradient-3: linear-gradient(135deg, #4ade80, #60a5fa);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

.app { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 3rem; }

/* Header */
.header {
  padding: 3rem 0 2rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}
.header__badge {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 1rem;
}
.header__title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  background: var(--gradient-1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.header__subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
}

/* Streak Banner */
.streak-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 0.8rem 1.5rem;
  background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(248,113,113,0.08));
  border: 1px solid rgba(251,191,36,0.25);
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
  50% { box-shadow: 0 0 20px rgba(251,191,36,0.15); }
}
.streak-fire { font-size: 1.5rem; }
.streak-count { font-size: 1.3rem; font-weight: 700; color: var(--warning); }
.streak-label { font-size: 0.85rem; color: var(--text-secondary); }
.streak-best { font-size: 0.75rem; color: var(--text-muted); }

/* Nav */
.nav {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0 0 1.5rem;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding-top: 0.5rem;
}
.nav::-webkit-scrollbar { display: none; }
.nav__btn {
  flex-shrink: 0;
  padding: 0.5rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.nav__btn:hover { background: var(--bg-card-hover); color: var(--text); border-color: var(--border-light); }
.nav__btn--active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.nav__btn--highlight {
  background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(248,113,113,0.1));
  border-color: var(--warning);
  color: var(--warning);
}
.nav__btn--highlight.nav__btn--active {
  background: linear-gradient(135deg, var(--warning), #f59e0b);
  color: #000;
}

/* Stats Bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.8rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  text-align: center;
  transition: all 0.2s;
}
.stat-card:hover { border-color: var(--border-light); transform: translateY(-1px); }
.stat-card__value { font-size: 1.4rem; font-weight: 700; }
.stat-card__label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.03em; }

/* Section Title */
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
  transition: all 0.2s;
}
.card:hover { border-color: var(--border-light); }
.card--accent { border-left: 3px solid var(--accent); }
.card--success { border-left: 3px solid var(--success); }
.card--warning { border-left: 3px solid var(--warning); }
.card--danger { border-left: 3px solid var(--danger); }

/* Questions */
.question {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 0.8rem;
  transition: all 0.25s;
  cursor: pointer;
}
.question:hover { border-color: var(--accent-dim); background: var(--bg-card-hover); }
.question--done { border-left: 3px solid var(--success); opacity: 0.7; }
.question__text { font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.5rem; }
.question__meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.question__tag {
  padding: 0.15rem 0.5rem;
  background: var(--accent-bg);
  border-radius: 10px;
  font-size: 0.68rem;
  color: var(--accent-light);
}
.question__diff {
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  font-size: 0.68rem;
  font-weight: 600;
}
.question__diff--1 { background: var(--success-bg); color: var(--success); }
.question__diff--2 { background: var(--warning-bg); color: var(--warning); }
.question__diff--3 { background: var(--danger-bg); color: var(--danger); }

/* Search & Filters */
.search-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.filter-btn {
  padding: 0.4rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn--active { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent-light); }

/* Progress Bar */
.progress { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; margin-bottom: 1rem; }
.progress__fill { height: 100%; background: var(--gradient-3); border-radius: 3px; transition: width 0.5s ease; }

/* Practice Mode */
.practice {
  background: var(--bg-card);
  border: 2px solid var(--accent-dim);
  border-radius: var(--radius-lg);
  padding: 2rem;
  text-align: center;
}
.practice__timer {
  font-size: 3rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin: 1rem 0;
}
.practice__timer--warn { color: var(--warning); }
.practice__timer--danger { color: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }
.practice__question {
  font-size: 1.1rem;
  line-height: 1.6;
  margin: 1.5rem 0;
  padding: 1rem;
  background: var(--bg-elevated);
  border-radius: var(--radius);
}

/* Buttons */
.btn {
  padding: 0.6rem 1.2rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn--primary { background: var(--accent); color: white; }
.btn--primary:hover { background: var(--accent-light); transform: translateY(-1px); }
.btn--success { background: var(--success); color: #000; }
.btn--success:hover { opacity: 0.9; }
.btn--danger { background: var(--danger); color: white; }
.btn--danger:hover { opacity: 0.9; }
.btn--ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn--ghost:hover { border-color: var(--accent); color: var(--accent-light); }
.btn--small { padding: 0.35rem 0.8rem; font-size: 0.75rem; }
.btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; }

/* Method Cards */
.method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.method-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  transition: all 0.2s;
}
.method-card:hover { border-color: var(--border-light); transform: translateY(-2px); }
.method-card__title { font-size: 1rem; font-weight: 700; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.method-card__list { list-style: none; }
.method-card__list li { padding: 0.3rem 0; font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 0.5rem; align-items: flex-start; }
.method-card__list li::before { content: ""; flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; margin-top: 0.5rem; }

/* Fiche Cards */
.fiche-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; }
.fiche-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  transition: all 0.2s;
}
.fiche-card:hover { transform: translateY(-2px); }
.fiche-card__title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.8rem; }
.fiche-card__section { margin-bottom: 0.8rem; }
.fiche-card__label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.fiche-card__items { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }
.fiche-card__law { font-size: 0.8rem; padding: 0.5rem; background: var(--info-bg); border-radius: var(--radius-sm); color: var(--info); margin-bottom: 0.5rem; }
.fiche-card__trap { font-size: 0.8rem; padding: 0.5rem; background: var(--danger-bg); border-radius: var(--radius-sm); color: var(--danger); }

/* Actu Grid */
.actu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.actu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  transition: all 0.2s;
  position: relative;
}
.actu-card:hover { border-color: var(--border-light); }
.actu-card--hot { border-color: var(--danger); }
.actu-card--hot::after {
  content: "PROBABLE";
  position: absolute;
  top: 0.8rem;
  right: 0.8rem;
  padding: 0.15rem 0.5rem;
  background: var(--danger);
  color: white;
  border-radius: 10px;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.actu-card__theme { font-size: 0.7rem; color: var(--accent-light); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.actu-card__title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; }
.actu-card__desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }

/* Timeline */
.timeline { position: relative; padding-left: 2rem; }
.timeline::before { content: ""; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline__item { position: relative; margin-bottom: 1.2rem; }
.timeline__item::before {
  content: "";
  position: absolute;
  left: -1.65rem;
  top: 0.5rem;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
}
.timeline__time { font-size: 0.75rem; font-weight: 700; color: var(--accent-light); margin-bottom: 0.2rem; }
.timeline__text { font-size: 0.85rem; color: var(--text-secondary); }

/* Exemple Reponse */
.exemple {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.exemple__question { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
.exemple__type { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; background: var(--accent-bg); color: var(--accent-light); margin-bottom: 1rem; }
.exemple__section { margin-bottom: 0.8rem; }
.exemple__label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.exemple__text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }

/* Auto-Eval Grid */
.eval-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
.eval-cat { background: var(--bg-elevated); border-radius: var(--radius); padding: 1rem; }
.eval-cat__title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.6rem; }
.eval-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
.eval-item:hover { color: var(--text); }
.eval-check { width: 16px; height: 16px; border: 2px solid var(--border-light); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.eval-check--done { background: var(--success); border-color: var(--success); }

/* Journal */
.journal-entry {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 0.8rem;
  transition: all 0.2s;
}
.journal-entry:hover { border-color: var(--border-light); }
.journal-entry__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
.journal-entry__date { font-weight: 600; font-size: 0.9rem; }
.journal-entry__confidence {
  padding: 0.2rem 0.6rem;
  border-radius: 10px;
  font-size: 0.72rem;
  font-weight: 600;
}
.journal-entry__stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.journal-entry__stat { font-size: 0.8rem; color: var(--text-secondary); }
.journal-entry__stat strong { color: var(--text); }
.journal-entry__notes { font-size: 0.82rem; color: var(--text-muted); font-style: italic; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
.journal-entry__ratings { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
.journal-entry__rating { padding: 0.2rem 0.5rem; background: var(--bg-elevated); border-radius: var(--radius-sm); font-size: 0.72rem; }

/* Daily Goal */
.daily-goal {
  background: linear-gradient(135deg, rgba(124,109,240,0.08), rgba(96,165,250,0.05));
  border: 1px solid var(--accent-dim);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.daily-goal__ring {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
}
.daily-goal__info { flex: 1; }
.daily-goal__title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; }
.daily-goal__sub { font-size: 0.78rem; color: var(--text-secondary); }

/* Rating input */
.rating-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.6rem; }
.rating-row__label { font-size: 0.82rem; color: var(--text-secondary); min-width: 110px; }
.rating-stars { display: flex; gap: 0.2rem; }
.rating-star {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border-light);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  transition: all 0.15s;
}
.rating-star:hover { border-color: var(--accent); color: var(--accent); }
.rating-star--active { background: var(--accent); border-color: var(--accent); color: white; }

/* Evolution Dashboard */
.evo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.evo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
}
.evo-card__title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.8rem; color: var(--text-secondary); }

/* Calendar Heatmap */
.heatmap { display: flex; gap: 2px; flex-wrap: wrap; }
.heatmap__day {
  width: 14px;
  height: 14px;
  border-radius: 2px;
  background: var(--bg-elevated);
}
.heatmap__day--1 { background: rgba(124,109,240,0.25); }
.heatmap__day--2 { background: rgba(124,109,240,0.45); }
.heatmap__day--3 { background: rgba(124,109,240,0.7); }
.heatmap__day--4 { background: var(--accent); }

/* SVG Charts */
.chart-container { width: 100%; overflow: hidden; }
.chart-container svg { width: 100%; height: auto; }

/* Form */
.form-group { margin-bottom: 1rem; }
.form-label { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; display: block; }
.form-textarea {
  width: 100%;
  padding: 0.6rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.85rem;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
  outline: none;
}
.form-textarea:focus { border-color: var(--accent); }
.form-select {
  padding: 0.5rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.82rem;
  outline: none;
  cursor: pointer;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.slide-up { animation: slideUp 0.4s ease-out; }

/* Responsive */
@media (max-width: 600px) {
  .app { padding: 0 1rem 2rem; }
  .header { padding: 2rem 0 1.5rem; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .method-grid, .fiche-grid, .actu-grid, .evo-grid { grid-template-columns: 1fr; }
  .practice { padding: 1.5rem; }
  .practice__timer { font-size: 2.5rem; }
  .eval-grid { grid-template-columns: 1fr; }
  .daily-goal { flex-direction: column; text-align: center; }
  .streak-banner { flex-wrap: wrap; justify-content: center; }
}

/* Confidence colors */
.confidence--1 { background: var(--danger-bg); color: var(--danger); }
.confidence--2 { background: var(--warning-bg); color: var(--warning); }
.confidence--3 { background: var(--info-bg); color: var(--info); }
.confidence--4 { background: var(--success-bg); color: var(--success); }
.confidence--5 { background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(96,165,250,0.1)); color: var(--success); }

/* Accordion response */
.resp-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.6rem;
  padding: 0.5rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;

  actualites: [
    { theme: "Fin de vie / Aide active a mourir", titre: "Projet de loi sur l'aide active a mourir (2025-2026)", desc: "Debat majeur en France. Loi Claeys-Leonetti (2016) autorise la sedation profonde mais PAS l'euthanasie ni le suicide assiste. Un projet de loi sur l'aide active a mourir a ete depose. La Belgique, les Pays-Bas et la Suisse ont des legislations plus permissives. Arguments pour : dignite, autonomie, souffrance insupportable. Arguments contre : pente glissante, role du medecin, soins palliatifs insuffisants.", hot: true },

    { theme: "Sante mentale des jeunes", titre: "Explosion des troubles psychiques chez les 15-25 ans", desc: "+30% de troubles anxieux et depressifs chez les jeunes depuis le COVID. Tentatives de suicide en hausse. Manque criant de pedopsychiatres. Dispositif Mon Parcours Psy (8 seances remboursees) juge insuffisant. Role des reseaux sociaux dans la comparaison sociale et le cyberharcelement." },

  "Votre voisin a un chien. Depuis quelque temps, vous remarquez qu'il le laisse enferme dans la voiture par forte chaleur. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : voisin laisse son chien enferme dans une voiture par forte chaleur — risque vital pour l'animal. Acteurs : moi (temoin), le voisin (proprietaire), le chien (victime). Problematique : comment reagir face a un acte de maltraitance animale potentielle sans basculer dans le conflit ou l'inaction ?\n\n🔍 ANALYSE (2 min)\n• Urgence veterinaire : des 25-30 degres en voiture, la temperature monte a 50+ en 10 min — risque de coup de chaleur fatal\n• Cadre legal : la maltraitance animale est un delit penal (art. 521-1 Code penal), signalement possible a la police/gendarmerie ou SPA\n• Dimension relationnelle : le voisin n'est peut-etre pas conscient du danger — l'approche directe et calme est prioritaire avant toute escalade\n\n⚖️ DISCUSSION (1.5 min)\n• Pour l'action immediate : appeler le voisin/proprietaire d'abord si identifiable, puis alerter les secours (pompiers, police) si injoignable — ne pas briser la vitre soi-meme sans avoir epuise les recours legaux\n• Nuance : distinguer negligence ponctuelle et maltraitance repetee — la reponse proportionnelle differe\n• Risque de conflit de voisinage vs risque vital pour l'animal : le second prime\n\n✅ CONCLUSION (0.5 min)\nJ'agis immediatement : tentative de contact du voisin, puis alerte police/pompiers sans attendre. La protection de l'animal prevaut sur l'inconfort relationnel. Ouverture : cela souleve la question de l'education aux responsabilites envers les animaux.",
  "Vous etes en colocation avec 3 personnes. L'une d'elles manifeste des comportements suicidaires. Comment reagissez-vous ?": "📋 INTRODUCTION (1 min)\nSituation : colocataire presentant des signes de comportement suicidaire (propos, gestes, isolement). Acteurs : moi, le colocataire en danger, les autres colocataires. Problematique : comment proteger une personne en crise psychiatrique tout en respectant son autonomie et sans aggraver la situation ?\n\n🔍 ANALYSE (2 min)\n• Evaluation du danger immediat : distinguer ideation suicidaire (penser au suicide) et passage a l'acte imminent — les deux necessitent une intervention mais avec une urgence differente\n• Premier geste : parler directement, sans tabou — demander 'tu penses au suicide ?' ne declenche pas le passage a l'acte, cela brise l'isolement (recommandation HAS)\n• Ressources : 3114 (numero national de prevention du suicide), SAMU 15 si danger immediat, equipe mobile psychiatrie\n\n⚖️ DISCUSSION (1.5 min)\n• Tension : respecter la vie privee vs obligation morale de proteger — en cas de danger vital, la protection prime\n• Informer les autres colocataires ? Oui si coordination necessaire, avec discernement\n• Limites de mon role : je ne suis pas soignant, je ne dois pas me substituer aux professionnels mais faciliter l'acces aux soins\n\n✅ CONCLUSION (0.5 min)\nJe rentre en contact bienveillant et direct, j'appelle le 3114 ou les secours si besoin. Je ne reste pas seul avec ce poids. Ouverture : sante mentale des etudiants — sujet de sante publique majeur (1 etudiant sur 5 en souffrance psychologique, rapport Ipsos 2023).",
  "Votre voisin menace de mettre fin a ses jours. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : voisin exprimant verbalement une intention suicidaire — menace directe. Acteurs : moi (temoin exterieur), le voisin, potentiellement sa famille/entourage. Problematique : comment reagir en urgence face a une menace suicidaire d'une personne que je connais peu ?\n\n🔍 ANALYSE (2 min)\n• Protocole d'urgence : appeler le 15 (SAMU) ou le 3114 (numero national suicide) immediatement si danger immediat — ne pas laisser la personne seule\n• Communication : rester calme, ne pas minimiser ('c'est pour attirer l'attention'), ne pas argumenter, montrer qu'on prend au serieux\n• Cadre legal : en France, toute personne peut alerter les secours en cas de danger vital — obligation morale et devoir d'assistance a personne en danger (art. 223-6 Code penal)\n\n⚖️ DISCUSSION (1.5 min)\n• Dilemme : appeler les secours peut etre vecu comme une trahison par la personne — mais le risque vital prevaut\n• Rester physiquement present ou maintenir le contact verbal jusqu'a l'arrivee des secours si possible\n• Apres l'intervention : ne pas se sentir responsable du resultat, penser a mon propre etat emotionnel (choc vicariante)\n\n✅ CONCLUSION (0.5 min)\nJ'appelle le 15 ou le 3114 sans attendre, je reste en contact avec le voisin et j'attends les secours. La vie prime sur toute autre consideration. Ouverture : importance de la formation au premier secours psychologique dans la population generale.",
  "Un de vos amis proches vous confie qu'il triche regulierement aux examens. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : ami proche qui triche regulierement aux examens et me le confie. Acteurs : moi, mon ami, les autres etudiants (concurrents loyaux), l'institution. Problematique : comment concilier loyaute amicale et integrite personnelle face a une injustice qui lesе autrui ?\n\n🔍 ANALYSE (2 min)\n• Dimension ethique : la triche fausse la competition, desavantage les etudiants honnetes et devalue le diplome — injustice collective\n• Dimension amicale : la confiance accordee cree une obligation morale de discretion, mais pas de complicite active\n• En medecine particulierement : l'integrite est une valeur fondatrice — un futur medecin qui triche interroge la confiance qu'on lui accordera\n\n⚖️ DISCUSSION (1.5 min)\n• Je ne denonce pas spontanement — mais j'exprime clairement a mon ami mon inconfort et mon desaccord, sans jugement violent\n• Je lui explique les risques concrets : exclusion, mention au dossier, consequences professionnelles\n• Limite : si la triche se poursuit et s'aggrave (fraude organisee), ma position evolue — complicite par silence est une position intenable\n\n✅ CONCLUSION (0.5 min)\nJe parle a mon ami avec franchise et bienveillance. Je ne me fais pas complice mais je respecte la confidentialite a ce stade. Ouverture : la question de l'integrite en medecine va bien au-dela des examens — elle conditionne la confiance des patients.",
  "Vous etes temoin d'un accident de la route. Une personne est blessee. Decrivez vos actions.": "📋 INTRODUCTION (1 min)\nSituation : accident de la route, victime visible et blessée. Acteurs : moi (temoin), la/les victimes, autres temoins eventuels, secours. Problematique : comment agir efficacement et en securite pour proteger les victimes sans aggraver leur etat ?\n\n🔍 ANALYSE (2 min)\n• Protocole PROTEGER-ALERTER-SECOURIR : 1) Proteger la scene (triangle, feux de detresse, ne pas deplacer la victime sauf danger immediat) 2) Alerter le 15 ou le 112 en donnant localisation precise, nombre de victimes, etat apparent 3) Secourir selon mes competences sans prendre de risque\n• Cadre legal : non-assistance a personne en danger = delit penal (art. 223-6 Code penal) — obligation d'agir\n• Gestes interdits sans formation : ne pas retirer le casque, ne pas deplacer un blesse rachidien\n\n⚖️ DISCUSSION (1.5 min)\n• Tension : vouloir aider tout de suite vs risque d'aggraver une lesion rachidienne ou cervicale\n• Importance du bilan transmis au 15 : la qualite de l'information conditionne la reponse medicale\n• Gestion des autres temoins : deleguer (un appel 15, un guidage des secours) pour organiser l'action collective\n\n✅ CONCLUSION (0.5 min)\nJe protege, j'alerte le 15, je reste aupres de la victime et j'applique les consignes du regulateur. Ouverture : la formation aux gestes de premiers secours (PSC1) devrait etre generalisee — elle sauve des vies.",
  "Un camarade de promotion vous demande de signer la feuille de presence a sa place. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : camarade absent qui me demande de falsifier la feuille de presence en signant a sa place. Acteurs : moi, le camarade, l'institution universitaire. Problematique : comment refuser sans rompre la relation tout en preserver mon integrite et celle du systeme ?\n\n🔍 ANALYSE (2 min)\n• Dimension deontologique : signer a la place de quelqu'un est un faux en ecriture — faute disciplinaire universitaire pouvant entrainer une sanction pour les deux\n• Precedent personnel : en acceptant, je construis une identite professionnelle fondee sur le compromis — particulierement problematique pour un futur soignant\n• Solidarite mal placee : aider un ami n'est pas vertueux quand cela se fait au detriment des regles qui protegent tous les etudiants\n\n⚖️ DISCUSSION (1.5 min)\n• Je refuse clairement mais sans moraliser excessivement — 'je ne peux pas faire ca, ca nous met tous les deux en danger'\n• Je propose une alternative : justifier l'absence aupres du secretariat, expliquer la situation reelle\n• Risque relationnel : le camarade peut mal le vivre — mais une amitie qui repose sur la complicite dans la fraude est fragile\n\n✅ CONCLUSION (0.5 min)\nRefus ferme et bienveillant, proposition d'alternative legitimate. Ouverture : l'integrite academique est le premier terrain d'entrainement de l'integrite professionnelle medicale.",
  "Votre colocataire traverse une periode de depression et refuse toute aide. Comment gerez-vous la situation ?": "📋 INTRODUCTION (1 min)\nSituation : colocataire depressif qui refuse explicitement toute aide. Acteurs : moi, le colocataire, eventuellement sa famille ou des professionnels. Problematique : comment respecter l'autonomie d'une personne souffrante tout en ne l'abandonnant pas ?\n\n🔍 ANALYSE (2 min)\n• Principe d'autonomie : un adulte a le droit de refuser de l'aide — sauf si sa vie est en danger immediat (passage a l'acte suicidaire)\n• Presence silencieuse : rester disponible sans forcer — la depression isole, la simple presence non-intrusive peut briser cet isolement\n• Signaux d'alarme a surveiller : propos suicidaires, refus de s'alimenter, aggravation rapide — seuil a partir duquel l'intervention s'impose\n\n⚖️ DISCUSSION (1.5 min)\n• Tension : respecter le 'non' vs ne pas se rendre complice par inaction d'une degradation de son etat\n• Informer la famille ? Cela depend du degre de confiance et du danger — a envisager en dernier recours\n• Prendre soin de moi aussi : vivre avec quelqu'un en depression est epuisant — je peux moi-meme avoir besoin de soutien\n\n✅ CONCLUSION (0.5 min)\nJe reste present sans forcer, j'observe les signes d'aggravation et j'interviens si danger vital. Ouverture : la depression est une maladie (pas une faiblesse) — destigmatisation necesssaire, surtout chez les etudiants.",
  "Vous trouvez un portefeuille contenant 500 euros et une carte d'identite dans la rue. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : je trouve un portefeuille avec 500 euros et une carte d'identite — objet perdu appartenant clairement a quelqu'un. Acteurs : moi, le proprietaire inconnu. Problematique : quelle est la conduite moralement et legalement correcte ?\n\n🔍 ANALYSE (2 min)\n• Obligation legale : l'appropriation d'un bien perdu est reprimee (art. 311-5 Code penal — vol par recel d'un bien trouve) — obligation de remettre aux autorites ou de tenter de contacter le proprietaire\n• Conduite pratique : tenter de retrouver le proprietaire via la carte d'identite (nom visible), sinon deposer au commissariat ou a la mairie qui notifiera le proprietaire\n• Valeur educative : ce que je ferais dans cette situation dit quelque chose de qui je suis — la tentation des 500 euros est reelle, l'honnetet se teste precisement la\n\n⚖️ DISCUSSION (1.5 min)\n• 500 euros est une somme significative, surtout en etant etudiant — la tentation est reelle mais rationaliser le vol ('il aurait pu perdre ca') est un glissement moral\n• Que je sois observe ou non ne change rien — l'integrite n'est pas situationnelle\n• Attente d'une recompense ? Possible mais pas le moteur de l'action honnete\n\n✅ CONCLUSION (0.5 min)\nJe remets le portefeuille au commissariat apres tentative de contact. L'honnetet n'est pas negociable selon les sommes. Ouverture : la confiance sociale repose sur ces micro-decisions quotidiennes d'integrite.",
  "Un ami vous avoue qu'il conduit regulierement en etat d'ivresse. Comment reagissez-vous ?": "📋 INTRODUCTION (1 min)\nSituation : ami qui conduit en etat d'ivresse regulierement — risque grave pour lui et pour autrui. Acteurs : moi, mon ami, les usagers de la route potentiellement victimes. Problematique : comment reagir face a un comportement dangereux d'un proche qui met en jeu des vies ?\n\n🔍 ANALYSE (2 min)\n• Risque objectif : l'alcool au volant est la 2e cause de mortalite routiere en France (30% des tues, ONISR 2023) — ce n'est pas une preference personnelle mais un danger pour autrui\n• Cadre legal : conduire en etat d'ivresse = delit penal (art. L234-1 Code de la route), permis, prison possible — mon ami prend un risque enorme\n• Mon role d'ami : lui dire la verite meme si c'est inconfortable — la vraie amitie ne se tait pas face au danger\n\n⚖️ DISCUSSION (1.5 min)\n• Je ne le signale pas a la police — mais j'exprime clairement que je ne monterai plus dans sa voiture dans ces conditions\n• Je lui propose des alternatives concretes : VTC, taxi, dormir sur place, designe un chauffeur\n• Limite : si je sais qu'il va conduire ivre maintenant et qu'il y a un danger immediat pour autrui, ma position evolue — alerte possible\n\n✅ CONCLUSION (0.5 min)\nJe parle franchement, je pose mes limites et je propose des solutions. Ouverture : la prevention de l'alcool au volant passe aussi par l'entourage, pas seulement par les sanctions.",
  "Vous decouvrez que votre proprietaire ne respecte pas les normes de securite de l'immeuble. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : proprietaire en infraction sur les normes de securite (incendie, electricite, etc.) de l'immeuble ou de mon logement. Acteurs : moi (locataire), le proprietaire, les autres locataires, les institutions. Problematique : comment proteger ma securite et celle des autres locataires en utilisant les voies appropriees ?\n\n🔍 ANALYSE (2 min)\n• Obligation legale du proprietaire : decence et securite du logement (loi du 6 juillet 1989) — non-respect ouvre droit a action en justice et retention de loyer\n• Demarche progressive : d'abord signalement ecrit au proprietaire (lettre recommandee AR), puis Agence Departementale d'Information sur le Logement (ADIL), puis mairie/prefecture (pouvoir de police du maire)\n• Enjeu collectif : les autres locataires sont aussi en danger — agir collectivement est plus efficace et moins risque individuellement\n\n⚖️ DISCUSSION (1.5 min)\n• Risque de represailles du proprietaire (pression, conge) — protections legales existent mais les desequilibres de pouvoir sont reels\n• Tension entre pragmatisme (garder le logement) et securite (agir)\n• Connaitre mes droits avant d'agir — l'ADIL offre un conseil gratuit\n\n✅ CONCLUSION (0.5 min)\nJ'agis par voies progressives : signalement ecrit, puis recours institutionnels. La securite ne se negocie pas. Ouverture : le mal-logement est un determinant majeur de sante publique en France.",
  "Un SDF vous demande de l'aide devant une pharmacie en plein hiver. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : personne sans domicile fixe en demande d'aide par temps hivernal — situation de precarite et de risque vital. Acteurs : moi, la personne SDF, les structures d'aide disponibles. Problematique : quelle aide apporter sans me substituer aux dispositifs existants ni ignorer une detresse immediate ?\n\n🔍 ANALYSE (2 min)\n• Urgence immediate : en dessous de 0 degre, risque d'hypothermie — appeler le 115 (SAMU Social) si besoin de mise a l'abri d'urgence\n• Aide directe possible : un repas, un cafe, des vetements chauds — geste de dignite sans necessite d'expertise\n• Dispositifs existants : 115, Croix-Rouge, Secours Populaire, centres d'hebergement d'urgence (CHU) — orienter verbalement\n\n⚖️ DISCUSSION (1.5 min)\n• Debat classique : donner de l'argent ou non — risque d'utilisation pour alcool/drogue vs droit au choix de la personne\n• Je ne peux pas resoudre la grande pauvrete seul — mais l'inaction par paralysie face a l'ampleur du probleme est un piege\n• Regard et reconnaissance : parfois ce que la personne attend le plus, c'est d'etre vue et traitee comme un etre humain\n\n✅ CONCLUSION (0.5 min)\nJe m'arrete, j'ecoute, j'aide concrètement a ma mesure et j'oriente vers le 115 si urgence. Ouverture : la grande precarite est un echec collectif qui interroge les politiques de sante et de logement.",
  "Vous assistez a une scene de harcelement dans les transports en commun. Comment reagissez-vous ?": "📋 INTRODUCTION (1 min)\nSituation : je suis temoin d'une scene de harcelement (verbal, physique ou sexiste) dans un transport en commun. Acteurs : moi (temoin), la victime, l'agresseur, les autres passagers. Problematique : comment intervenir efficacement sans m'exposer a un danger tout en ne laissant pas la victime seule ?\n\n🔍 ANALYSE (2 min)\n• Effet spectateur (Bystander effect) : plus il y a de temoins, moins chacun intervient — me signaler comme temoin actif rompt cette passivite collective\n• Technique de l'intervention indirecte : s'adresser a la victime directement ('tu vas bien ?', 'tu descends au prochain arret ?') sans confronter l'agresseur — technique validee et plus sure\n• Alerter : signaler au conducteur, appeler le 3117 (numero securite SNCF) ou le 17\n\n⚖️ DISCUSSION (1.5 min)\n• Confrontation directe avec l'agresseur : risque d'escalade et de danger physique — a eviter sauf si danger immediat\n• Mon obligation morale vs ma securite personnelle — je peux etre utile sans prendre de risque excessif\n• Apres : temoigner aupres de la victime, proposer de l'accompagner a un endroit sur\n\n✅ CONCLUSION (0.5 min)\nJ'interviens de maniere indirecte et bienveillante, j'alerte et je reste aupres de la victime. Ouverture : la lutte contre le harcelement passe par la formation des temoins — chacun peut etre acteur.",
  "Un de vos professeurs fait une remarque que vous jugez discriminatoire envers un etudiant. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : professeur qui tient une remarque discriminatoire (ethnique, sociale, de genre...) envers un etudiant en cours. Acteurs : moi (temoin), l'etudiant vise, le professeur, les autres etudiants. Problematique : comment reagir a une discrimination en contexte hierarchique sans aggraver la situation ?\n\n🔍 ANALYSE (2 min)\n• Discrimination : interdit par la loi (art. 225-1 Code penal) et le reglement universitaire — ce n'est pas une question d'opinion\n• L'etudiant vise : a-t-il besoin de soutien immediat ? Me tourner vers lui apres le cours est un premier geste\n• Voies de recours : referent egalite de l'universite, defenseur des droits, direction de la composante — la hierarchie a obligation d'agir\n\n⚖️ DISCUSSION (1.5 min)\n• Intervenir en temps reel en cours : efficace mais risque de represailles — necessite du courage moral et d'une formulation mesured ('je n'ai pas bien compris ce que vous vouliez dire...')\n• Attendre apres le cours : moins expose mais la remarque reste sans reaction publique\n• Agir collectivement avec d'autres etudiants qui ont ete temoins : plus de poids\n\n✅ CONCLUSION (0.5 min)\nJe soutiens l'etudiant vise et utilise les voies institutionnelles appropriees. Ouverture : la discrimination en milieu medical est un frein a la diversite du corps soignant et a la confiance des patients.",
  "Votre meilleur ami vous demande de mentir a ses parents pour le couvrir. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : meilleur ami qui me demande de mentir a ses parents pour couvrir une situation qu'il me cache ou qu'il veut cacher. Acteurs : moi, mon ami, ses parents. Problematique : ou s'arrete la loyaute amicale quand elle exige un mensonge actif ?\n\n🔍 ANALYSE (2 min)\n• Degre de gravite : de quoi s'agit-il ? Une sortie ratee ou une situation dangereuse ? Ma reponse depend du contexte\n• Mensonge actif vs omission : il y a une difference — mais les deux engagent ma parole et ma credibilite\n• Relation avec les parents : mentir les prive d'informations qui pourraient etre cruciales pour la securite de mon ami\n\n⚖️ DISCUSSION (1.5 min)\n• Je peux ne pas divulguer spontanement — mais je ne vais pas construire un mensonge elabore : 'je ne sais pas' ou 'il faut lui demander directement'\n• Si l'enjeu est la securite de mon ami (addiction, comportement a risque), le mensonge devient contre-productif : il empeche l'aide\n• L'amitie veritable dit parfois des choses difficiles a l'ami lui-meme\n\n✅ CONCLUSION (0.5 min)\nJe refuse de mentir activement, je propose a mon ami d'assumer lui-meme. Ouverture : la vraie amitie n'est pas la complicite aveugle — c'est savoir dire non quand cela protege l'autre.",
  "Vous remarquez qu'un enfant est seul et en pleurs dans un centre commercial depuis 30 minutes. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : enfant seul et en pleurs depuis 30 minutes dans un lieu public — situation inquietante qui peut signaler une separation accidentelle ou, dans les cas graves, une situation de danger. Acteurs : moi, l'enfant, ses parents/accompagnants, le personnel du centre commercial. Problematique : comment proteger un enfant vulnerable sans agir de facon inadaptee ?\n\n🔍 ANALYSE (2 min)\n• Action immediate : m'approcher calmement, me mettre a la hauteur de l'enfant, lui parler doucement — ne pas le toucher sans son accord\n• Alerter le personnel du centre commercial : ils ont des protocoles (appel micro, espace enfants perdus) — c'est la voie la plus rapide\n• Si 30 min sans parents identifies : contacter le 17 (police) ou le 15 pour signalement — obligation d'assistance a mineur en danger\n\n⚖️ DISCUSSION (1.5 min)\n• Tension : agir vs risque de faire peur a l'enfant ou d'etre mal interprete par les passants\n• Ne pas l'emmener seul ailleurs — rester visible, en public, avec d'autres personnes\n• Le plus probable : parents qui cherchent de leur cote — coordonner la recherche avec le personnel\n\n✅ CONCLUSION (0.5 min)\nJe reste aupres de l'enfant, j'alerte le personnel, j'appelle la police si situation prolongee. Ouverture : la protection de l'enfance est une responsabilite collective — chaque adulte est un 'filet de securite' potentiel.",
  "Vous surprenez un collegue en train de voler dans les vestiaires. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : j'attrape un collegue en flagrant delit de vol dans les vestiaires. Acteurs : moi, le collegue voleur, les victimes potentielles (autres collegues). Problematique : comment reagir face a un delit commis par quelqu'un de mon environnement professionnel proche ?\n\n🔍 ANALYSE (2 min)\n• Certitude du fait : j'ai vu — ce n'est pas une rumeur ou une suspicion, ma position est claire\n• Confrontation immediate : interpeller le collegue, lui faire comprendre que j'ai vu — cela peut suffire a stopper le comportement\n• Signalement : a la direction ou au responsable — le vol est un delit penal, l'entreprise/institution a le droit et le devoir d'agir\n\n⚖️ DISCUSSION (1.5 min)\n• Dilemme : denoncer un collegue vs laisser un delit impuni qui victimise d'autres\n• 'Solidarite corporative' ou culture du silence : risques pour la confiance collective dans l'equipe\n• Circonstances attenuantes possibles : precarite, premier ecart — mais cela ne change pas la necessite d'agir\n\n✅ CONCLUSION (0.5 min)\nJe confronte le collegue et je signale aux responsables. Ouverture : la transparence et l'integrite au sein d'une equipe soignante sont des valeurs fondatrices — ce qui se passe dans les vestiaires dit quelque chose de la culture du service.",
  "Un voisin age vit seul et vous n'avez pas de nouvelles depuis plusieurs jours. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : voisin age, vivant seul, dont je n'ai plus de nouvelles depuis plusieurs jours — risque de chute, malaise, isolement. Acteurs : moi, le voisin, sa famille eventuelle, les services sociaux. Problematique : comment agir face a une inquietude pour une personne vulnerable sans violer son intimite ?\n\n🔍 ANALYSE (2 min)\n• Personnes agees isolees : 300 morts pendant la canicule de 2003 — le precedent a mene a la creation du plan canicule et des registres communaux de personnes vulnerables\n• Demarche progressive : frapper a la porte, observer (courrier qui s'accumule, volets fermes), contacter la famille si connue, puis le gardien/bailleur\n• Si toujours sans reponse : appeler le 15 (SAMU) ou le 17 (police) pour une verification de bien-etre — c'est leur mission\n\n⚖️ DISCUSSION (1.5 min)\n• Respect de la vie privee vs obligation morale — la personne peut tres bien etre en vacances ou chez de la famille\n• Mais l'inaction face a un doute peut couter une vie — mieux vaut deranger inutilement que ne pas agir\n• Apres : lien social maintenu, connaitre les structures comme 'Bien Vieillir' ou les CCAS municipaux\n\n✅ CONCLUSION (0.5 min)\nJ'agis progressivement, j'alerte les secours si doute serieux. Ouverture : l'isolement des personnes agees est un probleme de sante publique majeur — les liens de voisinage sont une premiere protection.",
  "Votre groupe de travail decide d'exclure un etudiant car il 'ralentit le groupe'. Votre reaction ?": "📋 INTRODUCTION (1 min)\nSituation : le groupe de travail veut exclure un etudiant sous pretexte d'efficacite. Acteurs : moi, le groupe, l'etudiant exclu. Problematique : comment concilier efficacite collective et inclusion d'un membre moins rapide — et quel role je joue dans cette dynamique ?\n\n🔍 ANALYSE (2 min)\n• Discrimination implicite : 'ralentir le groupe' peut masquer une intolerande a la difference (handicap, difficultes d'apprentissage, langue) — a questionner\n• Valeur pedagogique de la diversite : un groupe homogene et rapide apprend moins qu'un groupe divers qui se confronte aux differences de rythme\n• En medecine : l'equipe soignante doit integrer des profils varies — s'entrainer a l'inclusion des la formation est formateur\n\n⚖️ DISCUSSION (1.5 min)\n• Je m'oppose a l'exclusion et je propose une reorganisation du travail qui integre les differences de rythme\n• Si l'etudiant a des difficultes reelles : orienter vers les services d'aide de l'universite plutot qu'exclure\n• Risque : si je m'oppose seul, je peux etre marginalisee aussi — courage collectif a mobiliser\n\n✅ CONCLUSION (0.5 min)\nJe refuse l'exclusion, je propose une solution inclusive. Ouverture : la medecine du futur a besoin de medecins capables de travailler avec des equipes diverses — l'inclusion s'apprend.",
  "Un patient refuse une transfusion sanguine pour des raisons religieuses alors que sa vie est en danger. Que pensez-vous de cette situation ?": "📋 INTRODUCTION (1 min)\nSituation archetype du conflit ethique : patient adulte temoins de Jehovah refusant une transfusion vitale. Acteurs : le patient, le medecin, l'equipe soignante, la famille, le juge si recours. Problematique : comment respecter l'autonomie du patient tout en assurant notre devoir de soin ?\n\n🔍 ANALYSE (2 min)\n• Principe d'autonomie (loi du 4 mars 2002, dite loi Kouchner) : tout patient adulte et capable a le droit de refuser un traitement, y compris vital — le consentement eclaire est fondamental\n• Principe de bienfaisance : le medecin a une obligation de tout faire pour sauver la vie — tension reelle avec l'autonomie\n• Cadre legal actuel : l'arret du CE (27 oct. 2011, Baylac) confirme que le medecin doit respecter le refus d'un adulte conscient et informe, meme si fatal\n\n⚖️ DISCUSSION (1.5 min)\n• Nuance si urgence absolue et patient inconscient : le medecin peut transfuser en urgence vitale, le juge des referes peut l'autoriser\n• Nuance si mineur : les parents ne peuvent pas opposer leurs convictions religieuses a la survie de l'enfant — le tribunal peut passer outre\n• Role du soignant : accompagner, informer, proposer des alternatives (erythropoietine, chirurgie sans sang), respecter sans abandonner\n\n✅ CONCLUSION (0.5 min)\nL'autonomie du patient adulte conscient prime, meme au risque de la mort — c'est douloureux mais c'est le cadre legal et ethique francais. Ouverture : la relation medecin-patient est fondee sur la confiance, pas sur la contrainte.",
  "Faut-il dire toute la verite a un patient atteint d'une maladie incurable ? Discutez.": "📋 INTRODUCTION (1 min)\nQuestion fondamentale de la relation therapeutique : l'annonce d'un pronostic grave. Acteurs : le medecin, le patient, sa famille. Problematique : quelles sont les obligations du medecin face a la verite, et comment les concilier avec la protection du patient ?\n\n🔍 ANALYSE (2 min)\n• Obligation legale : la loi du 4 mars 2002 garantit au patient le droit a l'information sur son etat de sante — mais aussi le droit de ne pas savoir (art. L1111-2 CSP)\n• Verite progressive et adaptee : l'information se donne par etapes, en tenant compte de l'etat emotionnel du patient — le 'tout dire d'un coup' peut etre traumatisant\n• Privilege therapeutique : notion controversee selon laquelle le medecin peut taire une information si elle risque de nuire gravement — aujourd'hui tres limite juridiquement\n\n⚖️ DISCUSSION (1.5 min)\n• Arguments pour la verite complete : respecte l'autonomie, permet au patient d'organiser sa vie (famille, fin de vie), fonde la relation sur la confiance\n• Arguments pour la moderation : certains patients ne veulent pas savoir — respecter ce desir est aussi du respect de l'autonomie\n• Dispositif d'annonce : la circulaire 2004 recommande une consultation dediee, multi-professionnelle (medecin + psychologue + infirmier)\n\n✅ CONCLUSION (0.5 min)\nDire la verite oui, mais avec humanite, en plusieurs temps, en respectant le rythme du patient. Ouverture : la communication est le premier acte therapeutique — elle s'apprend et se travaille.",
  "Un medecin decouvre qu'un patient, chauffeur de bus, a une pathologie qui le rend dangereux au volant. Le patient refuse d'arreter de conduire. Que faire ?": "📋 INTRODUCTION (1 min)\nDilemme majeur : secret medical vs protection de la securite publique. Acteurs : le medecin, le patient (chauffeur de bus), les usagers du bus. Problematique : le medecin peut-il rompre le secret medical pour proteger des tiers ?\n\n🔍 ANALYSE (2 min)\n• Secret medical (art. L1110-4 CSP) : principe fondamental — mais pas absolu. Des exceptions existent (ex : maladies contagieuses a declaration obligatoire, signalement enfance en danger)\n• La loi ne prevoit pas d'exception explicite pour 'danger au volant' — mais l'art. R241-44 du Code de la route permet au medecin du travail d'emettre un avis d'inaptitude\n• Voie privilegiee : contacter le medecin du travail de la RATP/entreprise ou saisir la commission medicale du permis de conduire via la prefecture — voie legale sans rompre le secret\n\n⚖️ DISCUSSION (1.5 min)\n• Si le medecin signale directement : risque juridique (violation secret medical), perte de confiance des patients envers la medecine\n• Si le medecin ne fait rien et qu'un accident survient : responsabilite morale, voire penale par omission\n• Solution : epuiser les voies indirectes (medecin du travail, dialogue avec le patient, certificat de contre-indication) avant toute rupture du secret\n\n✅ CONCLUSION (0.5 min)\nJe passe par les voies legales (medecin du travail, prefecture) pour agir sans violer directement le secret. Ouverture : ce cas illustre les limites du secret medical — le droit evolue pour integrer davantage la protection des tiers.",
  "Les parents d'un enfant de 5 ans refusent de le faire vacciner. Quelle est votre position ?": "📋 INTRODUCTION (1 min)\nSituation de tension entre liberte parentale et sante publique. Acteurs : les parents, l'enfant (incapable legal), le medecin, la societe. Problematique : peut-on imposer la vaccination aux parents au nom de l'interet de l'enfant et de l'immunite collective ?\n\n🔍 ANALYSE (2 min)\n• Cadre legal : depuis 2018, 11 vaccins obligatoires pour les enfants nes apres le 1er janvier 2018 (DTP, coqueluche, rougeole, etc.) — les parents n'ont pas le choix legal\n• Immunite collective : pour eradiquer la rougeole, il faut 95% de couverture vaccinale — les refus creent des 'trous' qui protegent les enfants non-vaccinables (immunodeprimes)\n• Role du medecin : ecouter les craintes, apporter des informations scientifiques fiables, pas forcer mais insister sur les risques pour l'enfant et l'entourage\n\n⚖️ DISCUSSION (1.5 min)\n• Arguments contre l'obligation : liberte parentale, defiance envers les institutions, peur des effets secondaires (infondee sur les vaccins obligatoires)\n• Arguments pour l'obligation : l'enfant n'a pas choisi, il a droit a la protection vaccinale ; la liberte individuelle s'arrete ou elle met en danger autrui\n• Relation therapeutique : forcer la vaccination sans dialogue detruit la confiance — dialogue d'abord, obligation en dernier recours legal\n\n✅ CONCLUSION (0.5 min)\nLa vaccination obligatoire est justifiee par la protection collective — le dialogue avec les parents est essentiel mais ne remplace pas la loi. Ouverture : la defiance vaccinale est un enjeu de sante publique qui appelle une politique de communication robuste.",
  "Un adolescent de 15 ans vous demande de ne pas informer ses parents de sa consultation. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : mineur de 15 ans qui consulte et demande la confidentialite vis-a-vis de ses parents. Acteurs : le mineur, le medecin, les parents (detenteurs de l'autorite parentale). Problematique : comment respecter l'intimite d'un adolescent tout en exercant notre devoir de soin ?\n\n🔍 ANALYSE (2 min)\n• Cadre legal : la loi du 4 mars 2002 permet au mineur de consulter seul et en confidentialite pour des actes de prevention (contraception, IVG, traitement de l'addiction, IST) — le medecin peut accepter sans informer les parents\n• Condition : le mineur doit etre accompagne d'une personne majeure de son choix ou seul — et le medecin doit l'inviter a impliquer ses parents si possible\n• Au-dela de 15 ans : la demande de confidentialite est recevable — avant, le mineur est plus vulnerable et l'implication parentale plus necessaire\n\n⚖️ DISCUSSION (1.5 min)\n• Si la sante ou la securite du mineur est en danger (violence, abus) : le medecin peut et doit informer — l'interet superieur de l'enfant prime\n• Relation de confiance : si le medecin viole systematiqueemnt la confidentialite des ados, ils n'iront plus consulter — contre-productif pour leur sante\n• Role educatif : encourager l'ado a parler a ses parents si c'est sans danger — sans forcer\n\n✅ CONCLUSION (0.5 min)\nJ'accepte la demande de confidentialite dans le cadre legal, je propose le soutien d'une personne de confiance. Ouverture : la sante sexuelle et mentale des adolescents exige des espaces de parole proteges.",
  "Doit-on accepter l'euthanasie en France ? Presentez les arguments pour et contre.": "📋 INTRODUCTION (1 min)\nQuestion societale majeure, regulierement debattue en France. Contexte : loi Claeys-Leonetti (2016) encadre la sedation profonde et continue — mais l'euthanasie active reste illegale. Problematique : faut-il aller plus loin et legaliser l'euthanasie active comme en Belgique ou aux Pays-Bas ?\n\n🔍 ANALYSE (2 min)\n• Arguments POUR : respect de l'autonomie et de la dignite du mourant ; souffrances intolerable sans issue ; modeles etrangers fonctionnels (Belgique depuis 2002, Pays-Bas) ; la sedation profonde est deja une 'mort administree' de fait\n• Arguments CONTRE : risque de derives (pression sociale sur les personnes agees ou handicapees) ; la medecine palliative insuffisamment developpee en France (manque de lits, de soignants) — resoudre d'abord cela ; clause de conscience des soignants\n• Modele actuel : la loi Claeys-Leonetti permet la sedation profonde et continue jusqu'au deces pour les patients en fin de vie avec souffrances refrectaires — compromis mais incomplet\n\n⚖️ DISCUSSION (1.5 min)\n• Distinction euthanasie active (injection letale) vs passive (arret traitement) vs suicide assiste (medicament fourni par medecin) — les debats se melangent souvent\n• La convention citoyenne sur la fin de vie (2023) a majoritairement conclu en faveur d'une evolution legislative\n• Projet de loi en discussion en 2024 — contexte evolutif\n\n✅ CONCLUSION (0.5 min)\nJe presente les deux positions sans dogmatisme. Ma position : developper d'abord les soins palliatifs, encadrer strictement avant de legaliser. Ouverture : la fin de vie est un miroir de nos valeurs de societe.",
  "Un patient en fin de vie demande l'arret de son traitement. Comment abordez-vous cette situation ?": "📋 INTRODUCTION (1 min)\nSituation : patient en fin de vie qui demande l'arret de son traitement curatif. Acteurs : le patient, le medecin, l'equipe soignante, la famille. Problematique : comment repondre a cette demande dans le respect du droit, de l'ethique et de l'humanite ?\n\n🔍 ANALYSE (2 min)\n• Cadre legal : loi Claeys-Leonetti (2016) — le medecin peut arreter un traitement a la demande du patient conscient ; obligation de respecter les directives anticipees ; interdiction de l'obstination deraisonnable\n• Demarche collegiale : la decision doit etre prise en equipe pluridisciplinaire, consignee dans le dossier medical — pas une decision unilaterale\n• Soins palliatifs : l'arret du traitement curatif ne signifie pas l'abandon du soin — soins de confort, gestion de la douleur, accompagnement psychologique et spirituel\n\n⚖️ DISCUSSION (1.5 min)\n• S'assurer que la demande est libre, eclairee et reiteree — distinguer depression situationnelle d'une volonte authentique\n• La famille peut etre en desaccord — son avis est recueilli mais ce n'est pas elle qui decide si le patient est capable\n• Mon role de futur soignant : ne pas fuir cette conversation difficile — y etre presente, humain, disponible\n\n✅ CONCLUSION (0.5 min)\nJe respecte la demande dans le cadre legal, en procedure collegiale, avec un accompagnement bienveillant jusqu'au bout. Ouverture : la formation aux soins palliatifs devrait etre renforcee dans toutes les filieres medicales.",
  "La GPA (Gestation Pour Autrui) devrait-elle etre autorisee en France ? Discutez.": "📋 INTRODUCTION (1 min)\nLa GPA est interdite en France (art. 16-7 Code civil — nullite absolue) mais pratiquee a l'etranger par des couples francais. Contexte : debat relance par l'ouverture de la PMA aux femmes seules et couples de femmes (loi bioethique 2021). Problematique : faut-il legaliser la GPA en France et a quelles conditions ?\n\n🔍 ANALYSE (2 min)\n• Arguments POUR : repondre a une demande reelle (infertilite uterine, couples gays masculins) ; encadrer une pratique qui a lieu de fait a l'etranger, souvent dans des conditions precaires ; GPA altruiste ≠ commerciale\n• Arguments CONTRE : risque d'exploitation du corps des femmes (souvent issues de milieux defavorises) ; commodification de l'enfant ; corps de la femme ne peut pas faire l'objet d'un contrat (indisponibilite du corps humain, art. 16 Code civil)\n• GPA commerciale vs altruiste : distinction fondamentale — de nombreux juristes et associations feministes s'opposent meme a la GPA altruiste\n\n⚖️ DISCUSSION (1.5 min)\n• Comite National d'Ethique (CCNE) : avis tres reserve sur la GPA — risque de marchandisation du corps\n• Autres pays : Canada, Royaume-Uni (altruiste uniquement), Etats-Unis (commerciale possible) — les modeles sont tres divers\n• Interet de l'enfant : le droit a la filiation, la recherche des origines — questions non resolues\n\n✅ CONCLUSION (0.5 min)\nJe presente les deux positions et la complexite ethique. Ouverture : le debat GPA illustre la tension entre progres medical, droits des femmes et dignite de l'enfant.",
  "Un medecin peut-il refuser de pratiquer une IVG pour des raisons de conscience ? Debattez.": "📋 INTRODUCTION (1 min)\nLa clause de conscience specifique a l'IVG (art. L2212-8 CSP) permet au medecin de refuser de pratiquer une IVG. En 2024, l'IVG a ete constitutionnalisee (art. 34 Constitution). Problematique : comment concilier la liberte de conscience du medecin et le droit des femmes a l'IVG ?\n\n🔍 ANALYSE (2 min)\n• Clause de conscience : droit reconnu au medecin de ne pas pratiquer un acte contraire a ses convictions — obligation d'en informer la patiente immediatement et de l'orienter vers un confrere\n• Droit des femmes : l'IVG est un droit constitutionnel depuis 2024 — si trop de medecins utilisent la clause, le droit devient inaccessible (desert medical + deserteurs par conscience)\n• Probleme pratique : dans certaines zones, tous les praticiens locaux peuvent invoquer la clause — la patiente doit voyager loin pour acceder a ses droits\n\n⚖️ DISCUSSION (1.5 min)\n• Arguments pour maintenir la clause : respect de la conscience medicale, liberte de conviction — un medecin contraint peut mal pratiquer\n• Arguments pour la limiter : un droit sans acces effectif est un droit fictif ; la medecine est un service public\n• Proposition du CCNE : maintenir la clause mais obliger les etablissements publics a organiser l'acces effectif\n\n✅ CONCLUSION (0.5 min)\nLa clause de conscience est legitime si l'acces effectif a l'IVG est garanti partout. Ouverture : la constitutionnalisation de l'IVG renforce l'obligation d'en assurer l'acces reel.",
  "Faut-il rendre le don d'organes obligatoire ? Argumentez.": "📋 INTRODUCTION (1 min)\nDepuis la loi du 1er janvier 2017 (consentement presume renforcé), tout Francais est donneur par defaut sauf inscription sur le registre national des refus. Problematique : ce systeme est-il suffisant ou faut-il aller vers une obligation totale sans possibilite de refus ?\n\n🔍 ANALYSE (2 min)\n• Situation actuelle : consentement presume — 17 000 greffes/an en France mais 25 000 patients en attente ; 500 morts/an faute de greffe\n• Arguments POUR le don 'obligatoire' : comblet le deficit de greffons ; solidarite post-mortem ; le corps n'a plus d'utilite apres la mort\n• Arguments CONTRE : liberte de disposer de son corps (principe d'indisponibilite, art. 16 Code civil) ; convictions religieuses et culturelles ; forcer pourrait creer une defiance envers la medecine\n\n⚖️ DISCUSSION (1.5 min)\n• Le consentement presume actuel est deja un compromis — il a augmente le nombre de donneurs\n• La vraie solution peut etre ailleurs : ameliorer la coordination, reduire les refus familiaux (40% des familles s'opposent encore meme sans inscription au registre de refus)\n• Alternatives : campagnes de sensibilisation, aborder le sujet en famille\n\n✅ CONCLUSION (0.5 min)\nJe prefere approfondir le systeme actuel (information, respect des familles) avant d'aller vers l'obligation totale. Ouverture : la penurie de greffons est une urgence sanitaire qui appelle une politique educative forte.",
  "Un chercheur decouvre une erreur dans ses resultats deja publies. Que doit-il faire ?": "📋 INTRODUCTION (1 min)\nSituation : chercheur qui identifie une erreur dans un article scientifique deja publie. Acteurs : le chercheur, les co-auteurs, la revue, la communaute scientifique, potentiellement les patients si donnees medicales. Problematique : quelles sont les obligations ethiques et pratiques face a une erreur de publication ?\n\n🔍 ANALYSE (2 min)\n• Integrite scientifique : le chercheur a l'obligation de signaler l'erreur — cacher une erreur dans une publication est une fraude scientifique (fabrication, falsification, plagiat = FFP)\n• Procedure : contacter l'editeur de la revue pour publier un erratum (correction) ou une retractation si les conclusions sont invalides — c'est la norme internationale (COPE guidelines)\n• Impact potentiel : si les resultats ont influence d'autres chercheurs ou des decisions cliniques, l'urgence de la correction est encore plus grande\n\n⚖️ DISCUSSION (1.5 min)\n• Peur des consequences : reputation, financement, carriere — mais le silence est bien pire si decouvert plus tard\n• Co-auteurs : doivent etre informes et impliques dans la decision de correction\n• Autorite tutelle : le chercheur peut se faire accompagner par le referent integrite scientifique de son etablissement (obligatoire en France depuis 2017)\n\n✅ CONCLUSION (0.5 min)\nLe chercheur doit publier un erratum ou une retractation sans delai. Ouverture : la crise de reproductibilite en sciences interroge profondement les pratiques de publication.",
  "L'acces aux soins est-il un droit ou un privilege ? Discutez.": "📋 INTRODUCTION (1 min)\nQuestion fondatrice du systeme de sante. En France, la Securite Sociale (1945) et la CMU/AME garantissent theoriquement l'acces universel. Problematique : dans les faits, l'acces aux soins est-il egal pour tous ?\n\n🔍 ANALYSE (2 min)\n• Droit affirme : art. L1110-1 CSP — 'la protection de la sante est un droit fondamental' ; Preambule de la Constitution de 1946\n• Realites des inegalites : deserts medicaux (6 millions de Francais sans medecin traitant, CNOM 2024) ; reste a charge (optique, dentaire, audio) ; inegalites sociales et territoriales massives\n• Comparaison internationale : USA — la sante comme marche pur, sans acces universel garanti — modele qui produit les pires inegalites de sante des pays riches\n\n⚖️ DISCUSSION (1.5 min)\n• Le droit formel ne suffit pas si l'acces effectif est inegal — droit = obligation d'etat de moyens\n• Reformes en cours : Paiement a la performance (CPTS), teleconsultation, maisons de sante pluriprofessionnelles\n• Medecin demain : quel role personnel dans la reduction de ces inegalites ? Choix d'exercice, engagement associatif, soins sans depassement\n\n✅ CONCLUSION (0.5 min)\nL'acces aux soins est un droit constitutionnel mais un privilege dans les faits — la mission du systeme de sante est de combler cet ecart. Ouverture : reduire les inegalites de sante est un objectif de justice sociale, pas seulement medical.",
  "Peut-on imposer un traitement a un patient atteint de troubles psychiatriques qui refuse les soins ?": "📋 INTRODUCTION (1 min)\nTension entre droit fondamental au refus de soins et protection d'une personne potentiellement sans discernement. Cadre : loi du 5 juillet 2011 (reformee en 2013) sur les soins psychiatriques sans consentement. Problematique : a quelles conditions peut-on contraindre aux soins en psychiatrie ?\n\n🔍 ANALYSE (2 min)\n• Soins sous contrainte : deux regimes legaux — Hospitalisation sur Demande d'un Tiers (HDT) et Hospitalisation d'Office (HO, si danger pour autrui). Conditions strictes : trouble mental, danger pour soi ou autrui, impossibilite d'un consentement eclaire\n• Controle judiciaire : le JLD (juge des libertes et de la detention) doit valider la mesure dans les 12 jours — garantie constitutionnelle\n• Paradoxe therapeutique : forcer quelqu'un aux soins peut ameliorer son etat ET deteriorer la relation de confiance necessaire au suivi\n\n⚖️ DISCUSSION (1.5 min)\n• Autonomie vs bienfaisance : le patient psychotique n'a peut-etre pas le discernement pour choisir — mais ce jugement est complexe et subjectif\n• La contrainte doit etre proportionnee, temporaire et regulierement reavluee — pas une mesure definitive\n• Alternatives : aller vers le patient, soins ambulatoires, case management — la contrainte est le dernier recours\n\n✅ CONCLUSION (0.5 min)\nLa contrainte aux soins est justifiee dans des cas precis et strictement encadres, avec un controle judiciaire. Ouverture : le manque de lits et de psychiatres en France rend cette question encore plus aigue.",
  "Un medecin peut-il refuser de soigner un patient qui l'a agresse verbalement ?": "📋 INTRODUCTION (1 min)\nSituation : patient agressif verbalement envers le medecin, qui envisage de refuser les soins. Acteurs : le medecin (victime d'agression), le patient, l'institution. Problematique : ou s'arrete l'obligation de soin face a la violence subie par le soignant ?\n\n🔍 ANALYSE (2 min)\n• Obligation de soin : en urgence vitale, le medecin ne peut pas refuser (art. R4127-47 Code de deontologie). En dehors de l'urgence, il peut refuser mais doit assurer la continuite des soins\n• Droit a la dignite du soignant : les violences verbales et physiques sur les soignants sont un probleme majeur (13 000 incidents declares en 2022, ONVS) — le medecin n'est pas tenu d'accepter d'etre maltraite\n• Causes sous-jacentes a l'agressivite : douleur, angoisse, attente longue, incomprehension — souvent le soignant peut desamorcer avec une communication adaptee\n\n⚖️ DISCUSSION (1.5 min)\n• Refus de soins hors urgence : legal, a condition de le justifier, de ne pas discriminer et de faciliter la prise en charge ailleurs\n• Porter plainte : le medecin peut et devrait denoncer les agressions — normaliser la violence est contre-productif\n• Protocoles de gestion des patients aggressifs : les etablissements doivent former et proteger leurs soignants\n\n✅ CONCLUSION (0.5 min)\nLe medecin peut refuser les soins non urgents en cas d'agression, a condition d'assurer la continuite. Ouverture : la violence envers les soignants est une urgence de sante au travail qui appelle des reponses institutionnelles.",
  "Faut-il autoriser la recherche sur les cellules souches embryonnaires ? Debattez.": "📋 INTRODUCTION (1 min)\nQuestion bioethique fondamentale depuis les annees 1990. En France, la loi bioethique de 2004 (modifiee en 2011 et 2021) autorise la recherche sur les embryons et les cellules souches sous conditions strictes. Problematique : ces recherches sont-elles justifiables au regard du statut de l'embryon ?\n\n🔍 ANALYSE (2 min)\n• Arguments POUR : potentiel therapeutique immense (maladies degeneratives, Parkinson, SLA, diabete) ; les embryons utilises sont surnumeraires (non destines a un projet parental) et seraient detruits de toute facon ; les IPS cells (cellules souches pluripotentes induites) ne suffisent pas encore\n• Arguments CONTRE : statut moral de l'embryon humain (digne de protection des la fecondation selon certaines positions religieuses et philosophiques) ; risque de deriva vers la creation d'embryons a des fins de recherche\n• Cadre francais : autorisation exceptionnelle sous controle de l'ABM (Agence de la Biomedecine), interdiction de creer des embryons pour la recherche\n\n⚖️ DISCUSSION (1.5 min)\n• Statut de l'embryon : question philosophique non tranchee — la loi francaise lui reconnait une 'dignite particuliere' sans le considerer comme une personne\n• Alternatives : organoides, modeles animaux, IPS cells — mais limites reelles pour certaines pathologies\n• La recherche internationale avance — interdire en France ne stoppe pas la recherche, elle la delocalise\n\n✅ CONCLUSION (0.5 min)\nJe soutiens la recherche encadree sur les embryons surnumeraires — le potentiel therapeutique justifie l'encadrement strict plutot que l'interdiction. Ouverture : la bioethique est un equilibre permanent entre progres et protection de la dignite humaine.",
  "L'experimentation animale est-elle justifiable pour la recherche medicale ?": "📋 INTRODUCTION (1 min)\nL'experimentation animale est encadree par la directive europeenne 2010/63/UE et la regle des 3R (Remplacer, Reduire, Raffiner). En France : ~2 millions d'animaux utilises par an en recherche. Problematique : peut-on justifier moralement de faire souffrir des animaux pour avancer la medecine humaine ?\n\n🔍 ANALYSE (2 min)\n• Arguments POUR : modeles animaux indispensables pour la securite des medicaments (tests de toxicite) ; les alternatives (cultures cellulaires, organoïdes, simulation) ne peuvent pas reproduire la complexite d'un organisme entier ; obligation reglementaire avant tout essai humain\n• Arguments CONTRE : souffrance animale (sentience prouvee chez les mammiferes, art. 515-14 Code civil — 'etre vivant doue de sensibilite') ; mauvaise transposabilite (rat → humain echoue dans 90% des essais cliniques)\n• Regle des 3R : Remplacer (par des alternatives) quand possible, Reduire le nombre, Raffiner les protocoles pour minimiser la souffrance\n\n⚖️ DISCUSSION (1.5 min)\n• L'experimentation animale reste necessaire aujourd'hui — mais l'objectif doit etre de la rendre obsolete par les avancees alternatives\n• Hierarchie morale : plus l'animal est 'proche' (primates, mammiferes), plus les exigences ethiques sont elevees\n• Transparence : les chercheurs doivent justifier chaque protocol devant un comite d'ethique independant\n\n✅ CONCLUSION (0.5 min)\nL'experimentation animale est justifiee a condition de respecter les 3R et de viser sa substitution progressive. Ouverture : les organ-on-chip et l'IA pourraient reduire drastiquement ce besoin d'ici 10-20 ans.",
  "Un patient vous demande de lui prescrire un arret de travail de complaisance. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation : patient qui demande un arret de travail non justifie medicalement. Acteurs : le patient, le medecin, l'employeur, la Securite Sociale (finances publiques). Problematique : comment refuser sans rompre la relation therapeutique tout en preservant mon integrite et les fonds collectifs ?\n\n🔍 ANALYSE (2 min)\n• Arret de complaisance = faux en ecriture, fraude a la Securite Sociale — sanction penale et disciplinaire pour le medecin (art. R4127-28 Code de deontologie)\n• Ecouter la demande : pourquoi cette demande ? Epuisement professionnel, conflits au travail, maladie non exprimee ? La vraie demande est souvent derriere\n• Si raison valide : arret justifie medicalement (burn-out, episode depressif) — je peux et dois prescrire\n\n⚖️ DISCUSSION (1.5 min)\n• Refus sans ecoute = occasion manquee de depister un vrai probleme de sante\n• Refus avec ecoute = maintien de la confiance, proposition d'alternatives (consultation psy, mediateur travail)\n• Conflit de loyaute : le medecin est l'avocat du patient mais aussi un acteur du systeme collectif — l'arret de complaisance nuit aux deux\n\n✅ CONCLUSION (0.5 min)\nJe refuse l'arret non justifie mais j'explore la demande sous-jacente avec bienveillance. Ouverture : le mal-etre au travail est un probleme de sante publique — le medecin traitant est souvent le premier interlocuteur.",
  "Un couple demande un diagnostic preimplantatoire pour choisir le sexe de leur enfant. Votre position ?": "📋 INTRODUCTION (1 min)\nLe DPI (Diagnostic Pre-Implantatoire) est encadre en France par la loi bioethique — autorise uniquement pour detecter des maladies genetiques graves. Le sexe-selection non medical est interdit. Problematique : est-il justifie d'etendre le DPI au choix du sexe pour des raisons non medicales ?\n\n🔍 ANALYSE (2 min)\n• Cadre legal francais : le DPI est strictement limite aux maladies genetiques graves, rares et incurables (art. L2131-4 CSP) — le sexe-selection de confort est prohibe\n• Argument des demandeurs : liberte reproductive, 'equilibre familial' (gender balancing) — valorise dans certaines cultures\n• Arguments contre : derive eugeniste possible (selection selon des criteres non medicaux) ; discrimination basee sur le sexe ; l'embryon n'est pas un produit a concevoir sur mesure\n\n⚖️ DISCUSSION (1.5 min)\n• Pente glissante : si le sexe, pourquoi pas les caracteristiques physiques, le QI ? La ligne est difficile a tenir une fois franchie\n• Exceptions medicales : DPI-HLA (sauveur) pour permettre une greffe pour un frere malade — deja une extension controlee\n• Position du CCNE : oppose au sexe-selection non medical — meme position dans la plupart des pays europeens\n\n✅ CONCLUSION (0.5 min)\nJe maintiens le refus du DPI pour le sexe-selection non medical — la frontiere eugeniste est trop proche. Ouverture : la bioethique doit anticiper les demandes sociales avant qu'elles ne creent des faits accomplis.",
  "Un patient vous confie qu'il a agresse quelqu'un. Etes-vous tenu au secret medical ?": "📋 INTRODUCTION (1 min)\nSituation difficile : patient qui me confie avoir commis une agression. Acteurs : le patient, la victime, la justice. Problematique : le secret medical protege-t-il les informations sur des crimes commis, ou ai-je une obligation de denonciation ?\n\n🔍 ANALYSE (2 min)\n• Secret medical (art. L1110-4 CSP) : principe general de confidentialite de tout ce que le patient confie — le medecin n'est pas un auxiliaire de justice\n• Exceptions legales au secret : signalement des mauvais traitements sur mineurs ou personnes vulnerables (art. 226-14 Code penal), cas de sante publique (maladies contagieuses)\n• L'agression passee n'entre pas dans les exceptions — je ne suis pas tenu de la signaler\n\n⚖️ DISCUSSION (1.5 min)\n• Si la victime est identifiee et toujours en danger : la situation change — je peux signaler pour proteger la victime actuelle\n• Morale vs droit : je peux ressentir une obligation morale — mais legalement je ne peux pas temoigner contre mon patient\n• Role therapeutique : explorer pourquoi cette agression, travailler sur la violence — mon role est de soigner, pas de punir\n\n✅ CONCLUSION (0.5 min)\nLe secret medical s'applique — sauf si la victime est encore en danger. Ouverture : la tension entre secret medical et obligation civique interroge les fondements du contrat therapeutique.",
  "Les reseaux sociaux ont-ils un impact sur la sante mentale des jeunes ? Analysez.": "📋 INTRODUCTION (1 min)\nQuestion d'actualite majeure : l'essor des reseaux sociaux coincide avec une augmentation des troubles anxieux et depressifs chez les 12-25 ans. Problematique : quelle est la nature et l'ampleur de ce lien, et que faire ?\n\n🔍 ANALYSE (2 min)\n• Donnees epidemiologiques : augmentation de 70% des hospitalisations pour tentatives de suicide chez les 11-14 ans depuis 2011 (aux USA, etude Twenge) ; en France, INSERM 2023 — 1 jeune sur 5 en souffrance psychologique\n• Mecanismes : comparaison sociale permanente, cyberharcèlement, perturbation du sommeil par les ecrans, dopamine des likes, FOMO (peur de manquer)\n• Differences selon l'usage : usage passif (scroller) = facteur de risque ; usage actif (creer, communiquer) = moins deletere\n\n⚖️ DISCUSSION (1.5 min)\n• Causalite ou correlation ? Difficulte methodologique : les jeunes les plus vulnerables utilisent peut-etre davantage les reseaux — sens de la causalite a preciser\n• Benefices reels : liens sociaux, soutien entre pairs, acces a des communautes pour des jeunes isoles (LGBT+, malades, etc.)\n• Reponses possibles : age minimum verifie (16 ans — debat legislatif en France 2024), education aux medias, espaces de deconnexion\n\n✅ CONCLUSION (0.5 min)\nL'impact negatif sur la sante mentale est probable, complexe et contexte-dependant. Ouverture : une litteracie numerique generalisee des l'ecole primaire est plus efficace qu'une interdiction totale.",
