<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oral PASS Sorbonne 2026 - Preparation Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg-card: #14141e;
  --bg-card-hover: #1c1c2a;
  --bg-elevated: #1e1e2e;
  --border: #252538;
  --border-light: #35354a;
  --text: #e8e8f0;
  --text-secondary: #a0a0b8;
  --text-muted: #6a6a80;
  --accent: #7c6df0;
  --accent-light: #9d8ff7;
  --accent-dim: #4a3fb0;
  --accent-bg: rgba(124, 109, 240, 0.08);
  --success: #4ade80;
  --success-bg: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --warning-bg: rgba(251, 191, 36, 0.08);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.08);
  --info: #60a5fa;
  --info-bg: rgba(96, 165, 250, 0.08);
  --gradient-1: linear-gradient(135deg, #7c6df0, #60a5fa);
  --gradient-2: linear-gradient(135deg, #f87171, #fbbf24);
  --gradient-3: linear-gradient(135deg, #4ade80, #60a5fa);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

.app { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

/* Header */
.header {
  padding: 3rem 0 2rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}
.header__badge {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 1rem;
}
.header__title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  background: var(--gradient-1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.header__subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
}

/* Navigation */
.nav {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0 0 1.5rem;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav__btn {
  flex-shrink: 0;
  padding: 0.55rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.nav__btn:hover { background: var(--bg-card-hover); color: var(--text); }
.nav__btn--active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Stats bar */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0.7rem;
  margin-bottom: 2rem;
}
.stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1rem;
  text-align: center;
}
.stat__value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent-light);
}
.stat__label {
  font-size: 0.68rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 0.2rem;
}

/* Question cards */
.questions { display: flex; flex-direction: column; gap: 0.5rem; }
.question {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1rem 1.2rem;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.question:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
  transform: translateX(3px);
}
.question--done { opacity: 0.45; }
.question--done::after {
  content: '\2713';
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--success);
  font-weight: 700;
  font-size: 1.1rem;
}
.question__text {
  font-size: 0.88rem;
  line-height: 1.5;
  padding-right: 2rem;
}
.question__meta {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.5rem;
  flex-wrap: wrap;
}
.question__tag {
  font-size: 0.62rem;
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  background: var(--accent-bg);
  color: var(--accent-light);
  font-weight: 500;
}
.question__tag--difficulty { background: var(--warning-bg); color: var(--warning); }
.question__tag--type { background: var(--info-bg); color: var(--info); }

/* Method cards */
.method-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.method-card__title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.8rem;
  color: var(--accent-light);
}
.method-card__steps {
  list-style: none;
  counter-reset: step;
}
.method-card__steps li {
  counter-increment: step;
  padding: 0.5rem 0 0.5rem 2.5rem;
  position: relative;
  font-size: 0.84rem;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
}
.method-card__steps li:last-child { border-bottom: none; }
.method-card__steps li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 0.5rem;
  width: 22px; height: 22px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--accent-light);
}

/* Practice mode */
.practice {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 2.5rem;
  text-align: center;
}
.practice__timer {
  font-size: 3.5rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent-light);
  margin: 1rem 0;
}
.practice__question {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  line-height: 1.7;
  margin: 1.5rem 0;
  padding: 1.5rem;
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--accent);
}
.practice__type {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}
.btn {
  padding: 0.7rem 1.5rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin: 0.3rem;
}
.btn--primary { background: var(--accent); color: white; }
.btn--primary:hover { background: var(--accent-light); transform: translateY(-1px); }
.btn--secondary { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); }
.btn--secondary:hover { background: var(--bg-card-hover); color: var(--text); }
.btn--success { background: var(--success); color: #0a0a0f; }
.btn--danger { background: var(--danger); color: white; }

/* Info panel */
.info-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.info-panel__title {
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 0.8rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.info-panel__content {
  font-size: 0.84rem;
  color: var(--text-secondary);
  line-height: 1.7;
}
.info-panel__content ul { padding-left: 1.2rem; margin-top: 0.5rem; }
.info-panel__content li { margin-bottom: 0.3rem; }
.info-panel__content strong { color: var(--text); }

/* Actu cards */
.actu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 0.8rem;
}
.actu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1.2rem;
  transition: all 0.2s;
}
.actu-card:hover { border-color: var(--border-light); transform: translateY(-2px); }
.actu-card__theme {
  font-size: 0.62rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-light);
  margin-bottom: 0.5rem;
}
.actu-card__title { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.5rem; }
.actu-card__desc { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.5; }

/* Search & filters */
.search { margin-bottom: 1rem; }
.search__input {
  width: 100%;
  padding: 0.8rem 1.2rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s;
}
.search__input:focus { border-color: var(--accent); }
.search__input::placeholder { color: var(--text-muted); }
.filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.filter-pill {
  padding: 0.3rem 0.7rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 15px;
  font-size: 0.7rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.filter-pill:hover { border-color: var(--accent-dim); color: var(--text); }
.filter-pill--active { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent-light); }

/* Progress bar */
.progress { height: 4px; background: var(--bg-elevated); border-radius: 2px; overflow: hidden; }
.progress__bar { height: 100%; background: var(--gradient-1); border-radius: 2px; transition: width 0.3s; }

/* Example response */
.example {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1.2rem;
  margin-top: 0.8rem;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.6;
  border-left: 3px solid var(--success);
}
.example__label {
  font-weight: 600;
  color: var(--success);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
}

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.tab {
  padding: 0.7rem 1.2rem;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab:hover { color: var(--text-secondary); }
.tab--active { color: var(--accent-light); border-bottom-color: var(--accent); }

/* Jour-J section */
.timeline { position: relative; padding-left: 2rem; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}
.timeline__item { position: relative; padding-bottom: 1.5rem; }
.timeline__item::before {
  content: '';
  position: absolute;
  left: -2rem;
  top: 6px;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  margin-left: 4px;
}
.timeline__time { font-size: 0.72rem; color: var(--accent-light); font-weight: 600; margin-bottom: 0.3rem; }
.timeline__text { font-size: 0.84rem; color: var(--text-secondary); }

/* Reset progress button */
.reset-btn {
  background: none;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 0.4rem 0.8rem;
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 0.2s;
}
.reset-btn:hover { background: var(--danger-bg); }

@media (max-width: 600px) {
  .app { padding: 0 1rem; }
  .header { padding: 2rem 0 1.5rem; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .actu-grid { grid-template-columns: 1fr; }
  .practice { padding: 1.5rem; }
  .practice__question { font-size: 1rem; padding: 1rem; }
  .practice__timer { font-size: 2.5rem; }
}
</style>
</head>
<body>
<div class="app" id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const DATA = {
  format: {
    university: "Sorbonne Universite",
    epreuves: 2,
    poids_oral: "33% (1/3 de la note finale)",
    poids_ecrit: "67% (2/3 - bloc sante)",
    jury: "5 membres par jury dont au moins 1 exterieur a l'universite",

      objectifs: [
        "Observer et restituer les informations contenues dans le document",
        "Identifier les problematiques soulevees par le document",
        "Avoir un esprit critique",
        "Avoir un esprit d'ouverture",
        "Synthetiser"
      ],
      conseil_cle: "Decris AVANT d'interpreter. Ne saute jamais l'etape d'observation."
    }
  },
  competences: [
    { nom: "Communication", details: "Transmettre des idees clairement, organiser son discours, adapter son registre, maitriser le non-verbal", poids: "Elevee" },
    { nom: "Empathie", details: "Reconnaitre les emotions des autres, se mettre a la place des personnes evoquees, pas de jugement", poids: "Elevee" },
    { nom: "Ecoute", details: "Ecouter les questions du jury sans interrompre, montrer de l'interet, reformuler", poids: "Moyenne" },
    { nom: "Esprit critique", details: "Analyser objectivement, identifier les biais, ne pas prendre les choses au premier degre", poids: "Elevee" },
    { nom: "Reflexivite", details: "Se remettre en question, evaluer sa propre demarche, reconnaitre ses limites", poids: "Moyenne" },
    { nom: "Adaptabilite", details: "Reagir aux questions inattendues, gerer l'incertitude, ajuster son discours", poids: "Moyenne" },
    { nom: "Collaboration", details: "Evoquer le travail en equipe, les solutions collectives, l'interdisciplinarite", poids: "Faible" },
    { nom: "Synthese", details: "Extraire l'essentiel, hierarchiser, presenter de facon concise et structuree", poids: "Elevee" }
  ],
  questions: {
    rpc: [
      { q: "Votre voisin a un chien. Depuis quelque temps, vous remarquez qu'il le laisse enferme dans la voiture par forte chaleur. Que faites-vous ?", theme: "vie-quotidienne", difficulte: 2, tags: ["empathie", "action", "responsabilite"] },
      { q: "Vous etes en colocation avec 3 personnes. L'une d'elles manifeste des comportements suicidaires. Comment reagissez-vous ?", theme: "vie-quotidienne", difficulte: 3, tags: ["empathie", "urgence", "ecoute"] },
      { q: "Votre voisin menace de mettre fin a ses jours. Que faites-vous ?", theme: "vie-quotidienne", difficulte: 3, tags: ["empathie", "urgence", "action"] },
      { q: "Un de vos amis proches vous confie qu'il triche regulierement aux examens. Quelle est votre reaction ?", theme: "vie-quotidienne", difficulte: 2, tags: ["ethique", "amitie", "integrite"] },
      { q: "Vous etes temoin d'un accident de la route. Une personne est blessee. Decrivez vos actions.", theme: "vie-quotidienne", difficulte: 2, tags: ["action", "urgence", "sang-froid"] },
      { q: "Un camarade de promotion vous demande de signer la feuille de presence a sa place. Que faites-vous ?", theme: "vie-quotidienne", difficulte: 2, tags: ["ethique", "integrite", "pression"] },
      { q: "Votre colocataire traverse une periode de depression et refuse toute aide. Comment gerez-vous la situation ?", theme: "vie-quotidienne", difficulte: 3, tags: ["empathie", "communication", "limites"] },
      { q: "Vous trouvez un portefeuille contenant 500 euros et une carte d'identite dans la rue. Que faites-vous ?", theme: "vie-quotidienne", difficulte: 1, tags: ["ethique", "honnetete"] },
      { q: "Un ami vous avoue qu'il conduit regulierement en etat d'ivresse. Comment reagissez-vous ?", theme: "vie-quotidienne", difficulte: 2, tags: ["responsabilite", "amitie", "securite"] },
      { q: "Vous decouvrez que votre proprietaire ne respecte pas les normes de securite de l'immeuble. Que faites-vous ?", theme: "vie-quotidienne", difficulte: 2, tags: ["responsabilite", "action", "droit"] },
      { q: "Un SDF vous demande de l'aide devant une pharmacie en plein hiver. Que faites-vous ?", theme: "vie-quotidienne", difficulte: 2, tags: ["empathie", "solidarite", "action"] },
      { q: "Vous assistez a une scene de harcelement dans les transports en commun. Comment reagissez-vous ?", theme: "vie-quotidienne", difficulte: 3, tags: ["courage", "action", "solidarite"] },

      { q: "Faut-il rendre le don d'organes obligatoire ? Argumentez.", theme: "ethique", difficulte: 2, tags: ["bioethique", "solidarite", "liberte"] },

  actualites: [
    { theme: "Fin de vie / Aide active a mourir", titre: "Projet de loi sur l'aide active a mourir (2025-2026)", desc: "Debat majeur en France. Loi Claeys-Leonetti (2016) autorise la sedation profonde mais PAS l'euthanasie ni le suicide assiste. Un projet de loi sur l'aide active a mourir a ete depose. La Belgique, les Pays-Bas et la Suisse ont des legislations plus permissives. Arguments pour : dignite, autonomie, souffrance insupportable. Arguments contre : pente glissante, role du medecin, soins palliatifs insuffisants.", hot: true },
    { theme: "Intelligence Artificielle en sante", titre: "IA diagnostique et enjeux ethiques", desc: "L'IA atteint des performances superieures aux medecins dans certains diagnostics (radiologie, dermatologie). 6 enjeux ethiques identifies : equite/biais algorithmiques, explicabilite ('boite noire'), vie privee des donnees, responsabilite en cas d'erreur, autonomie du medecin, justice sociale. L'IA ne remplace pas le medecin mais l'assiste. Question : qui est responsable si l'IA se trompe ?", hot: true },
    { theme: "Deserts medicaux", titre: "Crise de l'acces aux soins en zones rurales", desc: "6 millions de Francais n'ont pas de medecin traitant. Loi Neuder (2025) : quotas d'admission fixes selon les besoins des territoires. Solutions debattues : obligation d'installation, telemedicine, maisons de sante, delegation de taches aux infirmiers. La moyenne d'age des medecins generalistes augmente.", hot: true },
    { theme: "Bioethique 2026", titre: "Etats generaux de la bioethique", desc: "Axes majeurs : examens genetiques predictifs (droit de savoir vs droit de ne pas savoir), neurosciences et neuroethique, cellules souches, procreation (PMA, GPA), fin de vie, IA en sante. Consultation publique en cours. Revision de la loi de bioethique tous les 7 ans en France." },
    { theme: "Sante mentale des jeunes", titre: "Explosion des troubles psychiques chez les 15-25 ans", desc: "Augmentation de 30% des troubles anxieux et depressifs chez les jeunes depuis le COVID. Tentatives de suicide en hausse. Manque criant de pedopsychiatres. Dispositif Mon Parcours Psy (8 seances remboursees) juge insuffisant. Role des reseaux sociaux dans la comparaison sociale et le cyberharcelement." },
    { theme: "Hopital public en crise", titre: "Departs massifs et fermetures de services", desc: "30% des postes non pourvus dans certains services. Fermetures de lits (100 000 lits en 20 ans). Burn-out massif des soignants. Debat sur la T2A (tarification a l'activite) vs financement au forfait. Attractivite salariale insuffisante. Les urgences saturees deviennent le symptome visible de la crise." },
    { theme: "Environnement et sante (One Health)", titre: "Le concept Une Seule Sante adopte par l'OMS", desc: "Sante humaine, animale et environnementale sont interdependantes. 75% des maladies infectieuses emergentes sont des zoonoses. Deforestation, elevage intensif et changement climatique favorisent les pandemies. Pollution de l'air : 48 000 morts prematurees/an en France. Les PFAS ('polluants eternels') contaminent l'eau potable.", hot: true },
    { theme: "Vaccination et confiance", titre: "Hesitation vaccinale et desinformation", desc: "La France est l'un des pays les plus defiant envers les vaccins. 11 vaccins obligatoires pour les nourrissons depuis 2018. Debat : obligation vs incitation. Desinformation virale sur les reseaux sociaux. Le mouvement anti-vax s'est renforce pendant le COVID. Enjeu : retablir la confiance sans etre paternaliste." },
    { theme: "Acces aux soins et inegalites", titre: "Gradient social de sante en France", desc: "Esperance de vie : 13 ans d'ecart entre les 5% les plus riches et les 5% les plus pauvres (hommes). 30% des personnes sous le seuil de pauvrete renoncent a des soins. Refus de soins envers les beneficiaires de la CMU documentes. Permanences d'acces aux soins (PASS) dans les hopitaux." },
    { theme: "Penuries de medicaments", titre: "Ruptures d'approvisionnement chroniques", desc: "3000+ signalements de ruptures en 2025. Causes : 80% des principes actifs fabriques en Chine/Inde, just-in-time, tensions geopolitiques. Medicaments critiques touches : antibiotiques, anticancereux, anesthesiques. Plans de relocalisation de la production en Europe. Stock de securite de 4 mois impose." },
    { theme: "Numerique et Mon Espace Sante", titre: "Transformation numerique du systeme de sante", desc: "Mon Espace Sante : DMP + messagerie securisee + catalogue d'apps certifiees. Telemedicine : 10% des consultations en 2024. Risques : fracture numerique (personnes agees, precarite), cybersecurite des donnees de sante, deshumanisation de la relation de soin. Opportunites : suivi des maladies chroniques, acces en zone rurale." },

const { createElement: h, useState, useEffect, useCallback, useMemo, Fragment } = React;

function App() {
  const [view, setView] = useState('accueil');
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [subView, setSubView] = useState(0);
  const [done, setDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem('oral-pass-done') || '{}'); } catch { return {}; }
  });
  const [notes, setNotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('oral-pass-notes') || '{}'); } catch { return {}; }
  });
  const [practiceMode, setPracticeMode] = useState(false);
  const [practiceQ, setPracticeQ] = useState(null);
  const [timer, setTimer] = useState(0);
  const [timerRunning, setTimerRunning] = useState(false);
  const [showExample, setShowExample] = useState(null);

  useEffect(() => { localStorage.setItem('oral-pass-done', JSON.stringify(done)); }, [done]);
  useEffect(() => { localStorage.setItem('oral-pass-notes', JSON.stringify(notes)); }, [notes]);

  useEffect(() => {
    let interval;
    if (timerRunning) interval = setInterval(() => setTimer(t => t + 1), 1000);
    return () => clearInterval(interval);
  }, [timerRunning]);

  const toggleDone = (key) => setDone(d => ({ ...d, [key]: !d[key] }));

  const allQuestions = useMemo(() => {
    const all = [];
    DATA.questions.rpc.forEach((q, i) => all.push({ ...q, id: 'rpc-' + i, type: 'RPC' }));
    DATA.questions.ared.forEach((q, i) => all.push({ ...q, id: 'ared-' + i, type: 'ARED' }));
    DATA.questions.motivation.forEach((q, i) => all.push({ ...q, id: 'motiv-' + i, type: 'Motivation' }));
    return all;
  }, []);

  const filteredQuestions = useMemo(() => {
    let qs = allQuestions;
    if (view === 'rpc') qs = qs.filter(q => q.type === 'RPC');
    else if (view === 'ared') qs = qs.filter(q => q.type === 'ARED');
    else if (view === 'motivation') qs = qs.filter(q => q.type === 'Motivation');
    if (filter === 'non-fait') qs = qs.filter(q => !done[q.id]);
    else if (filter === 'fait') qs = qs.filter(q => done[q.id]);
    else if (filter !== 'all') qs = qs.filter(q => q.theme === filter);
    if (search) {
      const s = search.toLowerCase();
      qs = qs.filter(q => q.q.toLowerCase().includes(s) || q.tags.some(t => t.includes(s)) || q.theme.includes(s));
    }
    return qs;
  }, [view, filter, search, allQuestions, done]);

  const themes = useMemo(() => {
    const set = new Set();
    let source = allQuestions;
    if (view === 'rpc') source = allQuestions.filter(q => q.type === 'RPC');
    else if (view === 'ared') source = allQuestions.filter(q => q.type === 'ARED');
    source.forEach(q => set.add(q.theme));
    return Array.from(set).sort();
  }, [view, allQuestions]);

  const totalDone = Object.values(done).filter(Boolean).length;
  const totalQ = allQuestions.length;

  const startPractice = (type) => {
    const pool = type ? allQuestions.filter(q => q.type === type) : allQuestions;
    const undone = pool.filter(q => !done[q.id]);
    const source = undone.length > 0 ? undone : pool;
    const q = source[Math.floor(Math.random() * source.length)];
    setPracticeQ(q);
    setPracticeMode(true);
    setTimer(0);
    setTimerRunning(true);
  };

  const nextPractice = () => {
    if (practiceQ) toggleDone(practiceQ.id);
    startPractice(practiceQ?.type === 'RPC' ? 'RPC' : practiceQ?.type === 'ARED' ? 'ARED' : null);
  };

  const formatTimer = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  };

  const resetProgress = () => {

      )
    )
  );

  const renderActualites = () => h('div', null,
    h('div', { className: 'info-panel', style: { marginBottom: '1.5rem', borderLeft: '3px solid var(--warning)' } },
      h('div', { className: 'info-panel__title' }, 'Actualites a maitriser pour l\'oral 2026'),
      h('div', { className: 'info-panel__content' },
        'Ces sujets sont les plus susceptibles de tomber car ils font debat dans l\'actualite recente. Tu n\'as pas besoin de tout savoir — mais connaitre les grandes lignes et les arguments principaux est essentiel pour enrichir tes analyses.'
      )
    ),
    h('div', { className: 'actu-grid' },
      DATA.actualites.map((a, i) =>
        h('div', { key: i, className: 'actu-card', style: a.hot ? { borderLeft: '3px solid var(--danger)' } : {} },
          h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
            h('div', { className: 'actu-card__theme' }, a.theme),
            a.hot && h('span', { style: { fontSize: '0.6rem', background: 'var(--danger-bg)', color: 'var(--danger)', padding: '0.1rem 0.4rem', borderRadius: '8px', fontWeight: 600 } }, 'TRES PROBABLE')
          ),
          h('div', { className: 'actu-card__title' }, a.titre),
          h('div', { className: 'actu-card__desc' }, a.desc)
        )
      )
    )
  );

  const renderJourJ = () => h('div', null,
    h('div', { className: 'info-panel', style: { marginBottom: '1.5rem', borderLeft: '3px solid var(--success)' } },
      h('div', { className: 'info-panel__title' }, 'Guide complet du Jour J'),
      h('div', { className: 'info-panel__content' }, 'De la preparation la veille jusqu\'a la sortie de la salle — tout ce qu\'il faut savoir pour etre au top le jour de l\'oral.')
    ),
    h('div', { className: 'method-card' },
      h('div', { className: 'method-card__title' }, 'Avant le jour J'),
      h('div', { className: 'timeline' },
        DATA.jourJ.avant.map((item, i) =>
          h('div', { key: i, className: 'timeline__item' },
            h('div', { className: 'timeline__time' }, item.time),
            h('div', { className: 'timeline__text' }, item.text)
          )
        )
      )
    ),
    h('div', { className: 'method-card' },
      h('div', { className: 'method-card__title' }, 'Le matin de l\'oral'),
      h('div', { className: 'timeline' },
        DATA.jourJ.matin.map((item, i) =>
          h('div', { key: i, className: 'timeline__item' },
            h('div', { className: 'timeline__time' }, item.time),
            h('div', { className: 'timeline__text' }, item.text)
          )
        )
      )
    ),
    h('div', { className: 'method-card' },
      h('div', { className: 'method-card__title' }, 'Pendant l\'epreuve — Minute par minute'),
      h('div', { className: 'timeline' },
        DATA.jourJ.pendant.map((item, i) =>
          h('div', { key: i, className: 'timeline__item' },
            h('div', { className: 'timeline__time' }, item.time),
            h('div', { className: 'timeline__text' }, item.text)
          )
        )
      )
    ),
    h('div', { className: 'method-card', style: { borderLeft: '3px solid var(--warning)' } },
      h('div', { className: 'method-card__title', style: { color: 'var(--warning)' } }, 'Pieges classiques du jury et comment reagir'),
      h('ol', { className: 'method-card__steps' },
        DATA.jourJ.pieges.map((p, i) => h('li', { key: i }, p))
      )
    ),
    h('div', { className: 'method-card' },
      h('div', { className: 'method-card__title' }, 'Technique de gestion du stress — Coherence cardiaque'),
      h('div', { style: { fontSize: '0.84rem', color: 'var(--text-secondary)', lineHeight: '1.7' } },
        h('p', null, 'A faire dans la salle d\'attente, les yeux fermes :'),
        h('ol', { style: { paddingLeft: '1.2rem', marginTop: '0.5rem' } },
          h('li', null, 'Inspire par le nez pendant 5 secondes (gonfle le ventre)'),
          h('li', null, 'Expire par la bouche pendant 5 secondes (degonfle le ventre)'),
          h('li', null, 'Repete pendant 3 a 5 minutes'),
          h('li', null, 'Effet : baisse du cortisol, ralentissement du coeur, clarte mentale')
        ),
        h('p', { style: { marginTop: '0.5rem', color: 'var(--accent-light)', fontWeight: 500 } }, 'Alternative rapide : inspire 4s, bloque 4s, expire 6s. 5 cycles suffisent.')
      )
    )
  );

  const renderPractice = () => {
    if (!practiceMode) {
      return h('div', { style: { textAlign: 'center' } },
        h('h2', { style: { marginBottom: '0.5rem', fontFamily: 'Playfair Display' } }, 'Mode Entrainement'),
        h('p', { style: { color: 'var(--text-secondary)', marginBottom: '0.5rem', fontSize: '0.88rem' } },
          'Conditions reelles : une question au hasard, 10 minutes chrono.'
        ),
        h('p', { style: { color: 'var(--text-muted)', marginBottom: '2rem', fontSize: '0.78rem' } },
          'Conseil : reponds a voix haute, debout si possible. Enregistre-toi avec ton telephone pour te reecouter.'
        ),
        h('div', { style: { display: 'flex', gap: '1rem', justifyContent: 'center', flexWrap: 'wrap' } },
          h('button', { className: 'btn btn--primary', onClick: () => startPractice('RPC') }, 'Question RPC'),
          h('button', { className: 'btn btn--primary', onClick: () => startPractice('ARED') }, 'Question ARED'),
          h('button', { className: 'btn btn--secondary', onClick: () => startPractice(null) }, 'Aleatoire')
        ),
        h('div', { style: { marginTop: '2rem', padding: '1rem', background: 'var(--bg-card)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border)' } },
          h('p', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '0.5rem', fontWeight: 600 } }, 'PROTOCOLE D\'ENTRAINEMENT RECOMMANDE'),
          h('p', { style: { fontSize: '0.76rem', color: 'var(--text-muted)' } }, '1. Lis la question et demarre le chrono'),
          h('p', { style: { fontSize: '0.76rem', color: 'var(--text-muted)' } }, '2. Prends 30s-1min pour structurer tes idees (note 3-4 mots-cles)'),
          h('p', { style: { fontSize: '0.76rem', color: 'var(--text-muted)' } }, '3. Reponds a voix haute pendant 8-9 minutes'),
          h('p', { style: { fontSize: '0.76rem', color: 'var(--text-muted)' } }, '4. Reecoute-toi et identifie 1 point a ameliorer'),
          h('p', { style: { fontSize: '0.76rem', color: 'var(--text-muted)' } }, '5. Marque comme "travaillee" et passe a la suivante')
        )
      );
    }
    const isOverTime = timer > 600;
    const isWarning = timer > 480 && timer <= 600;
    return h('div', { className: 'practice' },
      h('div', { className: 'practice__type' }, practiceQ.type + ' — ' + practiceQ.theme.replace(/-/g, ' ')),
      h('div', { className: 'practice__question' }, practiceQ.q),
      h('div', { className: 'practice__timer', style: { color: isOverTime ? 'var(--danger)' : isWarning ? 'var(--warning)' : 'var(--accent-light)' } },
        formatTimer(timer)
      ),
      h('p', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '1rem' } },
        isOverTime ? 'TEMPS DEPASSE — Le jury t\'aurait coupe.' :
        isWarning ? 'Attention — il te reste moins de 2 minutes. Pense a conclure.' :
        timer < 60 ? 'Prends 30s pour structurer tes idees avant de parler.' :
        'Objectif : terminer entre 8 et 10 minutes'
      ),
      h('div', { style: { display: 'flex', gap: '0.5rem', justifyContent: 'center', flexWrap: 'wrap' } },
        h('button', { className: 'btn btn--success', onClick: nextPractice }, '✓ Suivante'),
        h('button', { className: 'btn btn--secondary', onClick: () => setTimerRunning(!timerRunning) },
          timerRunning ? '⏸ Pause' : '▶ Reprendre'
        ),
        h('button', { className: 'btn btn--danger', onClick: () => { setPracticeMode(false); setTimerRunning(false); } }, '✖ Arreter')
      )
    );
  };

  const renderContent = () => {
    switch (view) {
      case 'accueil': return renderAccueil();
      case 'rpc': return renderQuestionList();
      case 'ared': return renderQuestionList();
      case 'motivation': return renderQuestionList();
      case 'methodo': return renderMethodo();
      case 'exemples': return renderExemples();
      case 'actualites': return renderActualites();
      case 'jourj': return renderJourJ();
      case 'pratique': return renderPractice();
      default: return null;
    }
  };

  return h('div', null,
    h('header', { className: 'header' },
      h('div', { className: 'header__badge' }, 'PASS Sorbonne Universite 2026'),
      h('div', { className: 'header__title' }, 'Preparation Oral Medecine'),
      h('div', { className: 'header__subtitle' }, totalQ + ' questions · Methodologie · Exemples corriges · Actualites · Guide jour J · Entrainement chrono')
    ),
    renderNav(),
    renderContent(),
    h('div', { style: { height: '4rem' } })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
