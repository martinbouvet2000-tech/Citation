  "La loi Claeys-Leonetti sur la fin de vie est-elle suffisante ?": "📋 INTRODUCTION (1 min)\nLa loi Claeys-Leonetti du 2 fevrier 2016 consacre le droit a la sedation profonde et continue jusqu'au deces, et renforce le caractere contraignant des directives anticipees. Pourtant, des debats persistent : des associations comme l'ADMD reclament un droit a l'euthanasie active. Problematique : la loi 2016 est-elle un cadre suffisant ou faut-il aller plus loin ?\n\n🔍 ANALYSE (2 min)\n• Ce que la loi prevoit : droit a la sedation profonde si souffrance refractaire en phase terminale, directives anticipees contraignantes sauf exception, interdit l'obstination deraisonnable, valorise les soins palliatifs\n• Ce qu'elle ne prevoit pas : l'euthanasie active (injection letale) ni le suicide assiste (comme en Belgique, Suisse) — le patient est sedats jusqu'au deces naturel\n• Lacune d'application : 20% des Francais ont acces a des soins palliatifs de qualite — la loi est bonne sur le papier mais sous-executee (IGAS 2023)\n\n⚖️ DISCUSSION (1.5 min)\n• Argument pour l'insuffisance : la sedation profonde ne repond pas aux patients qui souffrent sans etre en phase terminale (maladies neuro-degeneratives) ; le patient ne 'choisit' pas le moment\n• Argument pour la suffisance : l'euthanasie active franchit un seuil symbolique irreversible — role du medecin comme soignant, pas comme 'donneur de mort' ; risques de derives (Pays-Bas, Belgique)\n• Convention citoyenne sur la fin de vie (2023) : 76% des participants favorables a l'aide active a mourir sous conditions — signal politique fort\n\n✅ CONCLUSION (0.5 min)\nLa loi Claeys-Leonetti est une avancee reelle mais insuffisante pour certaines situations — la reflexion doit continuer avec les soignants, les patients et la societe. Ouverture : avant de legaliser l'euthanasie, investir dans les soins palliatifs pour que chacun puisse mourir dignement.",
  "Le consentement eclaire du patient : quelles sont ses limites ?": "📋 INTRODUCTION (1 min)\nLe consentement eclaire est un principe fondamental du droit medical depuis la loi Kouchner 2002 (art. L1111-4 CSP). Mais est-il vraiment 'eclaire' dans la pratique quotidienne ? Acteurs : le medecin, le patient, l'institution. Problematique : les conditions d'un consentement vraiment eclaire sont-elles reunies ou s'agit-il d'un ideal difficile a atteindre ?\n\n🔍 ANALYSE (2 min)\n• Ce que la loi impose : information loyale, claire, appropriee (comprehensible), recueillie sans pression ; le refus doit etre respecte meme si contraire a l'interet du patient\n• Obstacles en pratique : asymetrie de savoir entre medecin et patient, temps de consultation insuffisant (17 min en moyenne en MG), langage medical incomprehensible pour 40% des patients (INSERM — litteracie en sante), stress et angoisse qui bloquent la comprehension\n• Cas particuliers : urgence vitale (pas le temps du consentement), patient incapable (tuteur ou personne de confiance), mineurs (consentement parental + avis du mineur)\n\n⚖️ DISCUSSION (1.5 min)\n• Le formulaire de consentement signe est une protection juridique, pas une garantie d'eclairage reel — le patient peut signer sans avoir compris\n• L'option 'teach-back' : demander au patient de reformuler ce qu'il a compris — technique validee pour verifier la comprehension reelle\n• Respect de l'autonomie vs beneficience : si le patient refuse un traitement salvateur, son choix doit etre respecte — c'est ethiquement difficile mais legalement clair\n\n✅ CONCLUSION (0.5 min)\nLe consentement eclaire est un ideal ethique essentiel mais une realite imparfaite — l'ameliorer exige du temps, de la pedagogie et une formation a la communication. Ouverture : un consentement eclaire n'est pas un acte administratif mais un acte therapeutique.",
  "La vaccination obligatoire est-elle une atteinte aux libertes individuelles ?": "📋 INTRODUCTION (1 min)\nDepuis 2018, 11 vaccins sont obligatoires pour les nourrissons en France (extension depuis les 3 obligatoires). Le taux de couverture vaccinale a progresse. Mais la controverse persiste : des mouvements antivax invoquent la liberte individuelle. Problematique : l'obligation vaccinale est-elle justifiee au plan ethique et democratique ?\n\n🔍 ANALYSE (2 min)\n• Efficacite sante publique : la couverture vaccinale >95% est necessaire pour l'immunite collective (rougeole : seuil = 95%). Les epidemies de rougeole de 2008-2011 (15 000 cas) ont conduit a l'extension de 2018\n• Cadre legal : l'obligation vaccinale n'est pas une nouveaute (variole obligatoire depuis 1902) — elle s'inscrit dans une tradition de sante publique\n• Atteinte a l'autonomie : oui, objectivement — mais le droit individuel s'arrete ou commence le dommage a autrui (J.S. Mill) ; refuser la vaccination expose les immunodeprimés qui ne peuvent pas se vacciner\n\n⚖️ DISCUSSION (1.5 min)\n• La liberte individuelle n'est pas absolue en France (droit constitutionnel encadre par les objectifs d'interet general) — le Conseil Constitutionnel a valide l'extension en 2017\n• Confiance : la resistance vaccinale est aussi une crise de confiance dans les institutions — la contrainte sans explication renforce la defiance. Pedagogi and dialogue sont essentiels\n• Alternatives : incitation financiere, facilitation de l'acces, campagnes d'information — moins efficaces que l'obligation selon les donnees disponibles\n\n✅ CONCLUSION (0.5 min)\nL'obligation vaccinale est justifiee quand l'immunite collective protege des individus vulnerables — elle est une expression de solidarite, pas d'oppression. Ouverture : l'obligation doit s'accompagner d'une transparence totale sur la science et la gouvernance vaccinale.",
  "Le droit a l'oubli pour les anciens malades : pourquoi est-ce important ?": "📋 INTRODUCTION (1 min)\nLe droit a l'oubli permet aux anciens malades (cancer, VIH, etc.) de ne pas declarer leur maladie aux assurances et aux banques apres un certain delai. En France, la convention AERAS (s'Assurer et Emprunter avec un Risque Aggrave de Sante) a ete renforcee en 2022 — le droit a l'oubli s'applique desormais a 10 ans apres la fin du protocole therapeutique pour les cancers. Problematique : ce droit est-il une avancee ethique ou un risque pour le systeme assurantiel ?\n\n🔍 ANALYSE (2 min)\n• Enjeu de reinsertion : sans droit a l'oubli, les anciens malades sont penalises indefiniment (surprimes, refus de credit immobilier) meme apres une guerison complete — discrimination injuste\n• Progres medical : avec les avancees therapeutiques, la 'guerison' de nombreux cancers est une realite — le risque residuel est souvent comparable a la population generale\n• Cadre actuel (AERAS 2022) : cancers — droit a l'oubli a 5 ans pour les moins de 21 ans, 10 ans pour les autres ; VIH : nouvellement inclus sous conditions\n\n⚖️ DISCUSSION (1.5 min)\n• Tension avec la mutualisation des risques : les assurances fonctionnent sur l'evaluation du risque — le droit a l'oubli introduit une asymetrie d'information. Qui absorbe le surcout ?\n• Argument pour : le cancer est une epreuve de vie, pas une condamnation perpetuelle — la societe doit permettre la reconstruction\n• Limites actuelles : le droit a l'oubli ne s'applique pas a toutes les pathologies ni a tous les contrats — des zones grises persistent (assurance vie, assurance professionnelle)\n\n✅ CONCLUSION (0.5 min)\nLe droit a l'oubli est une avancee ethique majeure qui reconnaît la possibilite de guerison et de reinsertion complete. Ouverture : etendre et consolider ce droit est une question de justice sociale autant que de medecine."

  "Document : image d'une manifestation de soignants devant un hopital avec des pancartes revendiquant de meilleures conditions. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage de soignants manifestant devant un hopital, pancartes visibles revendiquant de meilleures conditions de travail. Scene collective, mobilisation du personnel hospitalier.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Crise des ressources humaines a l'hopital public — sous-effectifs, burn-out, demissions en cascade\n• Problematique 2 : Impact sur la qualite des soins — ratio soignant/patient degrade, risque d'erreurs medicales\n• Problematique 3 : Tension entre contraintes budgetaires (T2A) et mission de service public\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Image figee, ne montre pas la diversite des revendications ni les negociations en cours\n• Nuance : Tous les hopitaux ne sont pas en crise egale — disparites regionales importantes\n• Reference : Rapport Valletoux 2023 — 30% des postes vacants a l'hopital public\n\n✅ CONCLUSION (0.5 min)\nLa souffrance des soignants est un symptome d'un systeme hospitalier sous pression. Ouverture : reforme structurelle necessaire au-dela du seul levier budgetaire.",
  "Document : image d'un cabinet medical ferme dans un village rural avec un panneau 'A vendre'. Que vous inspire ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'un cabinet medical ferme en zone rurale avec panneau \"A vendre\". Symbolise la desertification medicale dans les campagnes francaises.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Deserts medicaux — 6 millions de Francais vivent dans une zone sous-dotee en medecins\n• Problematique 2 : Rupture d'egalite d'acces aux soins entre territoires urbains et ruraux\n• Problematique 3 : Vieillissement des medecins liberaux et manque de repreneurs en zone rurale\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'image ne montre pas les solutions existantes (MSP, teleconsultation, CPTS)\n• Nuance : Le probleme n'est pas seulement le nombre de medecins mais leur repartition geographique\n• Reference : En 2025, la densite medicale varie de 1 a 4 selon les departements (DREES)\n\n✅ CONCLUSION (0.5 min)\nLa fermeture de ce cabinet illustre un enjeu majeur d'amenagement sanitaire du territoire. Ouverture : les maisons de sante pluriprofessionnelles comme modele d'avenir.",
  "Document : image d'une personne agee seule dans une chambre d'EHPAD, regardant par la fenetre. Analysez les enjeux.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'une personne agee seule en EHPAD regardant par la fenetre. Scene d'isolement, solitude palpable, cadre institutionnel visible.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Isolement social des personnes agees — 2 millions de seniors en situation d'isolement en France\n• Problematique 2 : Qualite de vie en EHPAD — maltraitance institutionnelle denoncee par le scandale Orpea (2022)\n• Problematique 3 : Dignite et autonomie — consentement au placement, respect des volontes de la personne\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Image emotive, ne reflete pas tous les EHPAD — certains offrent un accompagnement de qualite\n• Nuance : L'EHPAD reste parfois la seule solution quand le maintien a domicile est impossible\n• Reference : Loi ASV 2015 sur l'adaptation de la societe au vieillissement\n\n✅ CONCLUSION (0.5 min)\nCette image interroge notre modele de prise en charge du grand age. Ouverture : repenser le vieillissement avec des alternatives comme l'habitat inclusif.",
  "Document : image d'un enfant travaillant dans une usine textile dans un pays en developpement. Que vous evoque ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'un enfant au travail dans une usine textile d'un pays en developpement. Conditions insalubres, exploitation visible, lien avec l'industrie mondiale de la mode.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Travail des enfants — 160 millions d'enfants concernes dans le monde (OIT 2021)\n• Problematique 2 : Consequences sanitaires — troubles musculo-squelettiques, exposition aux produits chimiques, retard de croissance\n• Problematique 3 : Responsabilite des pays consommateurs et des multinationales — devoir de vigilance\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Image choc qui peut instrumentaliser la souffrance sans montrer les causes structurelles (pauvrete, absence de scolarisation)\n• Nuance : Interdire brutalement le travail des enfants sans alternative peut aggraver la precarite familiale\n• Reference : Convention des droits de l'enfant (1989), loi francaise sur le devoir de vigilance (2017)\n\n✅ CONCLUSION (0.5 min)\nLa sante des enfants est indissociable de la justice sociale mondiale. Ouverture : lien entre sante globale et commerce equitable.",
  "Document : tableau de donnees montrant les temps d'attente aux urgences (6h en moyenne) dans un hopital public. Identifiez les problematiques.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nTableau de donnees chiffrees : temps d'attente moyen de 6h aux urgences d'un hopital public. Donnees quantitatives, probablement issues d'un rapport interne ou d'une enquete.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Engorgement des urgences — 22 millions de passages/an, dont 40% releveraient de la medecine de ville\n• Problematique 2 : Perte de chance pour les urgences reelles — tri retarde, aggravation des pathologies graves\n• Problematique 3 : Epuisement des equipes soignantes face a un flux incontrolable\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Une moyenne de 6h masque les disparites — certains patients attendent 12h, d'autres 1h selon la gravite\n• Nuance : Le probleme n'est pas que les urgences mais l'amont (medecine de ville, permanence des soins)\n• Reference : Rapport Braun 2022 sur les urgences et soins non programmes\n\n✅ CONCLUSION (0.5 min)\nLes 6h d'attente revelent une defaillance systemique au-dela des seules urgences. Ouverture : regulation de l'acces via le SAS (Service d'Acces aux Soins).",
  "Document : graphique montrant l'evolution de la pollution atmospherique dans les grandes villes francaises. Analysez les consequences sanitaires.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nGraphique d'evolution temporelle de la pollution atmospherique dans les grandes villes francaises. Probablement courbes de particules fines, NO2, ozone sur plusieurs annees.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Impact sanitaire direct — 48 000 deces prematures/an en France lies a la pollution de l'air (Sante Publique France)\n• Problematique 2 : Pathologies respiratoires et cardiovasculaires — asthme, BPCO, cancers bronchiques en augmentation\n• Problematique 3 : Inegalites sociales face a la pollution — populations defavorisees plus exposees (proximite axes routiers)\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un graphique de tendance ne montre pas les pics ponctuels ni les variations saisonnieres\n• Nuance : La pollution diminue globalement mais les seuils OMS restent depasses dans la plupart des villes\n• Reference : Plan national sante-environnement (PNSE4), normes OMS 2021 revues a la baisse\n\n✅ CONCLUSION (0.5 min)\nLa pollution est un enjeu de sante publique majeur qui depasse le champ medical. Ouverture : concept de sante environnementale et One Health.",
  "Document : image d'un medecin MSF soignant un enfant dans un camp de refugies. Que vous inspire ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'un medecin Medecins Sans Frontieres soignant un enfant dans un camp de refugies. Contexte humanitaire, precarite visible, soin en situation d'urgence.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Acces aux soins dans les crises humanitaires — 100 millions de deplaces dans le monde (HCR 2023)\n• Problematique 2 : Ethique de l'engagement medical — neutralite, impartialite, temoignage (principes fondateurs MSF)\n• Problematique 3 : Sante des enfants refugies — malnutrition, maladies infectieuses, traumatismes psychologiques\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'image heroïse le medecin occidental — risque de vision neocoloniale de l'aide humanitaire\n• Nuance : L'aide d'urgence ne remplace pas le developpement de systemes de sante locaux durables\n• Reference : Charte MSF, Droit international humanitaire (Conventions de Geneve)\n\n✅ CONCLUSION (0.5 min)\nCette image incarne l'universalite du droit a la sante. Ouverture : former des soignants locaux pour une autonomie sanitaire durable.",
  "Document : infographie sur les taux de couverture vaccinale dans differentes regions du monde. Analysez les enjeux.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nInfographie comparant les taux de couverture vaccinale par region mondiale. Representation visuelle avec probablement une carte ou des barres, ecarts significatifs entre regions.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Inegalites d'acces aux vaccins — certains pays d'Afrique sous 50% de couverture pour les vaccins de base\n• Problematique 2 : Hesitation vaccinale dans les pays developpes — paradoxe de la defiance dans les pays les mieux dotes\n• Problematique 3 : Risque epidemique mondial — une faible couverture locale menace la sante globale\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Les taux moyens masquent des disparites intra-pays (urban/rural, riches/pauvres)\n• Nuance : La couverture vaccinale depend autant de la logistique (chaine du froid) que de la volonte politique\n• Reference : Initiative COVAX, objectif OMS de 90% de couverture pour les vaccins essentiels\n\n✅ CONCLUSION (0.5 min)\nLa vaccination est un bien public mondial qui necessite solidarite et cooperation. Ouverture : brevets et acces universel aux vaccins.",
  "Document : image d'un SDF dormant sur un carton devant les urgences d'un hopital. Quelles problematiques ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'une personne sans domicile fixe dormant sur un carton devant l'entree des urgences hospitalieres. Contraste saisissant entre precarite extreme et institution de soin.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Precarite et sante — les SDF ont une esperance de vie de 49 ans contre 83 pour la population generale\n• Problematique 2 : Les urgences comme dernier filet social — lieu de soin devenu refuge pour les exclus du systeme\n• Problematique 3 : Acces aux droits — renoncement aux soins, absence de couverture sociale, barrieres administratives\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Image qui choque mais ne montre pas les dispositifs existants (PASS, SAMU social, LAHSo)\n• Nuance : L'hopital ne peut pas compenser seul les defaillances des politiques sociales et du logement\n• Reference : PASS (Permanence d'Acces aux Soins de Sante), AME, loi DALO\n\n✅ CONCLUSION (0.5 min)\nLa sante des plus precaires est un revelateur des inegalites sociales. Ouverture : approche globale associant soin, hebergement et reinsertion.",
  "Document : graphique comparant le temps d'ecran moyen des 15-25 ans en 2019 vs 2025. Que vous evoque ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nGraphique comparatif du temps d'ecran moyen des 15-25 ans entre 2019 et 2025. Probablement une augmentation significative, accentuee par la pandemie et les usages numeriques.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Sante mentale des jeunes — correlation entre temps d'ecran et anxiete, depression, troubles du sommeil\n• Problematique 2 : Sedentarite et consequences physiques — obesite, troubles musculo-squelettiques, myopie en hausse\n• Problematique 3 : Addiction aux ecrans et reseaux sociaux — mecanismes de dopamine, design addictif des plateformes\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Correlation n'est pas causalite — le temps d'ecran inclut aussi education, travail, lien social\n• Nuance : Tous les usages ne se valent pas — un cours en ligne n'a pas le meme effet que le scrolling passif\n• Reference : Rapport Haut Conseil de la Sante Publique 2020, recommandations OMS sur le temps d'ecran\n\n✅ CONCLUSION (0.5 min)\nL'explosion du temps d'ecran est un enjeu de sante publique emergent. Ouverture : education au numerique et hygiene digitale des le plus jeune age.",
  "Document : image d'un robot chirurgical Da Vinci en salle d'operation accompagnee de statistiques d'utilisation. Analysez les implications.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'un robot chirurgical Da Vinci en bloc operatoire, accompagnee de statistiques d'utilisation. Technologie de pointe, interface homme-machine en contexte medical.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Progres technique — precision accrue, chirurgie mini-invasive, reduction des complications post-operatoires\n• Problematique 2 : Cout et accessibilite — un robot Da Vinci coute 2 millions d'euros, creusant les inegalites entre etablissements\n• Problematique 3 : Evolution du role du chirurgien — formation, responsabilite medicale en cas d'erreur de la machine\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Les statistiques d'utilisation ne montrent pas forcement la superiorite clinique sur la chirurgie classique\n• Nuance : La robotique ne remplace pas le chirurgien mais augmente ses capacites — c'est un outil, pas un substitut\n• Reference : HAS — evaluations medico-economiques de la chirurgie robotique\n\n✅ CONCLUSION (0.5 min)\nLa chirurgie robotique illustre la tension entre innovation et egalite d'acces. Ouverture : jusqu'ou la technologie peut-elle transformer la pratique medicale ?",
  "Document : tableau comparant les taux de mortalite maternelle entre l'Afrique subsaharienne et la France. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nTableau comparatif des taux de mortalite maternelle : Afrique subsaharienne versus France. Ecart probablement considerable — de 1 pour 100 000 en France a plus de 500 en Afrique subsaharienne.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Inegalites Nord-Sud flagrantes — une femme en Afrique subsaharienne a 50 fois plus de risque de mourir en couches\n• Problematique 2 : Determinants structurels — acces aux soins obstetricaux, personnels qualifies, equipements medicaux\n• Problematique 3 : Facteurs socio-culturels — education des filles, mariages precoces, statut de la femme\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Les moyennes nationales masquent des disparites internes — zones rurales plus touchees partout\n• Nuance : La France n'est pas exemplaire — des inegalites persistent (outre-mer, populations precaires)\n• Reference : ODD 3.1 — reduire la mortalite maternelle a moins de 70/100 000 d'ici 2030\n\n✅ CONCLUSION (0.5 min)\nLa mortalite maternelle est un indicateur de justice sanitaire mondiale. Ouverture : investir dans la formation de sages-femmes locales comme levier majeur.",
  "Document : texte d'un communique d'agriculteurs manifestant contre l'interdiction de pesticides. Discutez les enjeux.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nCommunique d'agriculteurs contestant l'interdiction de pesticides. Texte revendicatif, arguments economiques et professionnels, opposition a une mesure environnementale.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Sante publique vs economie agricole — les pesticides sont lies a cancers, Parkinson, perturbateurs endocriniens\n• Problematique 2 : Sante des agriculteurs eux-memes — population surexposee, maladie de Parkinson reconnue maladie professionnelle (2012)\n• Problematique 3 : Transition agroecologique — comment accompagner sans brutaliser le monde agricole\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un communique militant presente un seul point de vue — il manque les donnees scientifiques sur les risques sanitaires\n• Nuance : Les agriculteurs sont souvent les premieres victimes des pesticides, pas seulement des utilisateurs\n• Reference : Rapport INSERM 2021 sur pesticides et sante, plan Ecophyto\n\n✅ CONCLUSION (0.5 min)\nLe debat pesticides cristallise la tension entre sante et economie. Ouverture : accompagner la transition plutot que l'imposer brutalement.",
  "Document : tableau nutritionnel comparant un plat prepare ultra-transforme et un plat cuisine maison. Analysez les enjeux de sante publique.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nTableau nutritionnel comparatif : plat ultra-transforme vs plat maison. Probablement ecarts en sel, sucre, additifs, graisses saturees, et densite nutritionnelle.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Alimentation ultra-transformee et maladies chroniques — obesite, diabete, cancers (etude NutriNet-Sante)\n• Problematique 2 : Inegalites sociales alimentaires — les populations precaires consomment davantage d'ultra-transforme (cout, temps, education)\n• Problematique 3 : Role de l'industrie agroalimentaire — marketing agressif, lobbying contre la reglementation\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un seul comparatif ne fait pas une preuve — il faut regarder l'alimentation globale sur la duree\n• Nuance : Tous les plats prepares ne se valent pas — la classification NOVA distingue 4 niveaux de transformation\n• Reference : Nutri-Score, classification NOVA, etude NutriNet-Sante (Inserm/Sorbonne)\n\n✅ CONCLUSION (0.5 min)\nL'alimentation ultra-transformee est un enjeu majeur de prevention. Ouverture : education nutritionnelle des le plus jeune age et regulation de l'industrie.",
  "Document : image de militants ecologistes bloquant une autoroute, accompagnee d'un article de presse. Analysez la situation.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage de militants ecologistes bloquant une autoroute, accompagnee d'un article de presse. Action de desobeissance civile, reactions mediatiques probablement polarisees.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Urgence climatique et sante — rechauffement = canicules, maladies vectorielles, allergies, sante mentale (eco-anxiete)\n• Problematique 2 : Legitimite de la desobeissance civile — quand les voies institutionnelles semblent insuffisantes\n• Problematique 3 : Pollution automobile et sante publique — particules fines, bruit, sedentarite liee a la voiture\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'article de presse peut orienter la perception — cadrage mediatique a analyser\n• Nuance : Le blocage peut aussi nuire (ambulances bloquees) — la forme de l'action est debattue y compris chez les ecologistes\n• Reference : Rapport Lancet Countdown sur sante et changement climatique\n\n✅ CONCLUSION (0.5 min)\nLe lien entre environnement et sante justifie l'engagement mais interroge sur les moyens d'action. Ouverture : le medecin comme acteur de la sante environnementale.",
  "Document : graphique montrant l'evolution du port du masque en population generale depuis 2020. Que vous evoque ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nGraphique d'evolution du port du masque en population generale depuis 2020. Probablement pic en 2020-2021 puis decroissance progressive, avec des variations selon les vagues epidemiques.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Acceptabilite des mesures sanitaires — fatigue pandemique et erosion de la compliance au fil du temps\n• Problematique 2 : Confiance dans les autorites sanitaires — messages contradictoires (masque inutile puis obligatoire en 2020)\n• Problematique 3 : Preparedness — lecons pour les futures pandemies, stocks strategiques, communication de crise\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Le port du masque autodeclare surestime probablement la realite — biais de desirabilite sociale\n• Nuance : Le masque est devenu un objet politique au-dela de son utilite medicale\n• Reference : Rapport de la mission d'evaluation de la gestion du Covid-19 (Pittet, 2020)\n\n✅ CONCLUSION (0.5 min)\nL'evolution du port du masque illustre la complexite de la sante publique face aux comportements individuels. Ouverture : comment maintenir l'adhesion populaire en sante publique ?",
  "Document : image aerienne montrant un bidonville a cote d'un hopital moderne. Analysez le contraste.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage aerienne juxtaposant un bidonville et un hopital moderne. Contraste visuel saisissant entre extreme pauvrete et infrastructure medicale de haut niveau.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Paradoxe de l'acces aux soins — la proximite geographique ne garantit pas l'acces reel (barrieres financieres, administratives)\n• Problematique 2 : Determinants sociaux de la sante — le logement insalubre genere des pathologies (respiratoires, infectieuses, mentales)\n• Problematique 3 : Priorites d'investissement — construire des hopitaux sans ameliorer les conditions de vie est insuffisant\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : La vue aerienne dramatise le contraste mais ne dit rien sur les liens reels entre les deux espaces\n• Nuance : L'hopital peut aussi desservir cette population — certains pays ont des programmes d'acces gratuit\n• Reference : OMS — les determinants sociaux representent 50% de l'etat de sante (modele Dahlgren-Whitehead)\n\n✅ CONCLUSION (0.5 min)\nSoigner sans agir sur les conditions de vie est comme vider l'ocean avec une cuillere. Ouverture : approche globale de la sante integrant logement, eau et education.",
  "Document : liste de medicaments en rupture de stock affichee en pharmacie. Discutez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nListe de medicaments en rupture de stock affichee dans une pharmacie. Document informatif de terrain, illustrant une realite quotidienne pour patients et pharmaciens.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Souverainete sanitaire — 80% des principes actifs produits hors d'Europe (Inde, Chine), dependance dangereuse\n• Problematique 2 : Perte de chance pour les patients — ruptures d'amoxicilline, paracetamol, corticoides, traitements chroniques\n• Problematique 3 : Logique economique vs sante publique — les laboratoires privilegient les marches les plus rentables\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Une liste ponctuelle ne montre pas l'ampleur nationale — 5000 signalements de rupture en 2023 (ANSM)\n• Nuance : Les ruptures ont des causes multiples (tensions mondiales, just-in-time, prix bas en France)\n• Reference : Loi anti-penuries 2024, proposition de relocalisation de la production pharmaceutique\n\n✅ CONCLUSION (0.5 min)\nLes ruptures de medicaments mettent en lumiere la fragilite de notre chaine d'approvisionnement. Ouverture : reindustrialisation pharmaceutique europeenne.",
  "Document : rapport sanitaire sur les conditions de vie dans un camp de migrants aux portes de l'Europe. Problematiques sanitaires ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nRapport sanitaire sur un camp de migrants aux frontieres de l'Europe. Document officiel decrivant les conditions de vie et les enjeux de sante d'une population vulnerable.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Conditions sanitaires degradees — surpopulation, manque d'eau potable, absence d'assainissement, maladies infectieuses\n• Problematique 2 : Sante mentale des migrants — traumatismes du parcours migratoire, stress post-traumatique, incertitude administrative\n• Problematique 3 : Acces aux soins — barrieres linguistiques, statut administratif, meconnaissance des droits\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un rapport institutionnel peut etre oriente selon l'organisme emetteur — verifier la source\n• Nuance : Les migrants ne sont pas un groupe homogene — profils de sante tres differents selon l'origine et le parcours\n• Reference : Droit a la sante (art. 25 DUDH), AME en France, directive europeenne accueil\n\n✅ CONCLUSION (0.5 min)\nLa sante des migrants est un enjeu ethique autant que sanitaire. Ouverture : la sante comme droit fondamental independant du statut administratif.",
  "Document : graphique correlant le taux d'obesite infantile et le temps d'ecran quotidien. Analysez les enjeux.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nGraphique de correlation entre obesite infantile et temps d'ecran quotidien. Probablement une tendance positive montrant que les deux augmentent conjointement.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Sedentarite des enfants — le temps d'ecran remplace l'activite physique, 1 enfant sur 5 en surpoids en France\n• Problematique 2 : Marketing alimentaire cible sur les enfants — publicites pour produits sucres et gras sur les ecrans\n• Problematique 3 : Habitudes de vie familiales — grignotage devant les ecrans, repas destructures\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Correlation n'implique pas causalite directe — facteurs confondants (CSP, education, environnement alimentaire)\n• Nuance : Le temps d'ecran est un marqueur de sedentarite mais pas la seule cause de l'obesite (genetique, alimentation)\n• Reference : Recommandations OMS — moins d'1h d'ecran/jour avant 5 ans, Programme National Nutrition Sante (PNNS)\n\n✅ CONCLUSION (0.5 min)\nL'obesite infantile necessite une approche multifactorielle depassant le seul temps d'ecran. Ouverture : politiques de prevention integrant ecole, famille et industrie.",
  "Document : image d'un hopital psychiatrique desaffecte accompagnee d'un texte sur l'evolution de la psychiatrie en France. Que vous inspire ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'un hopital psychiatrique desaffecte avec un texte sur l'evolution de la psychiatrie en France. Contraste entre l'ancien modele asilaire et la psychiatrie moderne.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Desinstitutionalisation — fermeture de 60% des lits psychiatriques en 30 ans sans alternatives suffisantes\n• Problematique 2 : Crise de la psychiatrie actuelle — manque de psychiatres, delais d'attente de 6 mois, urgences saturees\n• Problematique 3 : Stigmatisation persistante de la maladie mentale — frein a la consultation et au soin\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'image d'un lieu desaffecte nourrit une vision negative — la psychiatrie a aussi fait d'immenses progres\n• Nuance : La sectorisation psychiatrique a permis de rapprocher le soin du patient mais manque de moyens\n• Reference : Assises de la sante mentale 2021, circulaire sectorisation 1960\n\n✅ CONCLUSION (0.5 min)\nLa psychiatrie francaise est a un tournant entre heritage asilaire et ambition communautaire. Ouverture : investir dans la sante mentale comme priorite de sante publique.",
  "Document : deux tribunes opposees (pour et contre l'IVG) publiees dans un journal. Presentez les differents points de vue.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nDeux tribunes dans un journal : l'une pour et l'autre contre l'IVG. Format dialectique, opinions argumentees opposees, debat de societe majeur.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Droit des femmes a disposer de leur corps vs considerants ethiques et religieux\n• Problematique 2 : Acces effectif a l'IVG — fermeture de centres, disparites territoriales, clause de conscience\n• Problematique 3 : Constitutionnalisation de l'IVG (2024) — la France premier pays au monde, portee symbolique et juridique\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Deux tribunes ne representent pas tout le spectre des opinions — de nombreuses positions intermediaires existent\n• Nuance : Etre pour le droit a l'IVG n'empeche pas de reconnaitre la dimension ethique de la question\n• Reference : Loi Veil (1975), constitutionnalisation mars 2024, delai legal de 14 semaines\n\n✅ CONCLUSION (0.5 min)\nLe debat sur l'IVG illustre la tension entre droits individuels et valeurs collectives. Ouverture : garantir l'acces effectif au-dela du droit formel.",
  "Document : image d'une personne en fauteuil roulant face a un escalier sans rampe d'acces. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'une personne en fauteuil roulant face a un escalier sans rampe d'acces. Obstacle physique concret illustrant le manque d'accessibilite dans l'espace public.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Accessibilite et inclusion — 12 millions de personnes en situation de handicap en France, 80% des ERP non accessibles\n• Problematique 2 : Acces aux soins des personnes handicapees — cabinets medicaux inaccessibles, tables d'examen non adaptees\n• Problematique 3 : Regard de la societe sur le handicap — du modele medical au modele social du handicap\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'image montre un handicap moteur visible mais le handicap est souvent invisible (mental, sensoriel, psychique)\n• Nuance : La loi de 2005 prevoyait l'accessibilite totale — 20 ans apres, l'objectif n'est pas atteint\n• Reference : Loi handicap 2005, Convention ONU relative aux droits des personnes handicapees (2006)\n\n✅ CONCLUSION (0.5 min)\nL'accessibilite est un droit fondamental, pas un amenagement optionnel. Ouverture : former les futurs medecins a la prise en charge du handicap.",
  "Document : carte montrant la deforestation en Amazonie et les foyers de maladies emergentes. Quels liens avec la sante humaine ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nCarte superposant zones de deforestation en Amazonie et foyers de maladies emergentes. Correlation spatiale suggerant un lien entre destruction environnementale et emergence pathogene.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Zoonoses et deforestation — la destruction des habitats rapproche les animaux sauvages des populations humaines (75% des maladies emergentes sont zoonotiques)\n• Problematique 2 : Concept One Health — sante humaine, animale et environnementale sont interdependantes\n• Problematique 3 : Pandemies futures — le risque d'emergence de nouveaux pathogenes augmente avec la pression sur les ecosystemes\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : La correlation spatiale sur une carte ne prouve pas un lien causal direct — d'autres facteurs interviennent\n• Nuance : La deforestation n'est pas le seul facteur — urbanisation, elevage intensif, commerce d'animaux sauvages aussi\n• Reference : Rapport IPBES 2020 sur biodiversite et pandemies, concept One Health (OMS/FAO/OIE)\n\n✅ CONCLUSION (0.5 min)\nProteger la biodiversite c'est aussi proteger la sante humaine. Ouverture : le medecin de demain devra integrer la dimension ecologique dans sa pratique.",
  "Document : temoignage ecrit d'un etudiant en medecine sur ses conditions de stage hospitalier. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nTemoignage ecrit d'un etudiant en medecine sur ses conditions de stage. Recit personnel, probablement evoquant surcharge, maltraitance hierarchique, epuisement.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Souffrance des etudiants en sante — 60% presentent des symptomes anxieux ou depressifs, taux de suicide superieur a la population generale\n• Problematique 2 : Conditions de stage — gardes excessives, harcelement, responsabilites sans encadrement suffisant\n• Problematique 3 : Paradoxe pedagogique — former au soin dans un environnement qui maltraite les apprenants\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un temoignage individuel n'est pas representatif de tous les stages — experiences tres variables\n• Nuance : Des progres ont ete faits (temps de repos, signalement) mais la culture du silence persiste\n• Reference : Rapport Dr Donata Marra 2018, Centre national d'appui a la qualite de vie des etudiants en sante\n\n✅ CONCLUSION (0.5 min)\nLa bientraitance des etudiants est une condition de la bientraitance future des patients. Ouverture : reformer la culture hospitalo-universitaire.",
  "Document : capture d'ecran d'une teleconsultation entre un medecin et un patient age. Discutez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nCapture d'ecran de teleconsultation : medecin face camera et patient age de l'autre cote. Interface numerique, soin a distance, patient probablement a domicile.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Fracture numerique — les personnes agees sont les plus eloignees du numerique mais les plus consommatrices de soins\n• Problematique 2 : Limites de l'examen clinique a distance — pas de palpation, auscultation, evaluation globale reduite\n• Problematique 3 : Apport reel en deserts medicaux — la teleconsultation peut compenser partiellement le manque de medecins\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'image d'une seule teleconsultation ne dit rien sur la qualite du soin rendu ni la satisfaction du patient\n• Nuance : La teleconsultation a explose pendant le Covid (+4000%) mais n'a pas vocation a remplacer le presentiel\n• Reference : Avenant 6 convention medicale (cadre teleconsultation), 20% des actes en 2021 vs 1% en 2019\n\n✅ CONCLUSION (0.5 min)\nLa teleconsultation est un outil complementaire, pas un substitut a la relation medicale en personne. Ouverture : former les patients ages au numerique en sante.",
  "Document : graphique montrant les niveaux de particules fines dans les cours d'ecole de grandes villes. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nGraphique des niveaux de particules fines (PM2.5/PM10) dans les cours d'ecole de grandes villes. Donnees alarmantes concernant des lieux ou les enfants passent des heures chaque jour.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Vulnerabilite des enfants — systeme respiratoire en developpement, ventilation plus rapide, plus grande exposition par kg\n• Problematique 2 : Consequences sanitaires — asthme (1er motif d'absenteisme scolaire), allergies, developpement cognitif affecte\n• Problematique 3 : Responsabilite des collectivites — urbanisme, circulation automobile autour des ecoles, vegetalisation\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Les mesures ponctuelles varient selon la saison, la meteo et le trafic — ne pas generaliser\n• Nuance : Des actions locales existent (rues scolaires, zones a faibles emissions) avec des resultats mesurables\n• Reference : Seuils OMS 2021 (PM2.5 : 5 ug/m3 annuel), programme PRIMEQUAL\n\n✅ CONCLUSION (0.5 min)\nProteger la qualite de l'air des enfants est un investissement de sante publique a long terme. Ouverture : repenser l'urbanisme autour des ecoles.",
  "Document : article de presse sur la vente de medicaments contrefaits dans les marches africains. Problematiques ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nArticle de presse sur les medicaments contrefaits vendus sur les marches africains. Problematique de sante publique majeure dans les pays a faibles ressources.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Danger sanitaire direct — 100 000 deces/an en Afrique lies aux medicaments contrefaits (OMS)\n• Problematique 2 : Antibio-resistance — faux antibiotiques sous-doses favorisent l'emergence de resistances bacteriennes\n• Problematique 3 : Causes structurelles — pauvrete, systemes de sante defaillants, circuits pharmaceutiques non regules\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un article de presse peut sensationnaliser — distinguer contrefacon (faux) et sous-standard (mauvaise qualite)\n• Nuance : Le probleme n'est pas que africain — les achats en ligne exposent aussi les pays developpes\n• Reference : Operation Pangea (Interpol), initiative Medicrime du Conseil de l'Europe\n\n✅ CONCLUSION (0.5 min)\nLes faux medicaments sont un fleau silencieux qui tue plus que le paludisme dans certaines regions. Ouverture : regulation et acces a des medicaments generiques de qualite.",
  "Document : image de deux personnes agees se tenant la main dans un EHPAD. Que vous inspire ce document ?": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage de deux personnes agees se tenant la main dans un EHPAD. Scene de tendresse, lien affectif preserve malgre l'institutionnalisation, humanite dans le soin.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Place de l'affectivite et de l'intimite en institution — droit a la vie affective et sexuelle des residents\n• Problematique 2 : Bien-vieillir ensemble — le lien social comme facteur protecteur de sante (reduction de la mortalite de 50%)\n• Problematique 3 : Vision positive du grand age — contrepoint aux images negatives habituelles de la dependance\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Image positive qui ne doit pas masquer les realites difficiles de nombreux EHPAD\n• Nuance : La vie affective en EHPAD se heurte a des obstacles pratiques (chambres individuelles, regard des familles)\n• Reference : Charte des droits et libertes de la personne agee dependante (1999), rapport Libault (2019)\n\n✅ CONCLUSION (0.5 min)\nCette image rappelle que le soin ne se limite pas au medical mais inclut le lien humain. Ouverture : integrer la dimension relationnelle dans la prise en charge du vieillissement.",
  "Document : infographie comparant la frequentation des fast-foods et des espaces verts dans un quartier. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nInfographie comparant fast-foods et espaces verts dans un quartier. Probablement un quartier defavorise avec surrepresentation de fast-foods et deficit d'espaces verts.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Environnement obesogene — concentration de fast-foods dans les quartiers populaires (3 fois plus que dans les quartiers aises)\n• Problematique 2 : Inegalites environnementales de sante — acces aux espaces verts reduit stress, maladies cardiovasculaires, ameliore sante mentale\n• Problematique 3 : Urbanisme et sante — l'amenagement urbain est un determinant de sante souvent neglige\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un seul quartier n'est pas generalizable — le lien entre offre alimentaire et comportement est complexe\n• Nuance : La presence de fast-foods ne predetermine pas les choix — l'education alimentaire joue aussi\n• Reference : Concept de \"desert alimentaire\", rapport OMS sur les villes-sante, urbanisme favorable a la sante\n\n✅ CONCLUSION (0.5 min)\nL'amenagement urbain est un levier sous-estime de sante publique. Ouverture : politiques municipales integrant sante et urbanisme.",
  "Document : capture d'ecran de ChatGPT affichant un diagnostic medical. Analysez les enjeux.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nCapture d'ecran de ChatGPT proposant un diagnostic medical. IA generative utilisee en auto-diagnostic par un patient, interface conversationnelle.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Fiabilite et hallucinations — l'IA peut donner des informations erronees presentees avec assurance, danger d'automedication\n• Problematique 2 : Bouleversement de la relation medecin-patient — le patient arrive avec un \"diagnostic\" qu'il croit valide\n• Problematique 3 : Responsabilite juridique — qui est responsable si un patient suit un mauvais conseil d'IA ?\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Une capture d'ecran ne montre pas la demarche du patient — contexte d'utilisation determinant\n• Nuance : L'IA peut aussi etre un outil positif — aide a la decision clinique, triage, acces a l'information sante\n• Reference : Reglement europeen sur l'IA (AI Act 2024), classification des IA medicales comme dispositifs a haut risque\n\n✅ CONCLUSION (0.5 min)\nL'IA en sante est un outil prometteur mais qui necessite un cadre ethique et reglementaire strict. Ouverture : former les medecins a integrer l'IA comme allie, pas concurrent.",
  "Document : temoignage ecrit d'une sage-femme sur ses conditions de travail apres un accouchement difficile. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nTemoignage d'une sage-femme sur ses conditions de travail suite a un accouchement difficile. Recit personnel revelant les tensions entre charge emotionnelle et moyens insuffisants.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Conditions de travail des sages-femmes — sous-effectifs, gardes de 24h, responsabilite medicale croissante sans reconnaissance\n• Problematique 2 : Securite perinatale — quand les conditions de travail degradees mettent en danger meres et nouveau-nes\n• Problematique 3 : Reconnaissance professionnelle — statut medical revendique, revalorisation salariale, autonomie de pratique\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : Un temoignage post-accouchement difficile est charge emotionnellement — ne pas generaliser a toute la profession\n• Nuance : Les reformes recentes (statut de praticien medical, revalorisations) sont un debut mais jugees insuffisantes\n• Reference : Greve des sages-femmes 2021-2022, rapport Igas sur la profession de sage-femme\n\n✅ CONCLUSION (0.5 min)\nLa souffrance des sages-femmes met en lumiere une crise plus large de la perinatalite. Ouverture : repenser le parcours de naissance avec les sages-femmes au centre du dispositif.",
  "Document : graphique montrant la stagnation de l'esperance de vie en France depuis 2019. Discutez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nGraphique montrant la stagnation de l'esperance de vie en France depuis 2019. Rupture avec des decennies de progression continue, inflexion preoccupante.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Impact du Covid-19 — surmortalite directe et indirecte (retards de diagnostic, decompensations, sante mentale)\n• Problematique 2 : Facteurs structurels pre-pandemiques — obesite, sedentarite, pollution, alcool, persistent au-dela du Covid\n• Problematique 3 : Inegalites sociales d'esperance de vie — 13 ans d'ecart entre les 5% les plus riches et les 5% les plus pauvres\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : La stagnation depuis 2019 est en partie conjoncturelle (pandemie) — la tendance long terme reste a confirmer\n• Nuance : L'esperance de vie en bonne sante est un indicateur plus pertinent que l'esperance de vie brute\n• Reference : Donnees Insee, rapport DREES sur l'etat de sante de la population, HCSP\n\n✅ CONCLUSION (0.5 min)\nLa stagnation de l'esperance de vie est un signal d'alarme pour notre systeme de sante. Ouverture : investir massivement dans la prevention plutot que le seul curatif.",
  "Document : image d'un enfant recevant un vaccin avec un parent inquiet, accompagnee de statistiques sur l'hesitation vaccinale. Analysez.": "📋 RESTITUTION DU DOCUMENT (1-1.5 min)\nImage d'un enfant se faisant vacciner, parent inquiet a cote, accompagnee de statistiques sur l'hesitation vaccinale. Dimension emotionnelle forte, donnees chiffrees en appui.\n\n🔍 PROBLEMATIQUES (2 min)\n• Problematique 1 : Hesitation vaccinale — la France est un des pays les plus mefiants (40% de doutes selon l'Inserm), menace pour l'immunite collective\n• Problematique 2 : Desinformation et reseaux sociaux — diffusion massive de fake news anti-vaccins, algorithmes amplifiant la peur\n• Problematique 3 : Role du medecin — premier interlocuteur de confiance, ecoute des peurs parentales sans jugement\n\n⚖️ ESPRIT CRITIQUE (1 min)\n• Limites : L'image emotionnelle d'un enfant pique peut renforcer l'hesitation plutot que la combattre\n• Nuance : L'hesitation vaccinale n'est pas de l'ignorance — c'est souvent une demande de transparence et de dialogue\n• Reference : 11 vaccins obligatoires depuis 2018, rapport OMS classant l'hesitation vaccinale parmi les 10 menaces pour la sante mondiale\n\n✅ CONCLUSION (0.5 min)\nL'hesitation vaccinale se combat par le dialogue et la transparence, pas par la contrainte seule. Ouverture : education a la sante et renforcement du lien de confiance medecin-patient."
