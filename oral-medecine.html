<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oral PASS Sorbonne 2026 - Preparation Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg-card: #14141e;
  --bg-card-hover: #1c1c2a;
  --bg-elevated: #1e1e2e;
  --border: #252538;
  --border-light: #35354a;
  --text: #e8e8f0;
  --text-secondary: #a0a0b8;
  --text-muted: #6a6a80;
  --accent: #7c6df0;
  --accent-light: #9d8ff7;
  --accent-dim: #4a3fb0;
  --accent-bg: rgba(124, 109, 240, 0.08);
  --success: #4ade80;
  --success-bg: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --warning-bg: rgba(251, 191, 36, 0.08);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.08);
  --info: #60a5fa;
  --info-bg: rgba(96, 165, 250, 0.08);
  --gradient-1: linear-gradient(135deg, #7c6df0, #60a5fa);
  --gradient-2: linear-gradient(135deg, #f87171, #fbbf24);
  --gradient-3: linear-gradient(135deg, #4ade80, #60a5fa);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}

[data-theme="light"] {
  --bg: #f5f5f7;
  --bg-card: #ffffff;
  --bg-card-hover: #f0f0f5;
  --bg-elevated: #eaeaf0;
  --border: #d8d8e0;
  --border-light: #c8c8d5;
  --text: #1a1a2e;
  --text-secondary: #4a4a60;
  --text-muted: #8888a0;
  --accent: #6355d8;
  --accent-light: #7c6df0;
  --accent-dim: #b0a8f0;
  --accent-bg: rgba(99, 85, 216, 0.08);
  --success: #16a34a;
  --success-bg: rgba(22, 163, 74, 0.1);
  --warning: #ca8a04;
  --warning-bg: rgba(202, 138, 4, 0.1);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --info: #2563eb;
  --info-bg: rgba(37, 99, 235, 0.08);
  --gradient-1: linear-gradient(135deg, #6355d8, #2563eb);
  --gradient-2: linear-gradient(135deg, #dc2626, #ca8a04);
  --gradient-3: linear-gradient(135deg, #16a34a, #2563eb);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
}

/* Theme toggle */
.theme-toggle {
  position: absolute; top: 1rem; right: 1rem;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 20px; padding: 0.35rem 0.7rem; cursor: pointer;
  font-size: 0.82rem; color: var(--text-muted); transition: all 0.3s;
  display: flex; align-items: center; gap: 0.3rem;
}
.theme-toggle:hover { border-color: var(--accent-dim); color: var(--text); }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background 0.3s ease, color 0.3s ease;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

.app { max-width: 100%; margin: 0 auto; padding: 0 2.5rem 3rem; }

/* Header */
.header {
  padding: 3rem 0 2rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
  position: relative;
}
.header__badge {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 1rem;
}
.header__title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  background: var(--gradient-1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.header__subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
}

/* Streak Banner */
.streak-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 0.8rem 1.5rem;
  background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(248,113,113,0.08));
  border: 1px solid rgba(251,191,36,0.25);
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
  50% { box-shadow: 0 0 20px rgba(251,191,36,0.15); }
}
.streak-fire { font-size: 1.5rem; }
.streak-count { font-size: 1.3rem; font-weight: 700; color: var(--warning); }
.streak-label { font-size: 0.85rem; color: var(--text-secondary); }
.streak-best { font-size: 0.75rem; color: var(--text-muted); }

/* Nav */
.nav {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0 0 1.5rem;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding-top: 0.5rem;
}
.nav::-webkit-scrollbar { display: none; }
.nav__btn {
  flex-shrink: 0;
  padding: 0.5rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.nav__btn:hover { background: var(--bg-card-hover); color: var(--text); border-color: var(--border-light); }
.nav__btn--active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.nav__btn--highlight {
  background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(248,113,113,0.1));
  border-color: var(--warning);
  color: var(--warning);
}
.nav__btn--highlight.nav__btn--active {
  background: linear-gradient(135deg, var(--warning), #f59e0b);
  color: #000;
}

/* Stats Bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.8rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  text-align: center;
  transition: all 0.2s;
}
.stat-card:hover { border-color: var(--border-light); transform: translateY(-1px); }
.stat-card__value { font-size: 1.4rem; font-weight: 700; }
.stat-card__label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.03em; }

/* Section Title */
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
  transition: all 0.2s;
}
.card:hover { border-color: var(--border-light); }
.card--accent { border-left: 3px solid var(--accent); }
.card--success { border-left: 3px solid var(--success); }
.card--warning { border-left: 3px solid var(--warning); }
.card--danger { border-left: 3px solid var(--danger); }

/* Questions */
.question {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 0.8rem;
  transition: all 0.25s;
  cursor: pointer;
}
.question:hover { border-color: var(--accent-dim); background: var(--bg-card-hover); }
/* 3-state question system */
.question--todo { border-left: 3px solid var(--border-light); }
.question--review { border-left: 3px solid var(--warning); background: rgba(251, 191, 36, 0.04); }
.question--done { border-left: 3px solid var(--success); opacity: 0.7; }

.status-icon {
  width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700; flex-shrink: 0; margin-top: 0.15rem; transition: all 0.2s;
}
.status-icon--todo { border: 2px solid var(--border-light); color: var(--text-muted); }
.status-icon--review { border: 2px solid var(--warning); background: var(--warning-bg); color: var(--warning); }
.status-icon--done { border: 2px solid var(--success); background: var(--success-bg); color: var(--success); }
.status-icon:hover { transform: scale(1.15); }

.status-badge {
  display: inline-block; padding: 0.1rem 0.4rem; border-radius: 10px;
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-left: 0.4rem;
}
.status-badge--review { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
.status-badge--done { background: var(--success-bg); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.3); }

/* Countdown */
.countdown-banner {
  text-align: center; padding: 1rem 1.5rem; margin-bottom: 1.5rem;
  background: linear-gradient(135deg, rgba(248,113,113,0.08), rgba(251,191,36,0.08));
  border: 1px solid rgba(248,113,113,0.2); border-radius: var(--radius-lg);
}
.countdown__days { font-size: 2.5rem; font-weight: 800; background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.countdown__label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem; }
.countdown__sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }

/* Phrases toolkit */
.phrases-grid { display: flex; flex-direction: column; gap: 0.5rem; }
.phrase-item {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem;
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.2s;
}
.phrase-item:hover { border-color: var(--accent-dim); background: var(--bg-card-hover); }
.phrase-item--copied { border-color: var(--success); background: var(--success-bg); }
.phrase-item__text { flex: 1; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
.phrase-item__copy { flex-shrink: 0; font-size: 0.7rem; color: var(--text-muted); padding: 0.2rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; }
.phrase-cat-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
.phrase-cat-tab {
  padding: 0.35rem 0.8rem; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
}
.phrase-cat-tab--active { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent-light); }

/* Export/Import */
.export-section { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1rem; }
.export-btn {
  padding: 0.6rem 1.2rem; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--text); font-size: 0.82rem; cursor: pointer; transition: all 0.2s; font-weight: 600;
}
.export-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.export-btn--primary { background: var(--accent); border-color: var(--accent); color: white; }
.export-btn--primary:hover { background: var(--accent-light); }

/* Motivational message */
.motiv-banner {
  text-align: center; padding: 1rem 1.5rem; margin-bottom: 1rem;
  background: var(--accent-bg); border: 1px solid var(--accent-dim); border-radius: var(--radius);
  font-size: 0.88rem; color: var(--text-secondary); font-style: italic; line-height: 1.5;
}
.question__text { font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.5rem; }
.question__meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.question__tag {
  padding: 0.15rem 0.5rem;
  background: var(--accent-bg);
  border-radius: 10px;
  font-size: 0.68rem;
  color: var(--accent-light);
}
.question__diff {
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  font-size: 0.68rem;
  font-weight: 600;
}
.question__diff--1 { background: var(--success-bg); color: var(--success); }
.question__diff--2 { background: var(--warning-bg); color: var(--warning); }
.question__diff--3 { background: var(--danger-bg); color: var(--danger); }

/* Search & Filters */
.search-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.filter-btn {
  padding: 0.4rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn--active { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent-light); }

/* Progress Bar */
.progress { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; margin-bottom: 1rem; }
.progress__fill { height: 100%; background: var(--gradient-3); border-radius: 3px; transition: width 0.5s ease; }

/* Practice Mode */
.practice {
  background: var(--bg-card);
  border: 2px solid var(--accent-dim);
  border-radius: var(--radius-lg);
  padding: 2rem;
  text-align: center;
}
.practice__timer {
  font-size: 3rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin: 1rem 0;
}
.practice__timer--warn { color: var(--warning); }
.practice__timer--danger { color: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }
.practice__question {
  font-size: 1.1rem;
  line-height: 1.6;
  margin: 1.5rem 0;
  padding: 1rem;
  background: var(--bg-elevated);
  border-radius: var(--radius);
}

/* Buttons */
.btn {
  padding: 0.6rem 1.2rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn--primary { background: var(--accent); color: white; }
.btn--primary:hover { background: var(--accent-light); transform: translateY(-1px); }
.btn--success { background: var(--success); color: #000; }
.btn--success:hover { opacity: 0.9; }
.btn--danger { background: var(--danger); color: white; }
.btn--danger:hover { opacity: 0.9; }
.btn--ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn--ghost:hover { border-color: var(--accent); color: var(--accent-light); }
.btn--small { padding: 0.35rem 0.8rem; font-size: 0.75rem; }
.btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; }

/* Method Cards */
.method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.method-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  transition: all 0.2s;
}
.method-card:hover { border-color: var(--border-light); transform: translateY(-2px); }
.method-card__title { font-size: 1rem; font-weight: 700; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.method-card__list { list-style: none; }
.method-card__list li { padding: 0.3rem 0; font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 0.5rem; align-items: flex-start; }
.method-card__list li::before { content: ""; flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; margin-top: 0.5rem; }

/* Fiche Cards */
.fiche-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; }
.fiche-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  transition: all 0.2s;
}
.fiche-card:hover { transform: translateY(-2px); }
.fiche-card__title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.8rem; }
.fiche-card__section { margin-bottom: 0.8rem; }
.fiche-card__label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.fiche-card__items { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }
.fiche-card__law { font-size: 0.8rem; padding: 0.5rem; background: var(--info-bg); border-radius: var(--radius-sm); color: var(--info); margin-bottom: 0.5rem; }
.fiche-card__trap { font-size: 0.8rem; padding: 0.5rem; background: var(--danger-bg); border-radius: var(--radius-sm); color: var(--danger); }

/* Actu Grid */
.actu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.actu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  transition: all 0.2s;
  position: relative;
}
.actu-card:hover { border-color: var(--border-light); }
.actu-card--hot { border-color: var(--danger); }
.actu-card--hot::after {
  content: "PROBABLE";
  position: absolute;
  top: 0.8rem;
  right: 0.8rem;
  padding: 0.15rem 0.5rem;
  background: var(--danger);
  color: white;
  border-radius: 10px;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.actu-card__theme { font-size: 0.7rem; color: var(--accent-light); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.actu-card__title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; }
.actu-card__desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }

/* Timeline */
.timeline { position: relative; padding-left: 2rem; }
.timeline::before { content: ""; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline__item { position: relative; margin-bottom: 1.2rem; }
.timeline__item::before {
  content: "";
  position: absolute;
  left: -1.65rem;
  top: 0.5rem;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
}
.timeline__time { font-size: 0.75rem; font-weight: 700; color: var(--accent-light); margin-bottom: 0.2rem; }
.timeline__text { font-size: 0.85rem; color: var(--text-secondary); }

/* Exemple Reponse */
.exemple {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.exemple__question { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
.exemple__type { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; background: var(--accent-bg); color: var(--accent-light); margin-bottom: 1rem; }
.exemple__section { margin-bottom: 0.8rem; }
.exemple__label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.exemple__text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }

/* Auto-Eval Grid */
.eval-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
.eval-cat { background: var(--bg-elevated); border-radius: var(--radius); padding: 1rem; }
.eval-cat__title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.6rem; }
.eval-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
.eval-item:hover { color: var(--text); }
.eval-check { width: 16px; height: 16px; border: 2px solid var(--border-light); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.eval-check--done { background: var(--success); border-color: var(--success); }

/* Journal */
.journal-entry {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 0.8rem;
  transition: all 0.2s;
}
.journal-entry:hover { border-color: var(--border-light); }

<script>
// Firebase config — remplacer par tes valeurs depuis console.firebase.google.com
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyplaceholder",
  authDomain: "oral-medecine.firebaseapp.com",
  databaseURL: "https://oral-medecine-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "oral-medecine",
  storageBucket: "oral-medecine.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:placeholder"
};
let firebaseDB = null;
let firebaseRef = null;
let SYNC_ENABLED = false;
const SYNC_KEYS = ['oral-pass-done','oral-pass-notes','oral-pass-responses','oral-pass-daily','oral-pass-streak','oral-pass-custom-questions','oral-pass-champions','oral-pass-images','oral-pass-theme'];
try {
  if (FIREBASE_CONFIG.apiKey !== 'AIzaSyplaceholder') {
    firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDB = firebase.database();
    // Room code — tout le monde avec le meme code partage les donnees
    const roomCode = new URLSearchParams(window.location.search).get('room') || 'default';
    firebaseRef = firebaseDB.ref('rooms/' + roomCode);
    SYNC_ENABLED = true;
    // Ecouter les changements distants
    firebaseRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      SYNC_KEYS.forEach(key => {
        if (data[key] !== undefined) {
          const remote = JSON.stringify(data[key]);
          const local = localStorage.getItem(key);
          if (remote !== local) {
            localStorage.setItem(key, remote);
            // Declencher un event custom pour que React se mette a jour
            window.dispatchEvent(new CustomEvent('firebase-sync', { detail: { key, value: data[key] } }));
          }
        }
      });
    });
    console.log('Firebase sync ON — room: ' + (new URLSearchParams(window.location.search).get('room') || 'default'));
  }
} catch(e) { console.warn('Firebase init failed:', e); }
// Helper pour push vers Firebase
function syncToFirebase(key, value) {
  if (!SYNC_ENABLED || !firebaseRef) return;
  const updates = {};
  updates[key] = value;
  firebaseRef.update(updates);
}

const baseAllQuestions = [...DATA.questions.rpc, ...DATA.questions.ared, ...DATA.questions.motivation];
const baseTotalQ = baseAllQuestions.length;

function App() {
  // Theme state
  const [theme, setTheme] = useState(() => localStorage.getItem('oral-pass-theme') || 'dark');
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('oral-pass-theme', theme);
  }, [theme]);
  const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);

  // Core state
  const [view, setView] = useState('accueil');

  const [status, setStatus] = useState(() => {
    try {
      const raw = localStorage.getItem('oral-pass-done');
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        const migrated = {};
        parsed.forEach(q => { migrated[q] = 'done'; });
        localStorage.setItem('oral-pass-done', JSON.stringify(migrated));
        return migrated;
      }
      return typeof parsed === 'object' && parsed !== null ? parsed : {};
    } catch(e) { return {}; }
  });
  const [notes, setNotes] = useState(() => { try { return JSON.parse(localStorage.getItem('oral-pass-notes')) || {}; } catch(e) { return {}; } });
  const [responses, setResponses] = useState(() => { try { return JSON.parse(localStorage.getItem('oral-pass-responses')) || {}; } catch(e) { return {}; } });

  const [timerRunning, setTimerRunning] = useState(false);
  const [evalChecks, setEvalChecks] = useState({});
  const [showEval, setShowEval] = useState(false);

  const uploadQuestionImage = useCallback((questionText) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { alert('Image trop lourde (max 2 Mo)'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        setQuestionImages(prev => ({ ...prev, [questionText]: ev.target.result }));

      reader.readAsDataURL(file);
    };
    input.click();
  }, []);

      if (prev.includes(questionText)) return prev.filter(q => q !== questionText);

    });

  useEffect(() => { localStorage.setItem('oral-pass-daily', JSON.stringify(dailyLog)); syncToFirebase('oral-pass-daily', dailyLog); }, [dailyLog]);
  useEffect(() => { localStorage.setItem('oral-pass-streak', JSON.stringify(streak)); syncToFirebase('oral-pass-streak', streak); }, [streak]);
  useEffect(() => { localStorage.setItem('oral-pass-custom-questions', JSON.stringify(customQuestions)); syncToFirebase('oral-pass-custom-questions', customQuestions); }, [customQuestions]);
  useEffect(() => { localStorage.setItem('oral-pass-champions', JSON.stringify(champions)); syncToFirebase('oral-pass-champions', champions); }, [champions]);
  useEffect(() => { localStorage.setItem('oral-pass-images', JSON.stringify(questionImages)); syncToFirebase('oral-pass-images', questionImages); }, [questionImages]);

  // Listen for Firebase remote sync events
  useEffect(() => {
    const handler = (e) => {
      const { key, value } = e.detail;
      if (key === 'oral-pass-done') setStatus(typeof value === 'object' && !Array.isArray(value) ? value : {});
      if (key === 'oral-pass-notes') setNotes(value || {});
      if (key === 'oral-pass-responses') setResponses(value || {});

      if (key === 'oral-pass-streak') setStreak(value || { current: 0, best: 0, lastDate: '' });

      if (key === 'oral-pass-champions') setChampions(Array.isArray(value) ? value : []);
      if (key === 'oral-pass-images') setQuestionImages(typeof value === 'object' && value !== null ? value : {});
    };
    window.addEventListener('firebase-sync', handler);
    return () => window.removeEventListener('firebase-sync', handler);
  }, []);

  useEffect(() => {

  useEffect(() => {
    const t = today();
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().split('T')[0];
    setStreak(s => {
      if (s.lastDate === t) return s;
      if (s.lastDate === yesterday) return s; // streak still valid, just not incremented yet
      if (s.lastDate && s.lastDate !== t && s.lastDate !== yesterday) return { ...s, current: 0 }; // streak broken
      return s;
    });
  }, []);

  const getQuestions = useCallback((type) => {

      q: newQ.q.trim(),

      difficulte: parseInt(newQ.difficulte) || 2,
      tags: newQ.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      _id: Date.now()

    setCustomQuestions(cq => ({ ...cq, [type]: [...(cq[type] || []), question] }));
    if (newQImage) { setQuestionImages(prev => ({ ...prev, [question.q]: newQImage })); }

    setNewQImage(null);
    setShowAddForm(null);
  }, [newQ, newQImage]);

  // Delete custom question
  const deleteCustomQuestion = useCallback((type, id) => {
    setCustomQuestions(cq => ({ ...cq, [type]: (cq[type] || []).filter(q => q._id !== id) }));
  }, []);

  const getStatus = useCallback((q) => status[q] || 'todo', [status]);
  const STATUS_CYCLE = ['todo', 'review', 'done'];
  const STATUS_LABELS = { todo: 'A faire', review: 'A revoir', done: 'Acquis' };
  const STATUS_ICONS = { todo: '○', review: '⟳', done: '✓' };

  const cycleStatus = useCallback((q) => {
    setStatus(prev => {
      const current = prev[q] || 'todo';
      const nextIdx = (STATUS_CYCLE.indexOf(current) + 1) % STATUS_CYCLE.length;
      const next = STATUS_CYCLE[nextIdx];
      const updated = { ...prev };
      if (next === 'todo') { delete updated[q]; } else { updated[q] = next; }
      return updated;
    });
  }, []);

  const startPractice = useCallback((type) => {
    const pool = getQuestions(type);
    const q = pool[Math.floor(Math.random() * pool.length)];
    setPracticeType(type);
    setPracticeQ(q);
    setPracticeMode(true);
    setTimer(0);
    setTimerRunning(true);
    setEvalChecks({});
    setShowEval(false);
  }, [getQuestions]);

  const stopPractice = useCallback(() => {
    setTimerRunning(false);
    setShowEval(true);
  }, []);

  const nextPractice = useCallback(() => {
    startPractice(practiceType);
  }, [practiceType, startPractice]);

  const exitPractice = useCallback(() => {
    setPracticeMode(false);
    setTimerRunning(false);
    setShowEval(false);
  }, []);

  // Save journal entry
  const saveJournalEntry = useCallback(() => {
    const t = today();
    const entry = {
      date: t,
      questionsCount: journalQCount,
      ratings: { ...journalRatings },
      confidence: journalConfidence,
      notes: journalNotes,
      timestamp: Date.now()
    };
    setDailyLog(log => [...log, entry]);
    // Update streak
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().split('T')[0];
    setStreak(s => {
      if (s.lastDate === t) return { ...s, lastDate: t }; // already logged today
      const newCurrent = (s.lastDate === yesterday || s.lastDate === t) ? s.current + 1 : 1;
      return { current: newCurrent, best: Math.max(s.best, newCurrent), lastDate: t };
    });
    // Reset form
    setJournalRatings({ structure: 0, contenu: 0, communication: 0, timing: 0, jury: 0 });

    setJournalNotes('');
    setJournalQCount(1);

  // ===== EVOLUTION VIEW =====
  const renderEvolution = () => {
    const last30 = [];
    const d = new Date(); d.setDate(d.getDate() - 29);
    for (let i = 0; i < 30; i++) {
      const ds = d.toISOString().split('T')[0];
      const entries = dailyLog.filter(e => e.date === ds);
      const avgRating = entries.length > 0
        ? entries.reduce((s, e) => { const vals = Object.values(e.ratings).filter(v => v > 0); return s + (vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : 0); }, 0) / entries.length
        : 0;
      const qCount = entries.reduce((s, e) => s + e.questionsCount, 0);
      last30.push({ date: ds, label: ds.slice(8), avgRating, qCount, entries: entries.length });
      d.setDate(d.getDate() + 1);
    }

    // SVG Line Chart - Average ratings over 30 days
    const maxR = 5;
    const chartW = 560, chartH = 180, padL = 30, padR = 10, padT = 10, padB = 25;
    const plotW = chartW - padL - padR, plotH = chartH - padT - padB;
    const points = last30.map((d, i) => ({
      x: padL + (i / 29) * plotW,
      y: padT + plotH - (d.avgRating / maxR) * plotH,
      val: d.avgRating
    })).filter(p => p.val > 0);

    const linePath = points.length > 1 ? points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') : '';

    // Radar chart data - average per category
    const cats = ['structure', 'contenu', 'communication', 'timing', 'jury'];
    const catLabels = ['Structure', 'Contenu', 'Comm.', 'Timing', 'Jury'];
    const catAvgs = cats.map(c => {
      const vals = dailyLog.filter(e => e.ratings[c] > 0).map(e => e.ratings[c]);
      return vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    });
    const radarR = 70, radarCx = 90, radarCy = 90;
    const radarPoints = catAvgs.map((v, i) => {
      const angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
      return { x: radarCx + Math.cos(angle) * (v / 5) * radarR, y: radarCy + Math.sin(angle) * (v / 5) * radarR };
    });
    const radarPath = radarPoints.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') + 'Z';

    // Calendar heatmap - last 60 days
    const heatDays = [];
    const hd = new Date(); hd.setDate(hd.getDate() - 59);
    for (let i = 0; i < 60; i++) {
      const ds = hd.toISOString().split('T')[0];
      const count = dailyLog.filter(e => e.date === ds).length;
      heatDays.push({ date: ds, level: count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : count >= 3 ? 3 : 4 });
      hd.setDate(hd.getDate() + 1);
    }

    // Confidence trend
    const confTrend = dailyLog.slice(-10).map(e => e.confidence);

    // Weak areas
    const weakAreas = cats.map((c, i) => ({ cat: catLabels[i], avg: catAvgs[i] })).filter(a => a.avg > 0).sort((a, b) => a.avg - b.avg);

    return h('div', { className: 'slide-up' },
      h('h2', { className: 'section-title' }, '📈 Evolution & Progression'),

      dailyLog.length === 0
        ? h('div', { className: 'empty-state' }, h('div', { className: 'empty-state__icon' }, '📊'), h('div', { className: 'empty-state__text' }, 'Commence a remplir le journal quotidien pour voir ta progression ici !'))
        : h(Fragment, null,

          // Top stats
          h('div', { className: 'stats-bar' },
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--warning)' } }, streak.current), h('div', { className: 'stat-card__label' }, 'Streak actuel')),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--accent-light)' } }, streak.best), h('div', { className: 'stat-card__label' }, 'Record streak')),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--success)' } }, dailyLog.length), h('div', { className: 'stat-card__label' }, 'Sessions totales')),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-card__value', style: { color: 'var(--info)' } }, dailyLog.reduce((s,e) => s + e.questionsCount, 0)), h('div', { className: 'stat-card__label' }, 'Questions totales'))
          ),

          h('div', { className: 'evo-grid' },

            // Line chart
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '📉 Note moyenne / 30 derniers jours'),
              h('div', { className: 'chart-container' },
                h('svg', { viewBox: '0 0 ' + chartW + ' ' + chartH, preserveAspectRatio: 'xMidYMid meet' },
                  // Grid lines
                  [1,2,3,4,5].map(v => h('line', { key: v, x1: padL, y1: padT + plotH - (v/5)*plotH, x2: padL + plotW, y2: padT + plotH - (v/5)*plotH, stroke: 'rgba(255,255,255,0.06)', strokeWidth: 1 })),
                  [1,2,3,4,5].map(v => h('text', { key: 't'+v, x: padL - 5, y: padT + plotH - (v/5)*plotH + 4, fill: 'rgba(255,255,255,0.3)', fontSize: 10, textAnchor: 'end' }, v)),
                  // X labels
                  last30.filter((_, i) => i % 5 === 0).map((d, i) => h('text', { key: 'x'+i, x: padL + ((i*5)/29)*plotW, y: chartH - 5, fill: 'rgba(255,255,255,0.3)', fontSize: 9, textAnchor: 'middle' }, d.label)),
                  // Line
                  linePath ? h('path', { d: linePath, fill: 'none', stroke: '#7c6df0', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' }) : null,
                  // Dots
                  points.map((p, i) => h('circle', { key: i, cx: p.x, cy: p.y, r: 3.5, fill: '#7c6df0', stroke: '#0a0a0f', strokeWidth: 1.5 }))
                )
              )
            ),

            // Radar chart
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '🕸️ Profil de competences'),
              h('div', { className: 'chart-container' },
                h('svg', { viewBox: '0 0 180 180', preserveAspectRatio: 'xMidYMid meet' },
                  // Grid pentagons
                  [0.2, 0.4, 0.6, 0.8, 1].map((s, si) => {
                    const pts = Array.from({length: 5}, (_, i) => {
                      const a = (Math.PI * 2 * i / 5) - Math.PI / 2;
                      return (radarCx + Math.cos(a) * s * radarR).toFixed(1) + ',' + (radarCy + Math.sin(a) * s * radarR).toFixed(1);
                    }).join(' ');
                    return h('polygon', { key: si, points: pts, fill: 'none', stroke: 'rgba(255,255,255,0.08)', strokeWidth: 1 });
                  }),
                  // Labels
                  catLabels.map((label, i) => {
                    const a = (Math.PI * 2 * i / 5) - Math.PI / 2;
                    const lx = radarCx + Math.cos(a) * (radarR + 15);
                    const ly = radarCy + Math.sin(a) * (radarR + 15);
                    return h('text', { key: i, x: lx, y: ly + 3, fill: 'rgba(255,255,255,0.5)', fontSize: 9, textAnchor: 'middle' }, label);
                  }),
                  // Data polygon
                  catAvgs.some(v => v > 0) ? h('polygon', { points: radarPoints.map(p => p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '), fill: 'rgba(124,109,240,0.2)', stroke: '#7c6df0', strokeWidth: 2 }) : null,
                  // Data dots
                  radarPoints.map((p, i) => catAvgs[i] > 0 ? h('circle', { key: i, cx: p.x, cy: p.y, r: 3, fill: '#7c6df0' }) : null)
                )
              )
            ),

            // Calendar heatmap
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '📅 Activite (60 derniers jours)'),
              h('div', { className: 'heatmap' },
                heatDays.map((d, i) => h('div', { key: i, className: 'heatmap__day heatmap__day--' + d.level, title: formatDate(d.date) + ' : ' + d.level + ' session(s)' }))
              )
            ),

            // Weak areas
            h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '🎯 Axes d\'amelioration'),
              weakAreas.length === 0
                ? h('div', { style: { fontSize: '0.82rem', color: 'var(--text-muted)' } }, 'Pas encore assez de donnees.')
                : weakAreas.map((a, i) =>
                    h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: '0.8rem', marginBottom: '0.6rem' } },
                      h('span', { style: { fontSize: '0.82rem', minWidth: '90px', color: i === 0 ? 'var(--danger)' : 'var(--text-secondary)' } }, a.cat),
                      h('div', { style: { flex: 1, height: '6px', background: 'var(--bg-elevated)', borderRadius: '3px', overflow: 'hidden' } },
                        h('div', { style: { height: '100%', width: (a.avg / 5 * 100) + '%', background: i === 0 ? 'var(--danger)' : i === 1 ? 'var(--warning)' : 'var(--gradient-3)', borderRadius: '3px', transition: 'width 0.5s' } })
                      ),
                      h('span', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', minWidth: '35px', textAlign: 'right' } }, a.avg.toFixed(1) + '/5')
                    )
                  )
            ),

            // Confidence trend
            confTrend.length > 0 ? h('div', { className: 'evo-card' },
              h('div', { className: 'evo-card__title' }, '💪 Confiance (10 dernieres sessions)'),
              h('div', { style: { display: 'flex', gap: '4px', alignItems: 'flex-end', height: '80px' } },
                confTrend.map((c, i) =>
                  h('div', { key: i, style: { flex: 1, height: (c / 5 * 100) + '%', background: c >= 4 ? 'var(--success)' : c >= 3 ? 'var(--info)' : c >= 2 ? 'var(--warning)' : 'var(--danger)', borderRadius: '3px 3px 0 0', minHeight: '4px', transition: 'height 0.3s' } })
                )
              ),
              h('div', { style: { display: 'flex', gap: '4px', marginTop: '4px' } },
                confTrend.map((c, i) => h('div', { key: i, style: { flex: 1, textAlign: 'center', fontSize: '0.65rem', color: 'var(--text-muted)' } }, c))
              )
            ) : null
          )
        )
    );
  };

  // ===== EXPORT / IMPORT =====
  const exportData = useCallback(() => {
    const data = {};
    ['oral-pass-done', 'oral-pass-notes', 'oral-pass-responses', 'oral-pass-daily', 'oral-pass-streak', 'oral-pass-custom-questions', 'oral-pass-champions', 'oral-pass-images', 'oral-pass-theme'].forEach(key => {
      const v = localStorage.getItem(key);
      if (v) data[key] = JSON.parse(v);
    });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'oral-medecine-backup-' + today() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }, []);

  const importData = useCallback(() => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          Object.entries(data).forEach(([key, value]) => {
            localStorage.setItem(key, JSON.stringify(value));
          });
          // Reload state from localStorage
          if (data['oral-pass-done']) setStatus(typeof data['oral-pass-done'] === 'object' ? data['oral-pass-done'] : {});
          if (data['oral-pass-notes']) setNotes(data['oral-pass-notes']);
          if (data['oral-pass-responses']) setResponses(data['oral-pass-responses']);
          if (data['oral-pass-daily']) setDailyLog(data['oral-pass-daily']);
          if (data['oral-pass-streak']) setStreak(data['oral-pass-streak']);
          if (data['oral-pass-custom-questions']) setCustomQuestions(data['oral-pass-custom-questions']);
          if (data['oral-pass-champions']) setChampions(data['oral-pass-champions']);
          if (data['oral-pass-images']) setQuestionImages(data['oral-pass-images']);
          alert('Donnees importees avec succes !');
        } catch(err) {
          alert('Erreur : fichier invalide.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }, []);

  // ===== SUIVI (Journal + Evolution merged) =====
  const renderSuivi = () => {
    return h('div', { className: 'slide-up' },
      h('div', { style: { display: 'flex', gap: '0.5rem', marginBottom: '1.5rem' } },
        h('button', { className: 'btn ' + (suiviTab === 'journal' ? 'btn--primary' : 'btn--ghost'), onClick: () => setSuiviTab('journal') }, '📓 Journal'),
        h('button', { className: 'btn ' + (suiviTab === 'evolution' ? 'btn--primary' : 'btn--ghost'), onClick: () => setSuiviTab('evolution') }, '📈 Evolution')
      ),
      suiviTab === 'journal' ? renderJournal() : renderEvolution(),
      h('div', { className: 'card', style: { marginTop: '1.5rem', borderLeft: '4px solid var(--info)' } },
        h('h3', { style: { marginBottom: '0.5rem' } }, '💾 Sauvegarde des donnees'),
        h('p', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '0.8rem' } }, 'Exporte tes donnees pour les sauvegarder ou les transferer sur un autre appareil.'),
        h('div', { className: 'export-section' },
          h('button', { className: 'export-btn export-btn--primary', onClick: exportData }, '📥 Exporter mes donnees'),
          h('button', { className: 'export-btn', onClick: importData }, '📤 Importer une sauvegarde')
        )
      )
    );
  };

  // ===== CHIFFRES CLES =====
  const renderChiffres = () => {
    const f = DATA.format;
    const p = f.places;
    const h2025 = f.historique_2024_25;
    const r = h2025.reclassement;
    const mkStat = (label, value, color) => h('div', { style: { textAlign: 'center', padding: '1rem', background: 'var(--bg-elevated)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border)' } },
      h('div', { style: { fontSize: '1.6rem', fontWeight: 800, color: color || 'var(--accent-light)' } }, value),
      h('div', { style: { fontSize: '0.72rem', color: 'var(--text-muted)', marginTop: '0.3rem', textTransform: 'uppercase', letterSpacing: '0.03em' } }, label)
    );
    const mkRow = (label, value) => h('div', { style: { display: 'flex', justifyContent: 'space-between', padding: '0.5rem 0', borderBottom: '1px solid var(--border)', fontSize: '0.85rem' } },
      h('span', { style: { color: 'var(--text-secondary)' } }, label),
      h('span', { style: { fontWeight: 600, color: 'var(--text)' } }, value)
    );
    return h('div', { className: 'slide-up' },
      // Dates importantes
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--danger)', marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '📅 Dates importantes'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '0.8rem' } },
          mkStat('Amphi de garnison', '28 Mai', 'var(--danger)'),
          mkStat('Epreuves orales', '15-18 Juin', 'var(--warning)'),
          mkStat('Epreuves orales', 'Apres ecrit', 'var(--accent)')
        )
      ),
      // Places 2025-2026
      h('div', { className: 'card', style: { marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '🎯 Places MMOPK 2025-2026'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))', gap: '0.8rem', marginBottom: '1rem' } },
          mkStat('Total', p.total_mmopk, 'var(--success)'),
          mkStat('Via ecrit', p.attribuees_ecrit, 'var(--info)'),
          mkStat('Via oral', p.attribuees_oral, 'var(--warning)')
        ),
        h('h3', { style: { fontSize: '0.9rem', color: 'var(--text-secondary)', marginBottom: '0.5rem', marginTop: '1rem' } }, 'Capacites par filiere'),
        mkRow('Medecine', p.capacites.medecine),
        mkRow('Pharmacie', p.capacites.pharmacie),
        mkRow('Odontologie', p.capacites.odontologie),
        mkRow('Maieutique', p.capacites.maieutique),
        mkRow('Kinesitherapie EKP', p.capacites.kine_ekp),
        mkRow('Kinesitherapie APHP', p.capacites.kine_aphp),
        mkRow('Ergotherapie', p.capacites.ergotherapie)
      ),
      // Scoring
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--accent)', marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '📐 Formule de classement'),
        h('div', { style: { background: 'var(--accent-bg)', padding: '1.2rem', borderRadius: 'var(--radius-sm)', marginBottom: '0.8rem', textAlign: 'center' } },
          h('div', { style: { fontSize: '1.1rem', fontWeight: 700, color: 'var(--accent-light)' } }, 'Classement final = 2/3 Note ecrit + 1/3 Note oral'),
          h('div', { style: { fontSize: '0.82rem', color: 'var(--text-secondary)', marginTop: '0.4rem' } }, 'Oral minimum 50% pour etre admis en MMOPK')
        ),
        h('p', { style: { fontSize: '0.85rem', color: 'var(--text-secondary)' } }, 'Note ecrit = bloc sante S1 + S2 (60 ECTS). Le classement apres l\'ecrit determine la convocation aux oraux.')
      ),
      // Historique 2024-2025
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--success)', marginBottom: '1.5rem' } },
        h('h2', { className: 'section-title' }, '📊 Historique 2024-2025 — L\'oral redistribue TOUT'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '0.8rem', marginBottom: '1rem' } },
          mkStat('Convoques', h2025.convoques, 'var(--text)'),
          mkStat('Presents oraux', h2025.presents_oraux, 'var(--info)'),
          mkStat('Refus garnison', h2025.refus, 'var(--danger)'),
          mkStat('Absents', h2025.absents, 'var(--text-muted)')
        ),
        h('h3', { style: { fontSize: '0.9rem', color: 'var(--success)', marginBottom: '0.5rem', marginTop: '1rem' } }, '✅ Recus par filiere (2024-25)'),
        mkRow('Medecine', h2025.recus.medecine),
        mkRow('Pharmacie', h2025.recus.pharmacie),
        mkRow('Odontologie', h2025.recus.odontologie),
        mkRow('Maieutique', h2025.recus.maieutique),
        mkRow('Kine APHP', h2025.recus.kine_aphp),
        mkRow('Kine EKP', h2025.recus.kine_ekp)
      ),
      // Reclassement — le plus motivant
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--warning)', background: 'linear-gradient(135deg, rgba(251,191,36,0.05), rgba(74,222,128,0.05))' } },
        h('h2', { className: 'section-title' }, '🔥 Reclassement par l\'oral — Pourquoi tout est encore possible'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '0.8rem', marginBottom: '1rem' } },
          mkStat('Reclasses', r.nb_reclasses + ' etudiants', 'var(--success)'),
          mkStat('Declasses', r.nb_declasses + ' etudiants', 'var(--danger)')
        ),
        h('div', { className: 'card', style: { background: 'var(--success-bg)', border: '1px solid rgba(74,222,128,0.3)', marginBottom: '0.8rem' } },
          h('div', { style: { fontSize: '0.82rem', fontWeight: 600, color: 'var(--success)', marginBottom: '0.3rem' } }, '🚀 Plus grand gain : ' + r.meilleur_gain),
          h('div', { style: { fontSize: '0.78rem', color: 'var(--text-secondary)' } }, 'Un etudiant classe 311e a l\'ecrit est passe 124e grace a l\'oral !'),
          h('div', { style: { fontSize: '0.78rem', color: 'var(--text-secondary)', marginTop: '0.3rem' } }, 'Plus grand bond parmi les reclasses : ' + r.plus_grand_gain_reclasse)
        ),
        h('div', { className: 'card', style: { background: 'var(--danger-bg)', border: '1px solid rgba(248,113,113,0.3)' } },
          h('div', { style: { fontSize: '0.82rem', fontWeight: 600, color: 'var(--danger)', marginBottom: '0.3rem' } }, '⚠️ Plus grande perte : ' + r.pire_perte),
          h('div', { style: { fontSize: '0.78rem', color: 'var(--text-secondary)' } }, 'Meme bien classe a l\'ecrit, un mauvais oral peut tout renverser.')
        ),
        h('div', { style: { marginTop: '1rem', padding: '1rem', background: 'var(--bg-elevated)', borderRadius: 'var(--radius-sm)', textAlign: 'center' } },
          h('div', { style: { fontSize: '0.9rem', fontWeight: 700, color: 'var(--warning)' } }, '💡 Message cle : L\'oral est une SECONDE CHANCE'),
          h('div', { style: { fontSize: '0.82rem', color: 'var(--text-secondary)', marginTop: '0.3rem' } }, 'Peu importe ton classement ecrit, une bonne preparation a l\'oral peut te faire gagner plus de 180 places. Chaque minute de preparation compte !')
        )
      ),
      // Consignes garnison
      h('div', { className: 'card', style: { borderLeft: '4px solid var(--info)', marginTop: '1.5rem' } },
        h('h2', { className: 'section-title' }, '🏛️ Consignes Amphi de Garnison'),
        h('ul', { style: { listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
          f.consignes_garnison.map((c, i) => h('li', { key: i, style: { fontSize: '0.85rem', display: 'flex', alignItems: 'flex-start', gap: '0.5rem' } },
            h('span', { style: { color: 'var(--info)', flexShrink: 0, marginTop: '0.1rem' } }, '•'),
            c
          ))
        )
      )
    );
  };

  // ===== MAIN RENDER =====
  const renderContent = () => {
    if (practiceMode) return renderPractice();
    switch(view) {
      case 'accueil': return renderAccueil();
      case 'rpc': return renderQuestionList('rpc');
      case 'ared': return renderQuestionList('ared');
      case 'motivation': return renderQuestionList('motivation');
      case 'methodo': return renderMethodo();
      case 'fiches': return renderFiches();
      case 'exemples': return renderExemples();
      case 'actualites': return renderActualites();
      case 'chiffres': return renderChiffres();
      case 'phrases': return renderPhrases();
      case 'jourj': return renderJourJ();
      case 'suivi': return renderSuivi();
      case 'pratique': return renderPractice();
      default: return renderAccueil();
    }
  };

  return h('div', null,
    h('header', { className: 'header' },
      h('button', { className: 'theme-toggle', onClick: toggleTheme, title: theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre' }, theme === 'dark' ? '☀️ Clair' : '🌙 Sombre'),
      h('div', { className: 'header__badge' }, 'PASS SORBONNE UNIVERSITE 2026'),
      h('h1', { className: 'header__title' }, 'Preparation Oral Medecine'),
      h('p', { className: 'header__subtitle' }, totalQ + ' questions · Fiches thematiques · 7 exemples corriges · 13 actualites · Suivi & progression · Entrainement + auto-eval')
    ),
    renderStreakBanner(),
    renderNav(),
    renderContent()
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
