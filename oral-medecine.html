<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oral PASS Sorbonne 2026 - Preparation Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg-card: #14141e;
  --bg-card-hover: #1c1c2a;
  --bg-elevated: #1e1e2e;
  --border: #252538;
  --border-light: #35354a;
  --text: #e8e8f0;
  --text-secondary: #a0a0b8;
  --text-muted: #6a6a80;
  --accent: #7c6df0;
  --accent-light: #9d8ff7;
  --accent-dim: #4a3fb0;
  --accent-bg: rgba(124, 109, 240, 0.08);
  --success: #4ade80;
  --success-bg: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --warning-bg: rgba(251, 191, 36, 0.08);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.08);
  --info: #60a5fa;
  --info-bg: rgba(96, 165, 250, 0.08);
  --gradient-1: linear-gradient(135deg, #7c6df0, #60a5fa);
  --gradient-2: linear-gradient(135deg, #f87171, #fbbf24);
  --gradient-3: linear-gradient(135deg, #4ade80, #60a5fa);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

.app { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 3rem; }

/* Header */
.header {
  padding: 3rem 0 2rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}
.header__badge {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 1rem;
}
.header__title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  background: var(--gradient-1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.header__subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
}

/* Streak Banner */
.streak-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 0.8rem 1.5rem;
  background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(248,113,113,0.08));
  border: 1px solid rgba(251,191,36,0.25);
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
  50% { box-shadow: 0 0 20px rgba(251,191,36,0.15); }
}
.streak-fire { font-size: 1.5rem; }
.streak-count { font-size: 1.3rem; font-weight: 700; color: var(--warning); }
.streak-label { font-size: 0.85rem; color: var(--text-secondary); }
.streak-best { font-size: 0.75rem; color: var(--text-muted); }

/* Nav */
.nav {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0 0 1.5rem;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding-top: 0.5rem;
}
.nav::-webkit-scrollbar { display: none; }
.nav__btn {
  flex-shrink: 0;
  padding: 0.5rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.nav__btn:hover { background: var(--bg-card-hover); color: var(--text); border-color: var(--border-light); }
.nav__btn--active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.nav__btn--highlight {
  background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(248,113,113,0.1));
  border-color: var(--warning);
  color: var(--warning);
}
.nav__btn--highlight.nav__btn--active {
  background: linear-gradient(135deg, var(--warning), #f59e0b);
  color: #000;
}

/* Stats Bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.8rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  text-align: center;
  transition: all 0.2s;
}
.stat-card:hover { border-color: var(--border-light); transform: translateY(-1px); }
.stat-card__value { font-size: 1.4rem; font-weight: 700; }
.stat-card__label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.03em; }

/* Section Title */
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
  transition: all 0.2s;
}
.card:hover { border-color: var(--border-light); }
.card--accent { border-left: 3px solid var(--accent); }
.card--success { border-left: 3px solid var(--success); }
.card--warning { border-left: 3px solid var(--warning); }
.card--danger { border-left: 3px solid var(--danger); }

/* Questions */
.question {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 0.8rem;
  transition: all 0.25s;
  cursor: pointer;
}
.question:hover { border-color: var(--accent-dim); background: var(--bg-card-hover); }
.question--done { border-left: 3px solid var(--success); opacity: 0.7; }
.question__text { font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.5rem; }
.question__meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.question__tag {
  padding: 0.15rem 0.5rem;
  background: var(--accent-bg);
  border-radius: 10px;
  font-size: 0.68rem;
  color: var(--accent-light);
}
.question__diff {
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  font-size: 0.68rem;
  font-weight: 600;
}
.question__diff--1 { background: var(--success-bg); color: var(--success); }
.question__diff--2 { background: var(--warning-bg); color: var(--warning); }
.question__diff--3 { background: var(--danger-bg); color: var(--danger); }

/* Search & Filters */
.search-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.filter-btn {
  padding: 0.4rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn--active { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent-light); }

/* Progress Bar */
.progress { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; margin-bottom: 1rem; }
.progress__fill { height: 100%; background: var(--gradient-3); border-radius: 3px; transition: width 0.5s ease; }

/* Practice Mode */
.practice {
  background: var(--bg-card);
  border: 2px solid var(--accent-dim);
  border-radius: var(--radius-lg);
  padding: 2rem;
  text-align: center;
}
.practice__timer {
  font-size: 3rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin: 1rem 0;
}
.practice__timer--warn { color: var(--warning); }
.practice__timer--danger { color: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }
.practice__question {
  font-size: 1.1rem;
  line-height: 1.6;
  margin: 1.5rem 0;
  padding: 1rem;
  background: var(--bg-elevated);
  border-radius: var(--radius);
}

/* Buttons */
.btn {
  padding: 0.6rem 1.2rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn--primary { background: var(--accent); color: white; }
.btn--primary:hover { background: var(--accent-light); transform: translateY(-1px); }
.btn--success { background: var(--success); color: #000; }
.btn--success:hover { opacity: 0.9; }
.btn--danger { background: var(--danger); color: white; }
.btn--danger:hover { opacity: 0.9; }
.btn--ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn--ghost:hover { border-color: var(--accent); color: var(--accent-light); }
.btn--small { padding: 0.35rem 0.8rem; font-size: 0.75rem; }
.btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; }

/* Method Cards */
.method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.method-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  transition: all 0.2s;
}
.method-card:hover { border-color: var(--border-light); transform: translateY(-2px); }
.method-card__title { font-size: 1rem; font-weight: 700; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.method-card__list { list-style: none; }
.method-card__list li { padding: 0.3rem 0; font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 0.5rem; align-items: flex-start; }
.method-card__list li::before { content: ""; flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; margin-top: 0.5rem; }

/* Fiche Cards */
.fiche-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; }
.fiche-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  transition: all 0.2s;
}
.fiche-card:hover { transform: translateY(-2px); }
.fiche-card__title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.8rem; }
.fiche-card__section { margin-bottom: 0.8rem; }
.fiche-card__label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.fiche-card__items { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }
.fiche-card__law { font-size: 0.8rem; padding: 0.5rem; background: var(--info-bg); border-radius: var(--radius-sm); color: var(--info); margin-bottom: 0.5rem; }
.fiche-card__trap { font-size: 0.8rem; padding: 0.5rem; background: var(--danger-bg); border-radius: var(--radius-sm); color: var(--danger); }

/* Actu Grid */
.actu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.actu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  transition: all 0.2s;
  position: relative;
}
.actu-card:hover { border-color: var(--border-light); }
.actu-card--hot { border-color: var(--danger); }
.actu-card--hot::after {
  content: "PROBABLE";
  position: absolute;
  top: 0.8rem;
  right: 0.8rem;
  padding: 0.15rem 0.5rem;
  background: var(--danger);
  color: white;
  border-radius: 10px;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.actu-card__theme { font-size: 0.7rem; color: var(--accent-light); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.actu-card__title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; }
.actu-card__desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }

/* Timeline */
.timeline { position: relative; padding-left: 2rem; }
.timeline::before { content: ""; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline__item { position: relative; margin-bottom: 1.2rem; }
.timeline__item::before {
  content: "";
  position: absolute;
  left: -1.65rem;
  top: 0.5rem;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
}
.timeline__time { font-size: 0.75rem; font-weight: 700; color: var(--accent-light); margin-bottom: 0.2rem; }
.timeline__text { font-size: 0.85rem; color: var(--text-secondary); }

/* Exemple Reponse */
.exemple {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.exemple__question { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
.exemple__type { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; background: var(--accent-bg); color: var(--accent-light); margin-bottom: 1rem; }
.exemple__section { margin-bottom: 0.8rem; }
.exemple__label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.exemple__text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }

/* Auto-Eval Grid */
.eval-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
.eval-cat { background: var(--bg-elevated); border-radius: var(--radius); padding: 1rem; }
.eval-cat__title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.6rem; }
.eval-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
.eval-item:hover { color: var(--text); }
.eval-check { width: 16px; height: 16px; border: 2px solid var(--border-light); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.eval-check--done { background: var(--success); border-color: var(--success); }

/* Journal */
.journal-entry {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 0.8rem;
  transition: all 0.2s;
}
.journal-entry:hover { border-color: var(--border-light); }
.journal-entry__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
.journal-entry__date { font-weight: 600; font-size: 0.9rem; }
.journal-entry__confidence {
  padding: 0.2rem 0.6rem;
  border-radius: 10px;
  font-size: 0.72rem;
  font-weight: 600;
}
.journal-entry__stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.journal-entry__stat { font-size: 0.8rem; color: var(--text-secondary); }
.journal-entry__stat strong { color: var(--text); }
.journal-entry__notes { font-size: 0.82rem; color: var(--text-muted); font-style: italic; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
.journal-entry__ratings { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
.journal-entry__rating { padding: 0.2rem 0.5rem; background: var(--bg-elevated); border-radius: var(--radius-sm); font-size: 0.72rem; }

/* Daily Goal */
.daily-goal {
  background: linear-gradient(135deg, rgba(124,109,240,0.08), rgba(96,165,250,0.05));
  border: 1px solid var(--accent-dim);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.daily-goal__ring {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
}
.daily-goal__info { flex: 1; }
.daily-goal__title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; }
.daily-goal__sub { font-size: 0.78rem; color: var(--text-secondary); }

/* Rating input */
.rating-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.6rem; }
.rating-row__label { font-size: 0.82rem; color: var(--text-secondary); min-width: 110px; }
.rating-stars { display: flex; gap: 0.2rem; }
.rating-star {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border-light);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  transition: all 0.15s;
}
.rating-star:hover { border-color: var(--accent); color: var(--accent); }
.rating-star--active { background: var(--accent); border-color: var(--accent); color: white; }

/* Evolution Dashboard */
.evo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.evo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
}
.evo-card__title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.8rem; color: var(--text-secondary); }

/* Calendar Heatmap */
.heatmap { display: flex; gap: 2px; flex-wrap: wrap; }
.heatmap__day {
  width: 14px;
  height: 14px;
  border-radius: 2px;
  background: var(--bg-elevated);
}
.heatmap__day--1 { background: rgba(124,109,240,0.25); }
.heatmap__day--2 { background: rgba(124,109,240,0.45); }
.heatmap__day--3 { background: rgba(124,109,240,0.7); }
.heatmap__day--4 { background: var(--accent); }

/* SVG Charts */
.chart-container { width: 100%; overflow: hidden; }
.chart-container svg { width: 100%; height: auto; }

/* Form */
.form-group { margin-bottom: 1rem; }
.form-label { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; display: block; }
.form-textarea {
  width: 100%;
  padding: 0.6rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.85rem;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
  outline: none;
}
.form-textarea:focus { border-color: var(--accent); }
.form-select {
  padding: 0.5rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.82rem;
  outline: none;
  cursor: pointer;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.slide-up { animation: slideUp 0.4s ease-out; }

/* Responsive */
@media (max-width: 600px) {
  .app { padding: 0 1rem 2rem; }
  .header { padding: 2rem 0 1.5rem; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .method-grid, .fiche-grid, .actu-grid, .evo-grid { grid-template-columns: 1fr; }
  .practice { padding: 1.5rem; }
  .practice__timer { font-size: 2.5rem; }
  .eval-grid { grid-template-columns: 1fr; }
  .daily-goal { flex-direction: column; text-align: center; }
  .streak-banner { flex-wrap: wrap; justify-content: center; }
}

/* Confidence colors */
.confidence--1 { background: var(--danger-bg); color: var(--danger); }
.confidence--2 { background: var(--warning-bg); color: var(--warning); }
.confidence--3 { background: var(--info-bg); color: var(--info); }
.confidence--4 { background: var(--success-bg); color: var(--success); }
.confidence--5 { background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(96,165,250,0.1)); color: var(--success); }

/* Accordion response */
.resp-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.6rem;
  padding: 0.5rem 0.8rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;

  actualites: [
    { theme: "Fin de vie / Aide active a mourir", titre: "Projet de loi sur l'aide active a mourir (2025-2026)", desc: "Debat majeur en France. Loi Claeys-Leonetti (2016) autorise la sedation profonde mais PAS l'euthanasie ni le suicide assiste. Un projet de loi sur l'aide active a mourir a ete depose. La Belgique, les Pays-Bas et la Suisse ont des legislations plus permissives. Arguments pour : dignite, autonomie, souffrance insupportable. Arguments contre : pente glissante, role du medecin, soins palliatifs insuffisants.", hot: true },

    { theme: "Sante mentale des jeunes", titre: "Explosion des troubles psychiques chez les 15-25 ans", desc: "+30% de troubles anxieux et depressifs chez les jeunes depuis le COVID. Tentatives de suicide en hausse. Manque criant de pedopsychiatres. Dispositif Mon Parcours Psy (8 seances remboursees) juge insuffisant. Role des reseaux sociaux dans la comparaison sociale et le cyberharcelement." },

  "Votre voisin a un chien. Depuis quelque temps, vous remarquez qu'il le laisse enferme dans la voiture par forte chaleur. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nSituation de maltraitance animale potentielle : un chien enferme dans un vehicule par forte chaleur. Acteurs : le voisin proprietaire, l'animal en danger, moi temoin. Problematique : comment agir face a une mise en danger animale ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Urgence vitale - un chien peut mourir en 30 min dans une voiture a 40°C, coup de chaleur irreversible\n• Axe 2 : Dialogue d'abord - alerter le voisin, expliquer les risques, proposer des alternatives (garde, ombre)\n• Axe 3 : Voie legale si recidive - signaler a la SPA, police municipale, ou appeler le 17\n\n⚖️ DISCUSSION (1 min)\n• Pour l'action : devoir moral de proteger un etre vivant, non-assistance possible\n• Nuances : ne pas briser la vitre soi-meme (risque juridique), privilegier le dialogue\n• Reference : Art. 521-1 Code penal, maltraitance animale = 3 ans prison + 45 000 euros\n\n✅ CONCLUSION (0.5 min)\nJ'agis par etapes : dialogue, puis signalement. La protection animale est une responsabilite collective.",
  "Vous etes en colocation avec 3 personnes. L'une d'elles manifeste des comportements suicidaires. Comment reagissez-vous ?": "📋 INTRODUCTION (1 min)\nUne colocataire montre des signes suicidaires : isolement, propos alarmants, changements de comportement. Acteurs : la personne en souffrance, les colocataires, les professionnels. Problematique : comment reagir face a un risque suicidaire dans l'entourage proche ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Ecoute active - aborder le sujet directement, sans tabou, montrer sa presence et son soutien\n• Axe 2 : Ne pas rester seul face a ca - en parler aux autres colocs, coordonner une veille bienveillante\n• Axe 3 : Orienter vers des professionnels - 3114 (numero national prevention suicide), medecin, CMP\n\n⚖️ DISCUSSION (1 min)\n• Pour agir vite : 9 000 suicides/an en France, parler du suicide ne le provoque pas\n• Nuances : respecter son intimite, ne pas etre intrusif, eviter de culpabiliser\n• Reference : 3114 cree en 2022, loi sante mentale, obligation morale d'assistance\n\n✅ CONCLUSION (0.5 min)\nEcouter sans juger, orienter vers le 3114, et ne jamais porter ce poids seul. La solidarite sauve des vies.",
  "Votre voisin menace de mettre fin a ses jours. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUn voisin exprime des menaces suicidaires. Situation d'urgence potentielle. Acteurs : le voisin en detresse, moi temoin, services d'urgence. Problematique : comment reagir face a une menace suicidaire imminente ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Prise au serieux immediate - toute menace suicidaire doit etre consideree comme reelle, ne jamais minimiser\n• Axe 2 : Rester present et ecouter - maintenir le dialogue, poser des questions ouvertes, gagner du temps\n• Axe 3 : Alerter les secours - appeler le 15 (SAMU) ou le 112, ne pas hesiter a appeler le 17 si danger immediat\n\n⚖️ DISCUSSION (1 min)\n• Pour l'intervention : non-assistance a personne en danger (Art. 223-6 Code penal)\n• Nuances : ne pas forcer, ne pas promettre le secret, ne pas laisser seul\n• Reference : 3114 numero national, Art. 223-6 CP, protocole de crise suicidaire\n\n✅ CONCLUSION (0.5 min)\nFace a une menace suicidaire, j'ecoute, je reste, j'appelle les secours. Ne jamais ignorer un appel a l'aide.",
  "Un de vos amis proches vous confie qu'il triche regulierement aux examens. Quelle est votre reaction ?": "📋 INTRODUCTION (1 min)\nUn ami proche avoue tricher regulierement aux examens universitaires. Acteurs : l'ami, les autres etudiants, l'institution. Problematique : comment concilier loyaute amicale et integrite academique ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Dialogue sincere - expliquer les risques : conseil de discipline, exclusion, diplome invalide\n• Axe 2 : Injustice envers les autres - la triche fausse le classement, particulierement grave en PASS (numerus apertus)\n• Axe 3 : Responsabilite future - un medecin qui a triche met en danger ses patients, competences non acquises\n\n⚖️ DISCUSSION (1 min)\n• Pour intervenir : equite entre etudiants, securite future des patients, valeur du diplome\n• Nuances : ne pas denoncer immediatement, laisser une chance de changer, comprendre les causes\n• Reference : Reglement des examens universitaires, serment d'Hippocrate, ethique medicale\n\n✅ CONCLUSION (0.5 min)\nJe lui parle franchement des consequences et l'encourage a arreter. L'amitie vraie inclut la sincerite.",
  "Vous etes temoin d'un accident de la route. Une personne est blessee. Decrivez vos actions.": "📋 INTRODUCTION (1 min)\nAccident de la route, une victime blessee. Je suis temoin sur les lieux. Acteurs : la victime, les autres usagers, les secours. Problematique : comment agir efficacement en tant que premier temoin ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Proteger - securiser la zone (triangle, warnings), eviter le suraccident, ne pas deplacer la victime\n• Axe 2 : Alerter - appeler le 15 (SAMU) ou 112, donner localisation precise, nombre de victimes, etat apparent\n• Axe 3 : Secourir - gestes de premier secours (PLS si inconscient qui respire), couvrir, parler a la victime\n\n⚖️ DISCUSSION (1 min)\n• Pour agir : obligation legale de porter secours, chaque minute compte (golden hour)\n• Nuances : ne pas faire de gestes qu'on ne maitrise pas, ne pas donner a boire\n• Reference : Art. 223-6 CP non-assistance, protocole PAS (Proteger Alerter Secourir)\n\n✅ CONCLUSION (0.5 min)\nProteger, Alerter, Secourir : ce protocole simple peut sauver une vie. La formation PSC1 devrait etre obligatoire.",
  "Un camarade de promotion vous demande de signer la feuille de presence a sa place. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUn camarade demande de falsifier une feuille de presence. Acteurs : le camarade, moi, l'universite, les autres etudiants. Problematique : dois-je accepter par solidarite ou refuser par integrite ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Faux et usage de faux - signer pour autrui est un delit penal (Art. 441-1 CP), risque pour les deux parties\n• Axe 2 : Equite - la presence est une obligation pour tous, la tricher cree une inegalite injuste\n• Axe 3 : Comprendre la raison - ecouter pourquoi il est absent, proposer des alternatives legales\n\n⚖️ DISCUSSION (1 min)\n• Pour refuser : risque de conseil de discipline, exclusion, faux en ecriture\n• Nuances : ne pas juger, proposer d'aider autrement (partager les cours, justifier l'absence)\n• Reference : Art. 441-1 CP faux et usage de faux, reglement interieur universitaire\n\n✅ CONCLUSION (0.5 min)\nJe refuse mais sans moraliser. Je propose de l'aider autrement. L'integrite n'est pas negociable en medecine.",
  "Votre colocataire traverse une periode de depression et refuse toute aide. Comment gerez-vous la situation ?": "📋 INTRODUCTION (1 min)\nUn colocataire en depression refuse l'aide proposee. Acteurs : le colocataire, moi, les proches, les professionnels de sante. Problematique : comment aider quelqu'un qui refuse d'etre aide tout en respectant son autonomie ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Presence sans pression - rester disponible, maintenir le lien quotidien, petits gestes (repas, sorties)\n• Axe 2 : Informer sans imposer - laisser des coordonnees utiles (3114, CMP), parler de la depression sans stigmatiser\n• Axe 3 : Alerter l'entourage - prevenir famille ou amis proches si degradation, ne pas porter seul\n\n⚖️ DISCUSSION (1 min)\n• Pour la patience : forcer quelqu'un renforce le repli, le lien de confiance est essentiel\n• Nuances : si danger vital, appeler le 15 meme sans consentement, ne pas attendre trop\n• Reference : Depression touche 1 Francais sur 5, loi du 5 juillet 2011 soins psychiatriques\n\n✅ CONCLUSION (0.5 min)\nRespecter son rythme tout en veillant. La presence silencieuse est deja une forme d'aide precieuse.",
  "Vous trouvez un portefeuille contenant 500 euros et une carte d'identite dans la rue. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nDecouverte d'un portefeuille avec 500 euros et une carte d'identite. Acteurs : le proprietaire, moi, les autorites. Problematique : quelle est la conduite ethique et legale face a un objet trouve de valeur ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Obligation legale - rapporter l'objet au commissariat ou a la mairie dans les plus brefs delais\n• Axe 2 : Tenter de contacter le proprietaire - la carte d'identite permet d'identifier la personne\n• Axe 3 : Ne rien prendre - garder l'argent constitue un abus de confiance, meme sans temoin\n\n⚖️ DISCUSSION (1 min)\n• Pour restituer : honnetete, empathie (on aimerait qu'on fasse pareil), obligation morale\n• Nuances : ne pas chercher le proprietaire seul (risque), passer par les autorites\n• Reference : Art. 311-1 CP vol, Art. 321-1 recel, procedure objets trouves en mairie\n\n✅ CONCLUSION (0.5 min)\nJe depose le portefeuille intact au commissariat. L'integrite se mesure quand personne ne regarde.",
  "Un ami vous avoue qu'il conduit regulierement en etat d'ivresse. Comment reagissez-vous ?": "📋 INTRODUCTION (1 min)\nUn ami conduit regulierement en etat d'ivresse. Acteurs : l'ami, les usagers de la route, moi. Problematique : comment reagir face a un comportement qui met en danger la vie d'autrui ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Dialogue direct - expliquer les risques concrets : 30% des morts sur la route lies a l'alcool\n• Axe 2 : Proposer des alternatives - covoiturage, taxi, Sam, hebergement, cacher les cles\n• Axe 3 : Questionner la consommation - cette conduite peut reveler une dependance a l'alcool, orienter vers un medecin\n\n⚖️ DISCUSSION (1 min)\n• Pour agir fermement : 3 000 morts/an lies a l'alcool au volant, danger pour autrui\n• Nuances : ne pas denoncer directement, privilegier l'aide, mais ne pas etre complice\n• Reference : 0,5 g/L taux legal, Art. L234-1 Code de la route, retrait permis\n\n✅ CONCLUSION (0.5 min)\nJe refuse d'etre passif. Un ami qui met des vies en danger a besoin de franchise, pas de complaisance.",
  "Vous decouvrez que votre proprietaire ne respecte pas les normes de securite de l'immeuble. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nMon proprietaire ne respecte pas les normes de securite : detecteurs absents, issues bloquees, installations defectueuses. Acteurs : proprietaire, locataires, autorites. Problematique : comment faire valoir le droit a la securite sans conflit ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Signalement ecrit au proprietaire - courrier recommande detaillant les manquements, mise en demeure\n• Axe 2 : Alerter les autorites - mairie (service hygiene), prefecture si danger grave et imminent\n• Axe 3 : Se proteger juridiquement - contacter l'ADIL, conserver preuves (photos, courriers)\n\n⚖️ DISCUSSION (1 min)\n• Pour agir : securite des occupants prime, responsabilite du proprietaire (loi SRU)\n• Nuances : privilegier le dialogue d'abord, eviter la confrontation inutile\n• Reference : Loi SRU 2000, decret decence 2002, obligation detecteur fumee loi Morange 2015\n\n✅ CONCLUSION (0.5 min)\nLa securite n'est pas negociable. Dialogue d'abord, voie legale ensuite. Les locataires ont des droits.",
  "Un SDF vous demande de l'aide devant une pharmacie en plein hiver. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUne personne sans domicile fixe demande de l'aide en plein hiver devant une pharmacie. Acteurs : la personne en situation de precarite, moi, les structures d'aide. Problematique : quelle aide concrete et respectueuse apporter ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Repondre a l'urgence immediate - offrir un cafe chaud, de la nourriture, une couverture\n• Axe 2 : Orienter vers les structures - appeler le 115 (SAMU social), indiquer un centre d'hebergement\n• Axe 3 : Reconnaitre la dignite - parler avec respect, demander ce dont la personne a besoin reellement\n\n⚖️ DISCUSSION (1 min)\n• Pour agir : 600 SDF meurent par an en France, hypothermie = urgence vitale en hiver\n• Nuances : ne pas infantiliser, respecter le refus d'aide, ne pas ignorer pour autant\n• Reference : 115 SAMU social, plan Grand Froid, droit a l'hebergement d'urgence (DAHO)\n\n✅ CONCLUSION (0.5 min)\nL'aide commence par le regard et la parole. Appeler le 115 et offrir un moment d'humanite.",
  "Vous assistez a une scene de harcelement dans les transports en commun. Comment reagissez-vous ?": "📋 INTRODUCTION (1 min)\nJe suis temoin de harcelement dans un transport en commun. Acteurs : la victime, l'agresseur, les temoins passifs, moi. Problematique : comment intervenir efficacement sans se mettre en danger ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Technique des 5D - Distraire (parler a la victime d'un sujet neutre), Deleguer (alerter le conducteur)\n• Axe 2 : Documenter et temoigner - filmer discretement, noter description, proposer un temoignage a la victime\n• Axe 3 : Ne pas rester passif - l'effet temoin (bystander effect) paralyse, briser le silence collectif\n\n⚖️ DISCUSSION (1 min)\n• Pour intervenir : 8 femmes sur 10 victimes de harcelement dans les transports, devoir citoyen\n• Nuances : ne pas se mettre en danger physique, ne pas agresser l'agresseur, privilegier la desescalade\n• Reference : Loi Schiappa 2018 outrage sexiste, Art. 222-33-2-2 CP harcelement\n\n✅ CONCLUSION (0.5 min)\nIntervenir sans s'exposer : distraire, deleguer, documenter. Le silence des temoins renforce l'agresseur.",
  "Un de vos professeurs fait une remarque que vous jugez discriminatoire envers un etudiant. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUn professeur fait une remarque discriminatoire envers un etudiant en cours. Acteurs : le professeur, l'etudiant vise, la classe, l'institution. Problematique : comment reagir face a une discrimination en milieu universitaire ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Soutenir l'etudiant concerne - aller le voir apres le cours, lui montrer qu'il n'est pas seul\n• Axe 2 : Signaler par les voies officielles - doyen, mission egalite de l'universite, defenseur des droits\n• Axe 3 : Reagir sur le moment si possible - exprimer calmement son desaccord, poser une question neutre\n\n⚖️ DISCUSSION (1 min)\n• Pour agir : le silence vaut approbation, l'universite a un devoir d'exemplarite\n• Nuances : distinguer maladresse et discrimination intentionnelle, rester factuel et respectueux\n• Reference : Art. 225-1 CP discrimination, charte egalite universite, Defenseur des droits\n\n✅ CONCLUSION (0.5 min)\nSoutenir la victime d'abord, signaler ensuite. Un futur medecin doit combattre toute forme de discrimination.",
  "Votre meilleur ami vous demande de mentir a ses parents pour le couvrir. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nMon meilleur ami me demande de mentir a ses parents pour le couvrir. Acteurs : l'ami, ses parents, moi. Problematique : ou se situe la limite entre loyaute amicale et honnetete ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Comprendre la situation - pourquoi veut-il mentir ? evaluer la gravite (sortie banale vs danger reel)\n• Axe 2 : Exprimer mon malaise - dire clairement que mentir me met dans une position inconfortable\n• Axe 3 : Proposer une alternative - l'encourager a parler lui-meme, l'accompagner dans la discussion\n\n⚖️ DISCUSSION (1 min)\n• Pour refuser : le mensonge fragilise la confiance, me rend complice d'une tromperie\n• Nuances : si la situation est benigne, nuancer ; si danger (violence parentale), proteger d'abord\n• Reference : Ethique de la veracite (Kant), mais aussi devoir de protection si maltraitance\n\n✅ CONCLUSION (0.5 min)\nJe refuse de mentir mais je l'aide a trouver une solution honnete. La vraie amitie ne se construit pas sur le mensonge.",
  "Vous remarquez qu'un enfant est seul et en pleurs dans un centre commercial depuis 30 minutes. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUn enfant seul pleure dans un centre commercial depuis 30 minutes. Acteurs : l'enfant en detresse, les parents absents, moi, la securite. Problematique : comment proteger cet enfant tout en retrouvant ses parents ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Approcher calmement - se mettre a sa hauteur, le rassurer, lui demander son prenom et celui des parents\n• Axe 2 : Alerter la securite du centre - demander une annonce micro, verifier les cameras, organiser la recherche\n• Axe 3 : Ne pas quitter l'enfant - rester avec lui, ne pas le deplacer seul (suspicion possible), appeler le 17 si prolonge\n\n⚖️ DISCUSSION (1 min)\n• Pour agir vite : enfant vulnerable, risque d'enlevement ou d'accident, devoir de protection\n• Nuances : ne pas emporter l'enfant, rester visible, attendre les autorites\n• Reference : Art. 375 CC protection de l'enfance, 119 numero enfance en danger\n\n✅ CONCLUSION (0.5 min)\nRassurer, rester present, alerter la securite. La protection des enfants est l'affaire de tous les adultes.",
  "Vous surprenez un collegue en train de voler dans les vestiaires. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nJe surprends un collegue en train de voler dans les vestiaires. Acteurs : le collegue, les victimes du vol, moi temoin. Problematique : comment reagir face a un delit commis par quelqu'un que je connais ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Confrontation directe et calme - lui signifier que j'ai vu, lui demander de restituer immediatement\n• Axe 2 : Comprendre sans excuser - difficultes financieres ? addiction ? comprendre le contexte sans justifier le vol\n• Axe 3 : Signaler si necessaire - informer le responsable, car les victimes ont droit a la restitution\n\n⚖️ DISCUSSION (1 min)\n• Pour signaler : justice envers les victimes, le silence me rend complice (recel)\n• Nuances : laisser une chance de restituer d'abord, ne pas humilier publiquement\n• Reference : Art. 311-1 CP vol, Art. 321-1 recel, devoir de signalement\n\n✅ CONCLUSION (0.5 min)\nJe lui donne la chance de reparer, mais je ne serai pas complice par silence. L'honnetete n'est pas optionnelle.",
  "Un voisin age vit seul et vous n'avez pas de nouvelles depuis plusieurs jours. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUn voisin age vivant seul ne donne plus signe de vie depuis plusieurs jours. Acteurs : le voisin vulnerable, moi, les services d'urgence. Problematique : comment verifier son etat sans etre intrusif tout en assurant sa securite ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Verifications simples - sonner, appeler, regarder le courrier accumule, verifier la lumiere\n• Axe 2 : Alerter les secours - appeler le 17 (police) pour une verification de domicile si pas de reponse\n• Axe 3 : Prevention future - proposer un systeme de veille entre voisins, numero de contact d'un proche\n\n⚖️ DISCUSSION (1 min)\n• Pour agir vite : 900 000 personnes agees isolees en France, risque de chute ou malaise\n• Nuances : respecter l'intimite, ne pas forcer l'entree soi-meme, passer par les autorites\n• Reference : Plan canicule, dispositif Monalisa, registre communal des personnes vulnerables\n\n✅ CONCLUSION (0.5 min)\nMieux vaut deranger pour rien que decouvrir trop tard. La vigilance entre voisins sauve des vies agees.",
  "Votre groupe de travail decide d'exclure un etudiant car il 'ralentit le groupe'. Votre reaction ?": "📋 INTRODUCTION (1 min)\nMon groupe de travail veut exclure un etudiant juge trop lent. Acteurs : l'etudiant exclu, le groupe, moi. Problematique : comment concilier efficacite collective et inclusion ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : S'opposer a l'exclusion - rappeler que le travail de groupe inclut l'entraide, pas seulement la performance\n• Axe 2 : Identifier le vrai probleme - est-ce un manque de methode ? de comprehension ? proposer une reorganisation\n• Axe 3 : Rappeler les valeurs medicales - un futur medecin ne peut pas exclure les plus fragiles\n\n⚖️ DISCUSSION (1 min)\n• Pour l'inclusion : equite, solidarite, valeur pedagogique du groupe heterogene\n• Nuances : si la personne ne fait aucun effort, dialogue necessaire, mais l'exclusion reste injuste\n• Reference : Valeurs du serment d'Hippocrate, pedagogie collaborative, discrimination capacitiste\n\n✅ CONCLUSION (0.5 min)\nJe m'oppose a l'exclusion et propose d'adapter l'organisation. Exclure les plus faibles est contraire a l'esprit medical.",
  "Un patient refuse une transfusion sanguine pour des raisons religieuses alors que sa vie est en danger. Que pensez-vous de cette situation ?": "📋 INTRODUCTION (1 min)\nUn patient refuse une transfusion vitale pour motif religieux. Acteurs : le patient, l'equipe medicale, la famille. Problematique : comment arbitrer entre respect de l'autonomie du patient et obligation de soins ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Autonomie du patient - consentement libre et eclaire est un droit fondamental, nul ne peut etre soigne de force\n• Axe 2 : Devoir du medecin - obligation de tout mettre en oeuvre pour sauver, chercher des alternatives (EPO, cell saver)\n• Axe 3 : Cas particuliers - patient mineur ou inconscient : le medecin peut passer outre pour sauver la vie\n\n⚖️ DISCUSSION (1 min)\n• Pour le respect du refus : loi Kouchner 2002, autonomie, dignite du patient\n• Contre : serment d'Hippocrate, devoir de sauver, regret impossible apres deces\n• Reference : Loi du 4 mars 2002, Art. L1111-4 CSP, arret Senanayake CE 2001\n\n✅ CONCLUSION (0.5 min)\nRespecter le refus eclaire de l'adulte competent, tout en explorant chaque alternative. La liberte du patient prime.",
  "Faut-il dire toute la verite a un patient atteint d'une maladie incurable ? Discutez.": "📋 INTRODUCTION (1 min)\nQuestion de la verite au patient face a un diagnostic incurable. Acteurs : le patient, le medecin, la famille. Problematique : transparence totale ou verite adaptee au rythme du patient ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Droit a l'information - le patient a legalement droit a connaitre son etat, necessite pour decisions de fin de vie\n• Axe 2 : Verite progressive - adapter le discours au rythme du patient, respecter ses mecanismes de defense\n• Axe 3 : Exception therapeutique - si l'information risque de nuire gravement, le medecin peut differer (Art. L1111-2)\n\n⚖️ DISCUSSION (1 min)\n• Pour la verite : autonomie, directives anticipees, organisation personnelle, deuil anticipe\n• Nuances : la brutalite n'est pas la transparence, chaque patient est unique, respecter le droit de ne pas savoir\n• Reference : Loi Kouchner 2002, Art. L1111-2 CSP, concept d'annonce graduee\n\n✅ CONCLUSION (0.5 min)\nOui a la verite, mais adaptee et progressive. Le patient decide du rythme, pas le medecin ni la famille.",
  "Un medecin decouvre qu'un patient, chauffeur de bus, a une pathologie qui le rend dangereux au volant. Le patient refuse d'arreter de conduire. Que faire ?": "📋 INTRODUCTION (1 min)\nUn chauffeur de bus a une pathologie dangereuse pour la conduite et refuse de s'arreter. Acteurs : le patient-chauffeur, le medecin, les passagers, l'employeur. Problematique : secret medical vs securite publique ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Convaincre le patient - expliquer les risques concrets, responsabilite penale en cas d'accident\n• Axe 2 : Secret medical vs danger - le medecin ne peut pas rompre le secret sauf cas prevus par la loi\n• Axe 3 : Voie legale - orienter vers le medecin du travail ou la commission du permis de conduire\n\n⚖️ DISCUSSION (1 min)\n• Pour la securite publique : transport de dizaines de passagers, risque d'accident grave\n• Nuances : le medecin ne peut pas prevenir l'employeur directement, secret medical absolu\n• Reference : Art. R226-13 CP secret medical, Art. L234 Code route, medecin agree permis\n\n✅ CONCLUSION (0.5 min)\nConvaincre d'abord, orienter vers le medecin agree ensuite. Le secret medical a des limites face au danger collectif.",
  "Les parents d'un enfant de 5 ans refusent de le faire vacciner. Quelle est votre position ?": "📋 INTRODUCTION (1 min)\nDes parents refusent de vacciner leur enfant de 5 ans. Acteurs : l'enfant, les parents, le medecin, la collectivite. Problematique : liberte parentale vs protection de l'enfant et sante publique ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Obligation legale - 11 vaccins obligatoires depuis 2018 pour les enfants nes apres le 1er janvier 2018\n• Axe 2 : Pedagogie - expliquer les benefices (eradication variole, polio), demystifier les peurs (autisme debunke)\n• Axe 3 : Protection de l'enfant - immunite de groupe protege les plus fragiles, interet superieur de l'enfant\n\n⚖️ DISCUSSION (1 min)\n• Pour la vaccination : evidence scientifique massive, sante publique, protection des immunodeprimes\n• Nuances : ecouter les peurs sans les valider, accompagner, pas de violence ni mepris\n• Reference : Loi du 30 dec 2017 (11 vaccins), Art. 227-17 CP, OMS vaccination\n\n✅ CONCLUSION (0.5 min)\nLa vaccination est un devoir envers l'enfant et la collectivite. Convaincre par la science, pas par la contrainte.",
  "Un adolescent de 15 ans vous demande de ne pas informer ses parents de sa consultation. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nUn adolescent de 15 ans demande la confidentialite vis-a-vis de ses parents pour sa consultation. Acteurs : l'adolescent, les parents, le medecin. Problematique : droit au secret du mineur vs autorite parentale ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Droit du mineur - la loi permet au mineur de consulter seul pour certains actes (contraception, IVG, IST)\n• Axe 2 : Evaluer la situation - pourquoi le secret ? violences familiales, sexualite, addiction ? adapter la reponse\n• Axe 3 : Encourager le dialogue - proposer de l'accompagner pour en parler aux parents si possible\n\n⚖️ DISCUSSION (1 min)\n• Pour le secret : confiance dans la relation de soin, acces aux soins du mineur, autonomie progressive\n• Nuances : si danger vital ou maltraitance, obligation de signalement malgre le secret\n• Reference : Art. L1111-5 CSP, Art. 371-1 CC autorite parentale, loi du 4 mars 2002\n\n✅ CONCLUSION (0.5 min)\nRespecter le secret du mineur dans le cadre legal, sauf danger. La confiance medicale se construit aussi avec les jeunes.",
  "Doit-on accepter l'euthanasie en France ? Presentez les arguments pour et contre.": "📋 INTRODUCTION (1 min)\nDebat sur la legalisation de l'euthanasie en France. Acteurs : patients en fin de vie, soignants, societe, legislateur. Problematique : le droit de choisir sa mort est-il une liberte fondamentale ou une derive dangereuse ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Dignite et autonomie - le patient devrait pouvoir choisir face a une souffrance intolereable et irremediable\n• Axe 2 : Risques de derives - pression sur les personnes agees, handicapees, pente glissante (modele belge)\n• Axe 3 : Alternative des soins palliatifs - 75% des Francais n'y ont pas acces, developper avant de legaliser\n\n⚖️ DISCUSSION (1 min)\n• Pour : liberte individuelle, fin des souffrances, 90% des Francais favorables dans les sondages\n• Contre : interdit tuer (Hippocrate), pression sociale, insuffisance des soins palliatifs\n• Reference : Loi Claeys-Leonetti 2016, loi Condorcet 2025, modeles belge et suisse\n\n✅ CONCLUSION (0.5 min)\nDevelopper massivement les soins palliatifs d'abord, encadrer strictement l'aide a mourir ensuite. Les deux ne s'opposent pas.",
  "Un patient en fin de vie demande l'arret de son traitement. Comment abordez-vous cette situation ?": "📋 INTRODUCTION (1 min)\nUn patient en fin de vie souhaite arreter son traitement. Acteurs : le patient, l'equipe soignante, la famille. Problematique : comment respecter cette volonte tout en assurant un accompagnement digne ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Droit fondamental - la loi permet le refus de tout traitement, y compris vital (Art. L1111-4 CSP)\n• Axe 2 : Verifier le consentement - s'assurer que la decision est libre, eclairee, reiteree, sans pression exterieure\n• Axe 3 : Accompagnement palliatif - arreter le curatif ne signifie pas arreter les soins, soulager la douleur\n\n⚖️ DISCUSSION (1 min)\n• Pour le respect : autonomie du patient, dignite en fin de vie, directives anticipees\n• Nuances : ecouter la souffrance derriere la demande, proposer un soutien psy, inclure la famille\n• Reference : Loi Claeys-Leonetti 2016, sedation profonde et continue, directives anticipees\n\n✅ CONCLUSION (0.5 min)\nRespecter la volonte du patient, assurer le confort, accompagner la famille. Mourir dans la dignite est un droit.",
  "La GPA (Gestation Pour Autrui) devrait-elle etre autorisee en France ? Discutez.": "📋 INTRODUCTION (1 min)\nDebat sur la legalisation de la GPA en France. Acteurs : couples infertiles, meres porteuses, enfants, societe. Problematique : droit a l'enfant vs protection du corps de la femme ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Desir d'enfant - couples steriles, homosexuels masculins, seule option biologique pour certains\n• Axe 2 : Risques d'exploitation - marchandisation du corps, precarite des meres porteuses, tourisme proceatif\n• Axe 3 : Interet de l'enfant - droit a connaitre ses origines, filiation complexe, stabilite affective\n\n⚖️ DISCUSSION (1 min)\n• Pour : egalite d'acces a la parentalite, GPA ethique encadree (modele canadien altruiste)\n• Contre : indisponibilite du corps humain (Art. 16-7 CC), exploitation des femmes, commodification\n• Reference : Art. 16-7 Code civil, arret Mennesson CEDH 2014, loi bioethique 2021\n\n✅ CONCLUSION (0.5 min)\nLa GPA ethique et altruiste merite un debat serieux. Interdire sans nuance pousse vers le tourisme proceatif.",
  "Un medecin peut-il refuser de pratiquer une IVG pour des raisons de conscience ? Debattez.": "📋 INTRODUCTION (1 min)\nQuestion de la clause de conscience du medecin face a l'IVG. Acteurs : le medecin, la patiente, le systeme de sante. Problematique : liberte de conscience du soignant vs droit d'acces a l'IVG ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Clause de conscience - le medecin peut refuser mais DOIT orienter vers un confrere sans delai\n• Axe 2 : Droit de la patiente - l'IVG est un droit constitutionnel depuis 2024, l'acces ne doit pas etre entrave\n• Axe 3 : Realite du terrain - deserts medicaux, delais critiques (14 semaines), la clause peut devenir un obstacle\n\n⚖️ DISCUSSION (1 min)\n• Pour la clause : liberte de conscience fondamentale, ne pas forcer un acte contraire aux convictions\n• Contre : droit constitutionnel, deserts medicaux, 1 IVG sur 3 femmes, acces en danger\n• Reference : Art. L2212-8 CSP clause conscience, constitutionnalisation IVG 2024, loi Veil 1975\n\n✅ CONCLUSION (0.5 min)\nLa clause est legitime si l'orientation est immediate. Le droit de la patiente ne doit jamais etre sacrifie.",
  "Faut-il rendre le don d'organes obligatoire ? Argumentez.": "📋 INTRODUCTION (1 min)\nQuestion du don d'organes obligatoire en France. Acteurs : donneurs potentiels, receveurs en attente, familles, Etat. Problematique : solidarite nationale vs liberte individuelle sur son corps ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Penurie critique - 20 000 personnes en attente, 900 deces/an faute de greffon en France\n• Axe 2 : Systeme actuel - consentement presume (loi Caillavet 1976), registre national des refus\n• Axe 3 : Enjeux ethiques - le corps n'est pas un bien public, respect des convictions, opposition familiale\n\n⚖️ DISCUSSION (1 min)\n• Pour l'obligation : sauver des milliers de vies, solidarite collective, le corps apres la mort\n• Contre : inviolabilite du corps humain, liberte de conscience, traumatisme des familles\n• Reference : Loi Caillavet 1976, loi sante 2016 consentement presume, Agence de biomedecine\n\n✅ CONCLUSION (0.5 min)\nPas d'obligation mais meilleure information et application stricte du consentement presume. Sensibiliser plutot que contraindre.",
  "Un chercheur decouvre une erreur dans ses resultats deja publies. Que doit-il faire ?": "📋 INTRODUCTION (1 min)\nUn chercheur realise qu'une erreur existe dans ses resultats publies. Acteurs : le chercheur, la communaute scientifique, les patients potentiellement concernes. Problematique : comment gerer une erreur scientifique avec integrite ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Signaler immediatement - publier un erratum ou retirer l'article (retraction), contacter la revue\n• Axe 2 : Evaluer l'impact - l'erreur change-t-elle les conclusions ? d'autres recherches s'appuient-elles dessus ?\n• Axe 3 : Transparence totale - informer les co-auteurs, l'institution, les equipes qui ont cite l'article\n\n⚖️ DISCUSSION (1 min)\n• Pour la correction : integrite scientifique, base de la confiance, securite des patients (recherche medicale)\n• Nuances : distinguer erreur honnete et fraude, l'erratum n'est pas une honte, c'est de la rigueur\n• Reference : Charte d'integrite scientifique, COPE guidelines, affaire Raoult/Lancet comme contre-exemple\n\n✅ CONCLUSION (0.5 min)\nCorriger est un devoir, pas un echec. La credibilite de la science repose sur l'honnetete de ses acteurs.",
  "L'acces aux soins est-il un droit ou un privilege ? Discutez.": "📋 INTRODUCTION (1 min)\nQuestion de l'acces aux soins comme droit fondamental ou privilege de fait. Acteurs : patients, systeme de sante, Etat, professionnels. Problematique : le droit theorique a la sante se traduit-il en realite pour tous ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Droit reconnu - preambule Constitution 1946, Securite sociale, CMU-C/C2S, AME pour les sans-papiers\n• Axe 2 : Realite des inegalites - deserts medicaux, renoncement aux soins (3M de Francais), depassements d'honoraires\n• Axe 3 : Determinants sociaux - les plus pauvres vivent 13 ans de moins, acces correle au revenu et au territoire\n\n⚖️ DISCUSSION (1 min)\n• Pour le droit effectif : justice sociale, sante = bien commun, investissement et pas un cout\n• Nuances : tension entre droit et moyens, numerus clausus historique, deserts medicaux persistants\n• Reference : Art. 11 Preambule 1946, CMU 1999, rapport DREES inegalites sante\n\n✅ CONCLUSION (0.5 min)\nC'est un droit dans les textes, un privilege dans les faits. Reduire cet ecart est le defi central de notre systeme de sante.",
  "Peut-on imposer un traitement a un patient atteint de troubles psychiatriques qui refuse les soins ?": "📋 INTRODUCTION (1 min)\nSituation de tension entre protection du patient psychiatrique et respect de son autonomie. Acteurs : patient, psychiatre, famille, juge. Problematique : dans quelles limites peut-on contraindre aux soins ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Cadre legal - soins sans consentement possibles (SDRE, SDT) si danger pour soi ou autrui. Loi du 5 juillet 2011 revisee en 2013.\n• Axe 2 : Ethique - le trouble altere-t-il le discernement ? Distinction entre refus eclaire et refus pathologique.\n• Axe 3 : Alternatives - soins ambulatoires sous contrainte, programmes de rehabilitation, alliance therapeutique.\n\n⚖️ DISCUSSION (1 min)\n• Pour : protection de la personne vulnerable, retablissement du discernement, securite publique\n• Contre : atteinte a la liberte individuelle, risque de derive, stigmatisation de la maladie mentale\n• Reference : Loi du 5 juillet 2011, article L3212-1 CSP\n\n✅ CONCLUSION (0.5 min)\nLa contrainte doit rester exceptionnelle, proportionnee et controlee par le juge. Ouverture : comment ameliorer l'acces precoce aux soins pour eviter la contrainte ?",
  "Un medecin peut-il refuser de soigner un patient qui l'a agresse verbalement ?": "📋 INTRODUCTION (1 min)\nMedecin confronte a une agression verbale par un patient. Acteurs : medecin, patient, cadre deontologique. Problematique : le droit a la dignite du soignant peut-il justifier un refus de soins ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Droit du medecin - article R4127-47 du Code de deontologie autorise le refus sauf urgence. Conditions : continuite des soins assuree.\n• Axe 2 : Obligation de soins - l'urgence vitale interdit tout refus (article 223-6 Code penal, non-assistance a personne en danger).\n• Axe 3 : Contexte - comprendre l'origine de l'agressivite (douleur, angoisse, pathologie psychiatrique, precarite).\n\n⚖️ DISCUSSION (1 min)\n• Pour le refus : protection du soignant, dignite professionnelle, qualite de la relation de soin\n• Contre : vulnerabilite du patient, risque de rupture de soins, devoir d'humanite\n• Reference : Article R4127-47 Code de deontologie medicale\n\n✅ CONCLUSION (0.5 min)\nLe refus est possible hors urgence avec reorientation, mais le medecin doit d'abord chercher a desamorcer. Ouverture : comment mieux proteger les soignants contre les violences ?",
  "Faut-il autoriser la recherche sur les cellules souches embryonnaires ? Debattez.": "📋 INTRODUCTION (1 min)\nQuestion ethique majeure : utiliser des embryons humains pour la recherche biomedicale. Acteurs : chercheurs, bioeticiens, legislateur, patients. Problematique : le progres medical justifie-t-il l'utilisation d'embryons ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Potentiel therapeutique - medecine regenerative, traitement de Parkinson, diabete, lesions medullaires. Cellules pluripotentes uniques.\n• Axe 2 : Statut de l'embryon - debat entre dignite humaine des la conception et absence de projet parental pour les embryons surnumeraires.\n• Axe 3 : Alternatives - cellules iPS (reprogrammation), mais pas encore equivalentes. Cadre legal francais : loi bioethique 2021 autorise sous conditions strictes.\n\n⚖️ DISCUSSION (1 min)\n• Pour : espoirs therapeutiques immenses, embryons voues a la destruction, encadrement strict possible\n• Contre : instrumentalisation du vivant, pente glissante, objections religieuses et philosophiques\n• Reference : Loi bioethique 2021, avis du CCNE n°129\n\n✅ CONCLUSION (0.5 min)\nFavorable sous encadrement strict par l'Agence de biomedecine. Ouverture : les cellules iPS rendront-elles ce debat obsolete ?",
  "L'experimentation animale est-elle justifiable pour la recherche medicale ?": "📋 INTRODUCTION (1 min)\nDebat entre progres medical et souffrance animale. Acteurs : chercheurs, associations de protection animale, patients, legislateur. Problematique : peut-on ethiquement faire souffrir des animaux pour sauver des vies humaines ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Necessite scientifique - 80% des prix Nobel de medecine issus de recherche animale. Tests de toxicite et pharmacologie indispensables avant essais humains.\n• Axe 2 : Souffrance animale - capacite de sentience prouvee. Principe des 3R (Remplacer, Reduire, Raffiner) impose par la directive europeenne 2010/63/UE.\n• Axe 3 : Alternatives emergentes - organes sur puce, modelisation informatique, cultures cellulaires 3D, mais encore insuffisantes pour remplacer totalement.\n\n⚖️ DISCUSSION (1 min)\n• Pour : securite des patients, avancees medicales majeures, cadre ethique existant\n• Contre : souffrance infligee, pertinence parfois limitee (extrapolation inter-especes), progres des alternatives\n• Reference : Directive europeenne 2010/63/UE, principe des 3R de Russell et Burch\n\n✅ CONCLUSION (0.5 min)\nJustifiable aujourd'hui si les 3R sont rigoureusement appliques, avec objectif de reduction progressive. Ouverture : quand les alternatives seront-elles suffisantes pour eliminer l'experimentation animale ?",
  "Un patient vous demande de lui prescrire un arret de travail de complaisance. Que faites-vous ?": "📋 INTRODUCTION (1 min)\nPatient demandant un certificat medical injustifie. Acteurs : patient, medecin, employeur, Securite sociale. Problematique : comment gerer cette demande sans rompre la relation de confiance ni violer la deontologie ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Interdiction legale - article R4127-28 du Code de deontologie interdit les certificats de complaisance. Sanctions ordinales et penales possibles (faux certificat).\n• Axe 2 : Ecoute du patient - comprendre la demande reelle : epuisement professionnel non exprime, souffrance au travail, burn-out naissant ?\n• Axe 3 : Alternatives - proposer un examen approfondi, orienter vers la medecine du travail, evoquer un mal-etre sous-jacent.\n\n⚖️ DISCUSSION (1 min)\n• Pour le refus : integrite professionnelle, cout pour la collectivite (4 milliards/an d'arrets abusifs), confiance dans le systeme\n• Nuances : la demande peut reveler une souffrance reelle, refus brutal peut rompre le lien therapeutique\n• Reference : Article R4127-28, sanctions de l'Ordre des medecins\n\n✅ CONCLUSION (0.5 min)\nRefuser fermement mais avec empathie, explorer la souffrance sous-jacente. Ouverture : comment mieux detecter la souffrance au travail en consultation ?",
  "Un couple demande un diagnostic preimplantatoire pour choisir le sexe de leur enfant. Votre position ?": "📋 INTRODUCTION (1 min)\nCouple souhaitant utiliser le DPI a des fins de selection du sexe. Acteurs : couple, medecin, geneticien, legislateur. Problematique : le DPI peut-il etre utilise pour des choix non medicaux ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Cadre legal - en France, DPI strictement limite aux maladies genetiques graves et incurables (loi bioethique). Selection du sexe interdite sauf maladie liee au sexe.\n• Axe 2 : Derive eugeniste - risque de bebe sur mesure, selection de traits non pathologiques, inegalite d'acces entre pays.\n• Axe 3 : Dimension culturelle - dans certaines cultures, preference pour un sexe. Desequilibre demographique observe en Chine et Inde.\n\n⚖️ DISCUSSION (1 min)\n• Pour l'interdiction : dignite humaine, prevention de l'eugenisme, egalite des sexes\n• Contre : autonomie reproductive du couple, liberte individuelle, argument libertarien\n• Reference : Loi bioethique 2021, article L2131-4 CSP, Convention d'Oviedo article 14\n\n✅ CONCLUSION (0.5 min)\nRefus clair : le DPI doit rester un outil medical, pas de convenance. Ouverture : comment reguler le tourisme procréatif vers des pays moins restrictifs ?",
  "Un patient vous confie qu'il a agresse quelqu'un. Etes-vous tenu au secret medical ?": "📋 INTRODUCTION (1 min)\nPatient avouant une agression lors d'une consultation. Acteurs : patient, medecin, victime potentielle, justice. Problematique : le secret medical protege-t-il les aveux d'infractions penales ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Secret medical absolu - article R4127-4 et article 226-13 du Code penal. Le medecin ne peut pas denoncer, meme pour un crime passe.\n• Axe 2 : Exceptions legales - mineur ou personne vulnerable victime (article 226-14), danger imminent pour la vie d'autrui. Mais l'auteur n'est pas une exception.\n• Axe 3 : Posture du medecin - ecouter sans juger, evaluer le risque de recidive, accompagner vers une demarche volontaire de reparation.\n\n⚖️ DISCUSSION (1 min)\n• Pour le maintien du secret : confiance indispensable a la relation de soin, protection du patient, cadre legal clair\n• Contre : protection de la victime, sentiment d'injustice, risque de recidive\n• Reference : Article 226-13 Code penal, article R4127-4 Code de deontologie\n\n✅ CONCLUSION (0.5 min)\nLe secret s'impose sauf danger imminent pour autrui. Encourager le patient a se signaler lui-meme. Ouverture : comment gerer le poids psychologique du secret pour le soignant ?",
  "Les reseaux sociaux ont-ils un impact sur la sante mentale des jeunes ? Analysez.": "📋 INTRODUCTION (1 min)\nUsage massif des reseaux sociaux par les adolescents (95% des 13-17 ans). Acteurs : jeunes, parents, plateformes, professionnels de sante. Problematique : les reseaux sociaux constituent-ils un facteur de risque pour la sante mentale des jeunes ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Effets negatifs documentes - augmentation anxiete et depression (+40% chez les ados gros utilisateurs), cyberharcelement, troubles du sommeil, comparaison sociale toxique.\n• Axe 2 : Mecanismes - dopamine et addiction au scroll, algorithmes de polarisation, exposition a des contenus pro-anorexie ou automutilatoires.\n• Axe 3 : Nuances positives - lien social pour les jeunes isoles, communautes de soutien, sensibilisation a la sante mentale, expression identitaire.\n\n⚖️ DISCUSSION (1 min)\n• Risques : epidemie de mal-etre adolescent, correlation avec hausse des suicides, perte d'attention\n• Nuances : correlation n'est pas causalite, l'usage modere peut etre benefique, responsabilite parentale\n• Reference : Rapport du Surgeon General americain 2023, majorite numerique a 15 ans en France\n\n✅ CONCLUSION (0.5 min)\nImpact reel mais modulable par l'education et la regulation. Ouverture : faut-il interdire les reseaux sociaux avant 16 ans comme le propose le legislateur ?",
  "Comment lutter contre les deserts medicaux en France ?": "📋 INTRODUCTION (1 min)\n6 millions de Francais en zone sous-dense, 11% sans medecin traitant. Acteurs : medecins, ARS, collectivites, patients. Problematique : quelles solutions pour garantir l'acces aux soins sur tout le territoire ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Mesures incitatives - aides a l'installation (CESP), maisons de sante pluriprofessionnelles, exonerations fiscales en ZRR.\n• Axe 2 : Reorganisation de l'offre - telemedicine, delegation de taches (IPA, pharmaciens), medecins salaries en centres de sante municipaux.\n• Axe 3 : Formation - augmentation du numerus apertus, stages obligatoires en zone sous-dense, creation de postes d'assistants medicaux.\n\n⚖️ DISCUSSION (1 min)\n• Pour les mesures coercitives : urgence sanitaire, egalite d'acces, modele de certains pays (Canada)\n• Contre : liberte d'installation constitutionnelle, risque de fuite des vocations, inefficacite prouvee\n• Reference : Loi Ma Sante 2022, rapport DREES sur la demographie medicale\n\n✅ CONCLUSION (0.5 min)\nPrivilegier l'incitation et la reorganisation plutot que la contrainte. Ouverture : la telemedicine peut-elle reellement compenser l'absence physique de medecins ?",
  "L'intelligence artificielle va-t-elle remplacer les medecins ? Discutez.": "📋 INTRODUCTION (1 min)\nProgres spectaculaires de l'IA en imagerie, diagnostic, aide a la decision. Acteurs : medecins, patients, developpeurs, institutions. Problematique : l'IA est-elle un outil complementaire ou un substitut au medecin ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Performances de l'IA - superieure en radiologie (detection melanome), pathologie, analyse de donnees massives. Rapidite et reproductibilite.\n• Axe 2 : Limites - absence d'empathie, biais algorithmiques, donnees d'entrainement non representatives, responsabilite juridique floue.\n• Axe 3 : Relation humaine irremplacable - annonce de diagnostic, accompagnement psychologique, decision partagee, examen clinique global.\n\n⚖️ DISCUSSION (1 min)\n• Pour l'IA : reduction des erreurs diagnostiques, acces dans les deserts medicaux, gain de temps administratif\n• Contre : deshumanisation, dependance technologique, cout, inegalites numeriques\n• Reference : Rapport Villani 2018, strategie nationale IA en sante, reglement europeen sur l'IA 2024\n\n✅ CONCLUSION (0.5 min)\nL'IA augmentera le medecin mais ne le remplacera pas. Le coeur du metier reste la relation humaine. Ouverture : comment former les futurs medecins a l'utilisation ethique de l'IA ?",
  "Quel est le role du medecin face aux inegalites sociales de sante ?": "📋 INTRODUCTION (1 min)\nEcart de 13 ans d'esperance de vie entre un cadre et un ouvrier en France. Acteurs : medecins, patients precaires, institutions, travailleurs sociaux. Problematique : le medecin a-t-il un role a jouer au-dela du soin individuel ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Constat - gradient social de sante, renoncement aux soins pour raisons financieres (25% des plus modestes), illitterisme en sante.\n• Axe 2 : Role clinique - depistage de la precarite, adaptation du langage, orientation vers les dispositifs sociaux (CMU-C, AME, PASS).\n• Axe 3 : Role collectif - medecin comme acteur de sante publique, plaidoyer pour des politiques de sante equitables, education a la sante.\n\n⚖️ DISCUSSION (1 min)\n• Pour un role actif : determinants sociaux expliquent 60% de la sante, mission de service public, deontologie\n• Contre : risque de surcharge, formation insuffisante au social, limites du soin individuel face aux causes structurelles\n• Reference : Rapport Haut Conseil de Sante Publique 2009, concept de litteratie en sante\n\n✅ CONCLUSION (0.5 min)\nLe medecin doit integrer la dimension sociale dans sa pratique quotidienne. Ouverture : faut-il renforcer la formation en sciences sociales des etudiants en medecine ?",
  "Les mesures de confinement etaient-elles justifiees pendant la pandemie de COVID-19 ?": "📋 INTRODUCTION (1 min)\nConfinements successifs en 2020-2021 pour freiner la pandemie. Acteurs : gouvernement, soignants, population, economie. Problematique : la restriction des libertes etait-elle proportionnee a la menace sanitaire ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Efficacite sanitaire - reduction du R0, desengorgement des hopitaux, gain de temps pour la vaccination. Estimation de 600 000 vies sauvees en Europe.\n• Axe 2 : Cout humain et social - sante mentale (hausse de 25% des depressions), violences intrafamiliales (+30%), retards scolaires, isolement des personnes agees.\n• Axe 3 : Cout economique - recession de -8% du PIB en 2020, dette publique massive, impact sur les petites entreprises et independants.\n\n⚖️ DISCUSSION (1 min)\n• Pour : principe de precaution, saturation hospitaliere reelle, absence d'alternative initiale\n• Contre : mesures disproportionnees, inegalites amplifiees, strategies alternatives (Suede), atteinte aux libertes\n• Reference : Article L3131-15 CSP (etat d'urgence sanitaire), rapport du Senat juin 2021\n\n✅ CONCLUSION (0.5 min)\nJustifie dans l'urgence initiale mais les confinements prolonges auraient du ceder la place a des mesures ciblees. Ouverture : comment mieux preparer le systeme de sante aux prochaines pandemies ?",
  "La medecine preventive devrait-elle primer sur la medecine curative ?": "📋 INTRODUCTION (1 min)\nLa France consacre 95% de ses depenses de sante au curatif et seulement 5% a la prevention. Acteurs : medecins, patients, Assurance maladie, sante publique. Problematique : un reequilibrage vers la prevention est-il souhaitable et realisable ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Benefices de la prevention - 40% des cancers evitables, vaccination, depistage precoce. 1 euro investi en prevention = 4 euros economises en curatif.\n• Axe 2 : Limites - certaines maladies non prevenibles (genetiques, auto-immunes), risque de culpabilisation du patient, inegalites d'acces a la prevention.\n• Axe 3 : Modele integre - complementarite plutot qu'opposition, prevention primaire (education), secondaire (depistage), tertiaire (rechute).\n\n⚖️ DISCUSSION (1 min)\n• Pour la priorite preventive : cout-efficacite, qualite de vie, reduction de la mortalite evitable\n• Contre : on ne peut pas abandonner les malades actuels, resultats a long terme difficiles a valoriser politiquement\n• Reference : Strategie nationale de sante 2018-2022, OMS \"Prevention saves lives\"\n\n✅ CONCLUSION (0.5 min)\nNon pas primer mais reequilibrer : doubler la part du preventif. Ouverture : comment motiver les patients a adopter des comportements preventifs ?",
  "Faut-il limiter l'acces aux informations medicales sur Internet pour les patients ?": "📋 INTRODUCTION (1 min)\n70% des Francais cherchent des informations sante en ligne avant ou apres une consultation. Acteurs : patients, medecins, sites web, autorites sanitaires. Problematique : l'information medicale en ligne est-elle benefique ou dangereuse pour les patients ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Risques - desinformation, autodiagnostic errone, cyberchondrie (anxiete liee aux recherches), retard de consultation, fake news sante.\n• Axe 2 : Benefices - patient mieux informe et plus actif, empowerment, acces dans les zones sous-dotees, decision partagee facilitee.\n• Axe 3 : Solutions - labellisation des sites fiables (HONcode), education a la litteratie numerique en sante, sites institutionnels (Ameli, HAS).\n\n⚖️ DISCUSSION (1 min)\n• Pour la limitation : protection des patients vulnerables, lutte contre la desinformation, primaute de l'expertise medicale\n• Contre : liberte d'information, paternalisme medical depasse, impossible techniquement, droit du patient a l'information\n• Reference : Certification HONcode, loi Kouchner 2002 droit a l'information du patient\n\n✅ CONCLUSION (0.5 min)\nNon limiter mais encadrer et eduquer. Le medecin doit guider le patient vers des sources fiables. Ouverture : comment integrer les recherches en ligne du patient dans la consultation ?",
  "Les addictions (tabac, alcool, drogues) sont-elles une maladie ou un choix ? Debattez.": "📋 INTRODUCTION (1 min)\nLes addictions touchent des millions de personnes en France (13M fumeurs, 5M buveurs excessifs). Acteurs : patients, addictologues, societe, legislateur. Problematique : la conception de l'addiction comme maladie ou choix influence-t-elle la prise en charge ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Arguments pour la maladie - modifications neurobiologiques du circuit de la recompense, vulnerabilite genetique (40-60%), criteres diagnostiques du DSM-5.\n• Axe 2 : Arguments pour le choix - initiation volontaire, capacite d'arret spontane chez certains, responsabilite individuelle, contexte social.\n• Axe 3 : Modele biopsychosocial - interaction genes-environnement-psychologie. L'addiction est un trouble complexe, ni purement biologique ni purement moral.\n\n⚖️ DISCUSSION (1 min)\n• Pour maladie : destigmatisation, acces aux soins, efficacite des traitements medicaux (substitution)\n• Pour choix : responsabilisation, prevention par l'education, danger de la deresponsabilisation totale\n• Reference : Modele neurobiologique de Volkow (NIDA), classification CIM-11 de l'OMS\n\n✅ CONCLUSION (0.5 min)\nL'addiction est une maladie chronique du cerveau declenchee dans un contexte biopsychosocial. Ouverture : la vision maladie change-t-elle la politique penale sur les drogues ?",
  "La telemedicine peut-elle remplacer la consultation en presentiel ?": "📋 INTRODUCTION (1 min)\nExplosion de la telemedicine pendant le COVID (de 10 000 a 1 million de teleconsultations/semaine en 2020). Acteurs : medecins, patients, ARS, assurance maladie. Problematique : la telemedicine est-elle un complement ou un substitut a la consultation classique ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Avantages - acces en zone sous-dense, gain de temps, suivi des maladies chroniques, continuite des soins, reduction des deplacements.\n• Axe 2 : Limites cliniques - absence d'examen physique (palpation, auscultation), difficulte d'evaluation non verbale, risque d'erreur diagnostique.\n• Axe 3 : Fracture numerique - exclusion des personnes agees, precaires, zones blanches. Necessite d'equipement et de competences numeriques.\n\n⚖️ DISCUSSION (1 min)\n• Pour : democratisation de l'acces, efficience, satisfaction des patients pour le renouvellement d'ordonnance\n• Contre : deshumanisation, inegalites d'acces numerique, derives commerciales de plateformes privees\n• Reference : Avenant 6 a la Convention medicale, remboursement 100% depuis 2018\n\n✅ CONCLUSION (0.5 min)\nComplement indispensable mais ne peut remplacer le presentiel pour l'examen clinique. Ouverture : comment garantir la qualite de la teleconsultation face a la multiplication des plateformes ?",
  "Quelle place pour la medecine traditionnelle/alternative dans le systeme de sante ?": "📋 INTRODUCTION (1 min)\n40% des Francais ont recours aux medecines alternatives (homeopathie, acupuncture, osteopathie). Acteurs : patients, praticiens conventionnels et alternatifs, Securite sociale. Problematique : faut-il integrer ou exclure ces pratiques du systeme de sante ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Demande des patients - approche holistique, insatisfaction face a la medecine conventionnelle, effet placebo significatif (30%), besoin d'ecoute.\n• Axe 2 : Absence de preuve - la plupart des medecines alternatives n'ont pas de preuves scientifiques solides (EBM). Deremboursement de l'homeopathie en 2021.\n• Axe 3 : Risques - retard diagnostique, derives sectaires (Miviludes), interactions medicamenteuses, exercice illegal de la medecine.\n\n⚖️ DISCUSSION (1 min)\n• Pour l'integration : repondre a la demande, complementarite, certaines pratiques validees (acupuncture pour la douleur)\n• Contre : manque de preuves, danger du relativisme scientifique, cout pour la collectivite\n• Reference : Rapport de l'Academie de medecine 2013, deremboursement homeopathie 2021\n\n✅ CONCLUSION (0.5 min)\nAccepter les pratiques ayant des preuves, encadrer les autres, interdire les dangereuses. Ouverture : comment repondre au besoin d'ecoute et de globalite dans la medecine conventionnelle ?",
  "Le systeme de sante francais est-il en crise ? Analysez les causes et proposez des solutions.": "📋 INTRODUCTION (1 min)\nUrgences saturees, penuries de soignants, dette hospitaliere de 30 milliards. Acteurs : soignants, patients, Etat, Assurance maladie. Problematique : quelles sont les causes profondes de la crise et comment y remedier ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Causes structurelles - numerus clausus pendant 40 ans, T2A generant une logique de rentabilite, vieillissement de la population, maladies chroniques en hausse.\n• Axe 2 : Crise humaine - burn-out des soignants (50% en epuisement), perte d'attractivite, fuite vers le liberal ou l'etranger, manque de reconnaissance.\n• Axe 3 : Solutions - revalorisation des salaires (Segur de la sante), reforme du financement, investissement dans la prevention, delegation de taches.\n\n⚖️ DISCUSSION (1 min)\n• Urgences : recrutement massif, amelioration des conditions de travail, revalorisation salariale effective\n• Long terme : reforme du financement (sortir du tout-T2A), virage ambulatoire, prevention renforcee\n• Reference : Segur de la sante 2020, rapport Claris sur les urgences\n\n✅ CONCLUSION (0.5 min)\nLa crise est reelle et multifactorielle. Elle necessite une reforme systemique, pas des rustines. Ouverture : le modele francais de protection sociale universelle est-il encore viable financierement ?",
  "Comment concilier secret medical et protection de la societe (maladies contagieuses) ?": "📋 INTRODUCTION (1 min)\nTension entre confidentialite du patient et protection collective face aux epidemies. Acteurs : patient, medecin, ARS, societe. Problematique : jusqu'ou le secret medical peut-il ceder devant l'interet collectif ?\n\n🔍 ANALYSE (2-3 min)\n• Axe 1 : Secret medical - principe fondamental (article 226-13 CP), confiance necessaire pour que les patients consultent et declarent leurs symptomes.\n• Axe 2 : Obligations de declaration - maladies a declaration obligatoire (MDO, 36 pathologies), signalement anonymise a l'ARS, tracage des contacts.\n• Axe 3 : Equilibre - le systeme francais anonymise les donnees : le medecin declare mais le patient n'est pas identifie publiquement. Consentement eclaire quand possible.\n\n⚖️ DISCUSSION (1 min)\n• Pour la protection collective : urgence sanitaire, responsabilite envers les tiers, precedent COVID (tracage)\n• Pour le secret : sans confiance, les patients ne consultent plus et la sante publique se degrade\n• Reference : Article L3113-1 CSP (declaration obligatoire), RGPD et donnees de sante\n\n✅ CONCLUSION (0.5 min)\nLe systeme francais de declaration anonymisee est un bon compromis. Ouverture : le tracage numerique des contacts a-t-il franchi une ligne rouge pendant le COVID ?",
